<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#1877f2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filanidialakoro</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#1877f2;color:white;padding:12px;text-align:center;border-radius:10px;font-weight:bold}
.header img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid white;display:block;margin:0 auto 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:white;padding:16px;border-radius:10px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1);cursor:pointer;font-weight:bold}
#content{background:white;margin-top:12px;padding:12px;border-radius:10px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.btn{border:none;padding:11px;border-radius:8px;width:100%;font-weight:bold;color:white;cursor:pointer;margin-top:5px}
.btn-blue{background:#1877f2} .btn-green{background:#42b72a} .btn-orange{background:#ff9800} .btn-red{background:#e74c3c}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px} th,td{border:1px solid #ddd;padding:6px}
.section{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #e0e0e0}
.med-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.med-row select{flex:2} .med-row input{flex:1}
.total-box{background:#e3f2fd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px}
.somme-box{background:#e8f5e9;padding:6px;border-radius:6px;text-align:center;font-weight:bold;color:#2e7d32}
.jour-box{background:#fff3cd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #ffca28}
.jour-box2{background:#d4edda;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #28a745}
.pres-menu{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.pres-menu button{white-space:nowrap;padding:9px 12px;border:1px solid #ddd;border-radius:20px;background:#f8f9fa;font-weight:bold;cursor:pointer}
.pres-menu button.active{background:#1877f2;color:#fff;border-color:#1877f2}
.pres-page{display:none}.pres-page.active{display:block}
.badge-pres{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold;color:#fff}
.badge-green{background:#42b72a}.badge-orange{background:#ff9800}.badge-red{background:#e74c3c}
.pres-info{background:#e8f5e9;padding:10px;border-radius:8px;text-align:center;font-weight:bold;font-size:13px;margin-bottom:8px}
.dette-menu{display:flex;gap:6px;margin:8px 0}
.dette-menu button{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;background:#f8f9fa;font-weight:bold;cursor:pointer}
.dette-menu button.active{background:#1877f2;color:#fff}
.dette-page{display:none}.dette-page.active{display:block}
.reste-box{background:#ffebee;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #e74c3c;color:#c62828}
.stock-alerte-box{display:flex;gap:6px;margin:8px 0}
.stock-alerte-box div{flex:1;padding:10px;border-radius:8px;text-align:center;font-weight:bold;font-size:13px}
.badge-stock{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold;color:#fff;white-space:nowrap}
.caisse-menu{display:flex;gap:6px;margin:8px 0}
.caisse-menu button{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;background:#f8f9fa;font-weight:bold;cursor:pointer}
.caisse-menu button.active{background:#1877f2;color:#fff}
.caisse-page{display:none}.caisse-page.active{display:block}
.caisse-reste{background:#e8f5e9;padding:12px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #42b72a;font-size:16px}
/* SEULEMENT EXPIRATION */
.expire-box{display:flex;gap:6px;margin:8px 0}
.expire-box div{flex:1;padding:10px;border-radius:8px;text-align:center;font-weight:bold;font-size:13px}
</style>
</head>
<body>
<div class="header" id="header"></div>
<div class="grid" id="grid"></div>
<div id="content"></div>
<div id="gpsStatus" style="text-align:center;font-size:12px;color:#666;margin-top:8px"></div>
<script>
const firebaseConfig = {
  apiKey: "COLLE TA VRAIE CLE ICI - REGARDE HISTORY",
  authDomain: "filanidialakoro.firebaseapp.com",
  databaseURL: "https://filanidialakoro-default-rtdb.firebaseio.com",
  projectId: "filanidialakoro",
  storageBucket: "filanidialakoro.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let role = new URLSearchParams(location.search).get('role');
if(role){ localStorage.setItem('mon_role', role); }
else { role = localStorage.getItem('mon_role') || 'patron'; }
const isPatron = role==='patron';
document.getElementById('header').innerHTML = isPatron ? '<img src="icon-512.png" onerror="this.style.display=\'none\'"><div>👑 PATRON - Accès complet</div><div style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</div>' : '👤 SUPPLÉANT - 2 modules';
let gridHTML=`<div class="card" onclick="openModule('medicaments')">💊 Médicaments</div><div class="card" onclick="openModule('dettes')">📒 Dettes Payé</div>`;
if(isPatron){ gridHTML+=`<div class="card" onclick="openModule('caisse')">💰 Caisse Journalière</div><div class="card" onclick="openModule('suivi')">📈 SUIVI LIVE</div><div class="card" onclick="openModule('primes')">🏆 Primes</div><div class="card" onclick="openModule('observation')">📝 Observation</div><div class="card" onclick="openModule('presence')">✅ Présence 600k</div><div class="card" onclick="openModule('localisation')">📍 Localisation GPS</div>`; }
document.getElementById('grid').innerHTML=gridHTML;
function openModule(n){ if(n==='medicaments') loadMedicaments(); if(n==='dettes') loadDettes(); if(n==='caisse') loadCaisse(); if(n==='suivi') loadSuivi(); if(n==='primes') loadPrimes(); if(n==='observation') loadObservation(); if(n==='presence') loadPresence(); if(n==='localisation') loadLocalisation(); }
function trackLocation(){
  if(!navigator.geolocation){ document.getElementById('gpsStatus').innerHTML='GPS non supporté'; return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    let lat = pos.coords.latitude; let lng = pos.coords.longitude; let acc = Math.round(pos.coords.accuracy);
    document.getElementById('gpsStatus').innerHTML = '📍 GPS activé - Position enregistrée';
    db.ref('localisations').push({ role: role, lat: lat, lng: lng, accuracy: acc, date: new Date().toLocaleString(), maps: 'https://www.google.com/maps?q='+lat+','+lng, device: navigator.userAgent.substring(0,80) });
  }, function(err){ document.getElementById('gpsStatus').innerHTML = '⚠️ GPS refusé - Autorise la localisation pour être suivi'; }, {enableHighAccuracy:true, timeout:10000});
}
trackLocation();
setInterval(trackLocation, 5*60*1000);
function loadLocalisation(){
  document.getElementById('content').innerHTML='<h3>📍 Localisation GPS - Patron seulement</h3><div id="locList">Chargement...</div>';
  db.ref('localisations').limitToLast(100).on('value', snap=>{
    let d=snap.val()||{}; let h='<table><tr><th>Date</th><th>Qui</th><th>Position</th><th>Voir</th></tr>'; let keys=Object.keys(d).reverse();
    for(let k of keys){ let l=d[k]; let badge = l.role==='patron' ? '👑 PATRON' : '👤 SUPPLÉANT'; let color = l.role==='patron' ? '#e3f2fd' : '#fff3cd'; h+=`<tr style="background:${color}"><td>${l.date}</td><td><b>${badge}</b></td><td>${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}<br><small>Précision: ${l.accuracy}m</small></td><td><a href="${l.maps}" target="_blank" style="background:#1877f2;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold">🗺️ Voir</a></td></tr>`; }
    document.getElementById('locList').innerHTML = h+'</table><br><button class="btn btn-red" onclick="if(confirm(\'Effacer ?\')) db.ref(\'localisations\').remove()">Effacer historique</button>';
  });
}
let postesData={};
function loadMedicaments(){
let h=`
<div class="section">
<b>STOCK PERMANENT</b>
<div id="stockAlerteResume"></div>
<div id="expireResume"></div>
<div style="display:flex;gap:6px;margin-top:6px">
<button class="btn btn-blue" style="flex:1" onclick="filterStock('all')">TOUT</button>
<button class="btn btn-red" style="flex:1" onclick="filterStock('rupture')">🔴 RUPTURE</button>
<button class="btn btn-orange" style="flex:1" onclick="filterStock('alerte')">🟠 ALERTE</button>
<button class="btn btn-green" style="flex:1" onclick="filterStock('ok')">🟢 OK</button>
</div>
<div style="display:flex;gap:6px;margin-top:6px">
<button class="btn btn-red" style="flex:1" onclick="filterStock('expire')">🔴 EXPIRÉ</button>
<button class="btn btn-orange" style="flex:1" onclick="filterStock('bientot')">🟠 EXPIRE BIENTÔT (60j)</button>
<button class="btn btn-green" style="flex:1" onclick="filterStock('bon')">🟢 BON</button>
</div>
${isPatron?`<input id="newMedName" placeholder="Nom nouveau médicament"><input id="newMedPrix" type="number" placeholder="Prix unitaire ex: 500"><input id="newMedSeuil" type="number" placeholder="Seuil Alerte pour ce produit ex: 10 (toi tu choisis)"><input id="newMedExpire" type="date" placeholder="Date d'expiration"><button class="btn btn-green" onclick="addMedicament()">AUGMENTER LA LISTE</button>`:''}
<div id="medTable">Chargement...</div>
<div id="totalStockBox"></div>
<div id="totalJourBox"></div>
</div>
<div class="section" style="background:#e3f2fd">
<b>👤 NOUVEAU PATIENT - Dossier Complet</b>
<input id="patientName" placeholder="Nom et Prénom du patient">
<div style="display:flex;gap:6px">
<select id="patientSexe" style="flex:1"><option value="">Sexe</option><option value="Homme">👨 Homme</option><option value="Femme">👩 Femme</option></select>
<input id="patientAge" type="number" placeholder="Âge" style="flex:1">
</div>
<textarea id="patientPlainte" rows="2" placeholder="📝 Plainte - ex: Fièvre, maux de tête depuis 3 jours..."></textarea>
<textarea id="patientExamen" rows="2" placeholder="🔬 Examen Paraclinique - ex: TDR Palu, Glycémie, Tension..."></textarea>
<input id="patientDiag" placeholder="🩺 Diagnostic - ex: Paludisme simple">
<b style="font-size:13px">💊 Traitement / Médicaments</b>
<div id="medRows"></div>
<button class="btn btn-blue" onclick="addMedRow()">+ AJOUTER UN AUTRE MÉDICAMENT</button>
<button class="btn btn-orange" onclick="saveConsultation()">✅ ENREGISTRER PATIENT + DIMINUER STOCK</button>
</div>
<div class="section">
<b>📋 HISTORIQUE PAR PATIENT</b>
<input id="searchPatient" placeholder="Rechercher patient, diagnostic..." oninput="filterPatients()">
<div id="consultTable">Chargement...</div>
</div>`;
document.getElementById('content').innerHTML=h;
loadStock(); loadConsultations(); addMedRow();
}
let stockFilter='all';
function filterStock(f){ stockFilter=f; loadStock(); }
/* SEULEMENT EXPIRATION - 60 JOURS */
function getExpireStat(dateStr){
  if(!dateStr) return {etat:'sans', label:'—', bg:''};
  let today = new Date(); today.setHours(0,0,0,0);
  let exp = new Date(dateStr); exp.setHours(0,0,0,0);
  let diff = Math.ceil((exp - today) / (1000*60*60*24));
  if(diff < 0) return {etat:'expire', label:'🔴 EXPIRÉ', bg:'#ffebee', diff:diff};
  if(diff <= 60) return {etat:'bientot', label:'🟠 EXPIRE BIENTÔT<br><small>'+diff+' jours</small>', bg:'#fff3e0', diff:diff};
  return {etat:'bon', label:'🟢 BON<br><small>'+diff+' jours</small>', bg:'', diff:diff};
}
function loadStock(){
 db.ref('postes').on('value',snap=>{
  postesData=snap.val()||{};
  let t='<table><tr><th>Nom</th><th>Stock</th><th>Seuil Alerte<br><small>Toi tu modifies</small></th><th>État Stock</th><th>Date Expiration<br><small>Toi tu mets</small></th><th>État Expiration<br><small>60 jours</small></th><th>Prix unitaire</th><th>Total de prix</th>'+(isPatron?'<th>X</th>':'')+'</tr>';
  let grandTotal=0; let nbRupture=0, nbAlerte=0, nbOk=0; let nbExpire=0, nbBientot=0, nbBon=0;
  for(let k in postesData){
    let q = postesData[k].quantite||0; let p = postesData[k].prix||0; let seuil = postesData[k].seuil; if(seuil===undefined||seuil===null||seuil==='') seuil=5;
    let total = q * p; grandTotal += total;
    let etat='', bg='';
    if(q===0){ etat='<span class="badge-stock badge-red">🔴 RUPTURE</span>'; bg='#ffebee'; nbRupture++; }
    else if(q<=seuil){ etat='<span class="badge-stock badge-orange">🟠 ALERTE</span>'; bg='#fff3e0'; nbAlerte++; }
    else { etat='<span class="badge-stock badge-green">🟢 OK</span>'; bg=''; nbOk++; }
    let expStr = postesData[k].expiration || '';
    let exp = getExpireStat(expStr);
    if(exp.etat==='expire') nbExpire++;
    else if(exp.etat==='bientot') nbBientot++;
    else if(exp.etat==='bon') nbBon++;
    if(stockFilter==='rupture' && q!==0) continue;
    if(stockFilter==='alerte' && !(q>0 && q<=seuil)) continue;
    if(stockFilter==='ok' && !(q>seuil)) continue;
    if(stockFilter==='expire' && exp.etat!=='expire') continue;
    if(stockFilter==='bientot' && exp.etat!=='bientot') continue;
    if(stockFilter==='bon' && exp.etat!=='bon') continue;
    let rowBg = bg;
    if(exp.etat==='expire') rowBg='#ffebee';
    else if(exp.etat==='bientot' && !rowBg) rowBg='#fff3e0';
    t+=`<tr style="background:${rowBg}"><td><b>${postesData[k].nom||k}</b></td><td>${isPatron?`<input id="q_${k}" type="number" value="${q}" onchange="updateQ('${k}')" style="padding:4px">`:`<b style="font-size:16px">${q}</b>`}</td><td>${isPatron?`<input id="s_${k}" type="number" value="${seuil}" onchange="updateSeuil('${k}')" placeholder="5" style="padding:4px">`:`<b>${seuil}</b>`}</td><td>${etat}</td><td>${isPatron?`<input id="e_${k}" type="date" value="${expStr}" onchange="updateExpire('${k}')" style="padding:4px">`:`<b>${expStr||'-'}</b>`}</td><td>${exp.label}</td><td>${isPatron?`<input id="p_${k}" type="number" value="${p}" onchange="updatePrix('${k}')" placeholder="0" style="padding:4px">`:`<b>${p.toLocaleString()} GNF</b>`}</td><td><b>${total.toLocaleString()} GNF</b></td>${isPatron?`<td><button onclick="deleteMed('${k}')">X</button></td>`:''}</tr>`;
  }
  t+='</table>';
  document.getElementById('medTable').innerHTML=t;
  document.getElementById('totalStockBox').innerHTML=`<div class="total-box">💰 TOTAL STOCK : ${grandTotal.toLocaleString()} GNF</div>`;
  if(document.getElementById('stockAlerteResume')){
    document.getElementById('stockAlerteResume').innerHTML=`<div class="stock-alerte-box"><div style="background:#ffebee;color:#c62828">🔴 RUPTURE<br>${nbRupture}</div><div style="background:#fff3e0;color:#ef6c00">🟠 ALERTE<br>${nbAlerte}</div><div style="background:#e8f5e9;color:#2e7d32">🟢 OK<br>${nbOk}</div></div>`;
  }
  if(document.getElementById('expireResume')){
    document.getElementById('expireResume').innerHTML=`<div class="expire-box"><div style="background:#ffebee;color:#c62828">🔴 EXPIRÉ<br>${nbExpire}</div><div style="background:#fff3e0;color:#ef6c00">🟠 EXPIRE BIENTÔT (60j)<br>${nbBientot}</div><div style="background:#e8f5e9;color:#2e7d32">🟢 BON<br>${nbBon}</div></div><p style="font-size:12px;margin:0;color:#666">Si date passée = EXPIRÉ, ne pas donner. Si il reste 60 jours ou moins = EXPIRE BIENTÔT.</p>`;
  }
  updateAllSelects(); if(document.getElementById('consultTable')) renderConsultations(allCons);
 });
}
function updateSeuil(k){ if(!isPatron) return alert('Seul le Patron'); let s=document.getElementById('s_'+k).value; db.ref('postes/'+k+'/seuil').set(parseInt(s)||0); }
function updateExpire(k){ if(!isPatron) return alert('Seul le Patron'); let v=document.getElementById('e_'+k).value; db.ref('postes/'+k+'/expiration').set(v||''); }
function getSelectHTML(){ let html='<option value="">Choisir médicament</option>'; for(let k in postesData){ let q=postesData[k].quantite||0; let seuil=postesData[k].seuil; if(seuil===undefined||seuil==='') seuil=5; let tag=''; if(q===0) tag=' 🔴 RUPTURE'; else if(q<=seuil) tag=' 🟠 ALERTE'; let exp=getExpireStat(postesData[k].expiration||''); if(exp.etat==='expire') tag+=' 🔴 EXPIRÉ'; else if(exp.etat==='bientot') tag+=' 🟠 EXPIRE BIENTÔT'; html+=`<option value="${k}">${postesData[k].nom||k} (stock:${q} - prix:${postesData[k].prix||0})${tag}</option>`; } return html; }
function addMedRow(){ let div=document.createElement('div'); div.className='med-row'; div.innerHTML=`<select class="medSelect">${getSelectHTML()}</select><input type="number" class="medQte" placeholder="Qté" value="1" style="width:70px"><button class="btn btn-red" style="width:40px;padding:6px" onclick="this.parentElement.remove()">X</button>`; document.getElementById('medRows').appendChild(div); }
function updateAllSelects(){ let selHTML=getSelectHTML(); document.querySelectorAll('.medSelect').forEach(sel=>{ let val=sel.value; sel.innerHTML=selHTML; sel.value=val; }); }
function addMedicament(){ if(!isPatron) return alert('Seul le Patron'); let nom=document.getElementById('newMedName').value.trim(); let prix=parseInt(document.getElementById('newMedPrix').value)||0; let seuil=parseInt(document.getElementById('newMedSeuil').value); if(isNaN(seuil)) seuil=5; let exp=document.getElementById('newMedExpire') ? document.getElementById('newMedExpire').value : ''; if(!nom)return; let key=nom.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now(); db.ref('postes/'+key).set({nom:nom,quantite:0,prix:prix,seuil:seuil,expiration:exp}).then(()=>{ document.getElementById('newMedName').value=''; document.getElementById('newMedPrix').value=''; document.getElementById('newMedSeuil').value=''; if(document.getElementById('newMedExpire')) document.getElementById('newMedExpire').value=''; }); }
function updateQ(k){ if(!isPatron) return alert('Seul le Patron peut changer le stock'); let q=document.getElementById('q_'+k).value; db.ref('postes/'+k+'/quantite').set(parseInt(q)||0); }
function updatePrix(k){ if(!isPatron) return alert('Seul le Patron peut changer le prix'); let p=document.getElementById('p_'+k).value; db.ref('postes/'+k+'/prix').set(parseInt(p)||0); }
function deleteMed(k){if(confirm('Supprimer?')) db.ref('postes/'+k).remove();}
function saveConsultation(){
 let patient=document.getElementById('patientName').value.trim(); if(!patient) return alert('Mets nom du patient');
 let sexe=document.getElementById('patientSexe').value||'';
 let age=document.getElementById('patientAge').value||'';
 let plainte=document.getElementById('patientPlainte').value||'';
 let examen=document.getElementById('patientExamen').value||'';
 let diagnostic=document.getElementById('patientDiag').value||'';
 let rows=document.querySelectorAll('.med-row'); let meds=[];
 for(let r of rows){ let key=r.querySelector('.medSelect').value; let qte=parseInt(r.querySelector('.medQte').value)||0; if(key && qte>0){ meds.push({key:key, nom:postesData[key]?.nom||key, qte:qte, prix:postesData[key]?.prix||0}); } }
 if(meds.length===0) return alert('Ajoute au moins 1 médicament');
 let expired = meds.filter(m=> getExpireStat(postesData[m.key]?.expiration||'').etat==='expire');
 if(expired.length>0){ if(!confirm('⚠️ ATTENTION : '+expired.map(m=>m.nom).join(', ')+' est EXPIRÉ ! Tu veux quand même donner ?')) return; }
 meds.forEach(m=>{ let cur=postesData[m.key]?.quantite||0; db.ref('postes/'+m.key+'/quantite').set(cur - m.qte); });
 db.ref('consultations').push({patient:patient, sexe:sexe, age:age, plainte:plainte, examen:examen, diagnostic:diagnostic, meds:meds, date:new Date().toLocaleString(), role:role});
 document.getElementById('patientName').value=''; document.getElementById('patientSexe').value=''; document.getElementById('patientAge').value=''; document.getElementById('patientPlainte').value=''; document.getElementById('patientExamen').value=''; document.getElementById('patientDiag').value=''; document.getElementById('medRows').innerHTML=''; addMedRow(); addMedRow(); alert('✅ '+patient+' enregistré avec '+meds.length+' médicaments');
}
let allCons={};
function loadConsultations(){ db.ref('consultations').on('value',snap=>{ allCons=snap.val()||{}; renderConsultations(allCons); });}
function renderConsultations(data){
 let h='<table><tr><th>Date</th><th>Patient<br><small>Sexe / Âge</small></th><th>📝 Plainte</th><th>🔬 Examen Para</th><th>🩺 Diagnostic</th><th>💊 Traitement + Prix</th><th>Somme Totale</th>'+(isPatron?'<th>X</th>':'')+'</tr>'; let keys=Object.keys(data).reverse(); let totalJour = 0; let qteJour = 0; let aujourdhui = new Date().toLocaleDateString();
 for(let k of keys){ let c=data[k]; let medsTxt=''; let sommeTotale=0; if(c.meds){ c.meds.forEach(m=>{ let prixReel = (m.prix && m.prix>0) ? m.prix : (postesData[m.key]?.prix||0); let pt = prixReel * m.qte; sommeTotale += pt; medsTxt+=`<div>• ${m.nom} : <b>${m.qte}</b> x ${prixReel.toLocaleString()} = ${pt.toLocaleString()} GNF</div>`; }); } else { medsTxt=c.med||''; } if(c.date && c.date.startsWith(aujourdhui)){ totalJour += sommeTotale; if(c.meds){ c.meds.forEach(m=>{ qteJour += m.qte; }); } } h+=`<tr><td>${c.date}</td><td><b>${c.patient}</b><br><small>${c.sexe||''} ${c.age?c.age+' ans':''}</small></td><td>${c.plainte||'-'}</td><td>${c.examen||'-'}</td><td><b>${c.diagnostic||'-'}</b></td><td>${medsTxt}</td><td><div class="somme-box">${sommeTotale.toLocaleString()} GNF</div></td>${isPatron?`<td><button onclick="db.ref('consultations/${k}').remove()">X</button></td>`:''}</tr>`; }
 h+='</table>'; if(document.getElementById('consultTable')) document.getElementById('consultTable').innerHTML = keys.length? h : 'Aucun patient encore'; if(document.getElementById('totalJourBox')){ document.getElementById('totalJourBox').innerHTML = `<div class="jour-box">💊 TOTAL MÉDICAMENTS VENDUS AUJOURD'HUI : ${qteJour} médicaments</div><div class="jour-box2">💰 SOMME TOTALE JOURNALIÈRE : ${totalJour.toLocaleString()} GNF</div>`; }
}
function filterPatients(){ let q=document.getElementById('searchPatient').value.toLowerCase(); let filtered={}; for(let k in allCons){ let txt=((allCons[k].patient||'')+' '+(allCons[k].diagnostic||'')+' '+(allCons[k].plainte||'')).toLowerCase(); if(txt.includes(q)) filtered[k]=allCons[k]; } renderConsultations(filtered); }

function renderCaisse(){
  let auj = new Date().toLocaleDateString(); let totalEntreeJour=0, totalSortieJour=0, totalEntreeAll=0, totalSortieAll=0;
  let hJour='<table><tr><th>Heure</th><th>Type</th><th>Motif</th><th>Montant</th></tr>'; let hHisto='<table><tr><th>Date</th><th>Type</th><th>Motif</th><th>Montant</th>'+(isPatron?'<th>X</th>':'')+'</tr>'; let all=[];
  for(let k in caisseEntrees){ let e=caisseEntrees[k]; let m=parseInt(e.montant)||0; totalEntreeAll+=m; all.push({k:k, kind:'entree', ...e}); if(e.date && e.date.startsWith(auj)){ totalEntreeJour+=m; hJour+=`<tr style="background:#e8f5e9"><td>${e.date}</td><td>💰 ${e.type}</td><td>${e.motif||'-'}</td><td><b>+ ${m.toLocaleString()} GNF</b></td></tr>`; } }
  for(let k in caisseSorties){ let s=caisseSorties[k]; let m=parseInt(s.montant)||0; totalSortieAll+=m; all.push({k:k, kind:'sortie', ...s}); if(s.date && s.date.startsWith(auj)){ totalSortieJour+=m; hJour+=`<tr style="background:#ffebee"><td>${s.date}</td><td>💸 ${s.type}</td><td>${s.motif||'-'}</td><td><b>- ${m.toLocaleString()} GNF</b></td></tr>`; } }
  hJour+='</table>'; all.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  for(let o of all){ let m=parseInt(o.montant)||0; let sign = o.kind==='entree' ? '+ ' : '- '; let bg = o.kind==='entree' ? '#e8f5e9' : '#ffebee'; let icon = o.kind==='entree' ? '💰' : '💸'; let delBtn = isPatron ? `<button onclick="deleteCaisse('${o.kind}','${o.k}')">X</button>` : ''; hHisto+=`<tr style="background:${bg}"><td>${o.date||''}</td><td>${icon} ${o.type||''}</td><td>${o.motif||'-'}</td><td><b>${sign}${m.toLocaleString()} GNF</b></td>${isPatron?`<td>${delBtn}</td>`:''}</tr>`; }
  hHisto+='</table>'; let resteJour = totalEntreeJour - totalSortieJour; let resteAll = totalEntreeAll - totalSortieAll;
  if(document.getElementById('caisseResumeJour')) document.getElementById('caisseResumeJour').innerHTML = `<div class="total-box" style="background:#e8f5e9">💰 ENTRÉE AUJOURD'HUI : ${totalEntreeJour.toLocaleString()} GNF</div><div class="total-box" style="background:#ffebee">💸 SORTIE AUJOURD'HUI : ${totalSortieJour.toLocaleString()} GNF</div><div class="caisse-reste">💰 RESTE EN CAISSE AUJOURD'HUI : ${resteJour.toLocaleString()} GNF</div><div class="total-box">📊 RESTE TOTAL (tout) : ${resteAll.toLocaleString()} GNF</div>`;
  if(document.getElementById('caisseListJour')) document.getElementById('caisseListJour').innerHTML = (totalEntreeJour===0 && totalSortieJour===0) ? 'Aucun mouvement aujourd\'hui' : hJour;
  if(document.getElementById('caisseHistoBox')) document.getElementById('caisseHistoBox').innerHTML = all.length ? hHisto : 'Aucun historique';
}

function calcResteDette(){ let total = parseInt(document.getElementById('dnTotal').value)||0; let paye = parseInt(document.getElementById('dnPaye').value)||0; let reste = total - paye; if(reste<0) reste=0; document.getElementById('dnReste').value = reste; }
function renderDettesNonPaye(){
  let h='<table><tr><th>Client</th><th>Total</th><th>Déjà Payé</th><th>Reste</th><th>Date</th>'+(isPatron?'<th>Action</th>':'')+'</tr>'; let totalReste=0, totalDette=0, totalPaye=0;
  for(let k in dettesNonPayeData){ let d = dettesNonPayeData[k]; let tot = parseInt(d.total)||0, pay = parseInt(d.paye)||0, reste = parseInt(d.reste); if(isNaN(reste)) reste = tot - pay; totalDette+=tot; totalPaye+=pay; totalReste+=reste; h+=`<tr><td><b>${d.nom}</b></td><td>${tot.toLocaleString()}</td><td>${pay.toLocaleString()}</td><td><b style="color:#c62828">${reste.toLocaleString()} GNF</b></td><td>${d.date}</td>${isPatron?`<td><button onclick="marquerDettePaye('${k}')" style="background:#42b72a;color:white;border:none;padding:6px 8px;border-radius:6px;font-weight:bold;cursor:pointer">✅ Payé</button> <button onclick="deleteDetteNonPaye('${k}')" style="background:#e74c3c;color:white;border:none;padding:6px 8px;border-radius:6px;font-weight:bold;cursor:pointer">X</button></td>`:''}</tr>`; }

  if(document.getElementById('dnTotalReste')) document.getElementById('dnTotalReste').innerHTML = `<div class="total-box">📒 Total Dettes : ${totalDette.toLocaleString()} GNF</div><div class="total-box" style="background:#fff3cd">💰 Déjà Payé : ${totalPaye.toLocaleString()} GNF</div><div class="reste-box">❌ TOTAL RESTE À RÉCUPÉRER : ${totalReste.toLocaleString()} GNF</div>`;
}
function saveDette(){let n=document.getElementById('dNom').value,m=document.getElementById('dMont').value; if(!n||!m)return; db.ref('dettes_paye').push({nom:n,montant:m,date:new Date().toLocaleString()}); document.getElementById('dNom').value=''; document.getElementById('dMont').value='';}

let presenceData = {};
function loadPresence(){
  let now = new Date(); let dateFr = now.toLocaleDateString('fr-FR'); let hh = String(now.getHours()).padStart(2,'0'); let mm = String(now.getMinutes()).padStart(2,'0'); let heureNow = hh + ':' + mm;

  <div class="pres-menu"><button class="active" onclick="showPresPage('pres-pointer',this)">📍 POINTER</button><button onclick="showPresPage('pres-liste',this)">📋 LISTE DU JOUR</button><button onclick="showPresPage('pres-retards',this)">🟠 RETARDS</button><button onclick="showPresPage('pres-absences',this)">🔴 ABSENCES</button><button onclick="showPresPage('pres-enveloppes',this)">💰 ENVELOPPES</button></div>

  db.ref('presence_600k').on('value', s=>{ presenceData = s.val() || {}; renderPresence(); });

function showPresPage(id, btn){ document.querySelectorAll('.pres-page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.pres-menu button').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); }
function renderPresence(){
  let keys = Object.keys(presenceData).reverse(); let auj = new Date().toLocaleDateString('fr-FR'); let liste = keys.filter(k=>{ let d = presenceData[k].date || ''; return d.includes(auj) || !presenceData[k].dateFr; }); if(liste.length===0) liste = keys.slice(0,20);
  let hListe = '<table><tr><th>Nom</th><th>Heure d\'arrivée</th><th>Heure de départ</th><th>Statut</th><th>Retenue</th>'+(isPatron?'<th>X</th>':'')+'</tr>'; let hRet = '<table><tr><th>Nom</th><th>Date</th><th>Heure</th><th>Retenue</th></tr>'; let hAbs = '<table><tr><th>Nom</th><th>Date</th><th>Retenue</th></tr>'; let parPersonne = {}; let nbRet=0, nbAbs=0;
  for(let k of keys){ let p = presenceData[k]; let statut = p.statut || 'Présent'; let retenue = p.retenue || 0; if(statut==='Absent' && !p.retenue) retenue = 20000; if(statut==='Retard' || statut==='RETARD') retenue = 5000; if(statut==='Présent' || statut==="À L'HEURE") retenue = 0; let badge = '<span class="badge-pres badge-green">À L\'HEURE</span>'; if(statut==='Absent' || statut==='ABSENCE') badge = '<span class="badge-pres badge-red">ABSENCE</span>'; else if(statut==='Retard' || statut==='RETARD') badge = '<span class="badge-pres badge-orange">RETARD</span>'; if(liste.includes(k)){ hListe += `<tr><td><b>${p.nom||''}</b></td><td>${p.heureArrivee||p.heure||'—'}</td><td>17h20</td><td>${badge}</td><td>${retenue===0?'0 GNF':'- '+retenue.toLocaleString()+' GNF'}</td>${isPatron?`<td><button onclick="deletePres('${k}')">X</button></td>`:''}</tr>`; } if(statut==='Retard' || statut==='RETARD'){ nbRet++; hRet += `<tr><td>${p.nom||''}</td><td>${p.dateFr||p.date||''}</td><td>${p.heureArrivee||''}</td><td>- 5 000 GNF</td></tr>`; } if(statut==='Absent' || statut==='ABSENCE'){ nbAbs++; hAbs += `<tr><td>${p.nom||''}</td><td>${p.dateFr||p.date||''}</td><td>- 20 000 GNF</td></tr>`; } let nom = p.nom || 'Inconnu'; if(!parPersonne[nom]) parPersonne[nom]={retards:0,absences:0,totalRetenue:0}; if(statut==='Retard' || statut==='RETARD'){ parPersonne[nom].retards++; parPersonne[nom].totalRetenue+=5000; } if(statut==='Absent' || statut==='ABSENCE'){ parPersonne[nom].absences++; parPersonne[nom].totalRetenue+=20000; } }
  hListe += '</table>'; hRet += '</table>'; hAbs += '</table>';
  if(document.getElementById('presListeBox')) document.getElementById('presListeBox').innerHTML = liste.length ? hListe : 'Aucun pointage aujourd\'hui';
  if(document.getElementById('presRetardsBox')) document.getElementById('presRetardsBox').innerHTML = '<div class="pres-info">🟠 Total retards : '+nbRet+' | 08h01 = - 5 000 GNF</div>' + (nbRet? hRet : 'Aucun retard');
  if(document.getElementById('presAbsencesBox')) document.getElementById('presAbsencesBox').innerHTML = '<div class="pres-info">🔴 Total absences : '+nbAbs+' | Absence = - 20 000 GNF</div>' + (nbAbs? hAbs : 'Aucune absence');
  let hEnv = '<table><tr><th>Nom</th><th>Retards</th><th>Absences</th><th>Total Retenue</th><th>Reste à payer</th></tr>'; let totalEnv = 0;
  for(let nom in parPersonne){ let pp = parPersonne[nom]; let reste = 600000 - pp.totalRetenue; if(reste<0) reste=0; totalEnv += reste; hEnv += `<tr><td><b>${nom}</b></td><td>${pp.retards}</td><td>${pp.absences}</td><td>- ${pp.totalRetenue.toLocaleString()} GNF</td><td><b>${reste.toLocaleString()} GNF</b></td></tr>`; }
  hEnv += '</table>'; if(document.getElementById('presEnveloppesBox')) document.getElementById('presEnveloppesBox').innerHTML = '<div class="pres-info">💰 Enveloppe de base : 600 000 GNF par personne</div>' + (Object.keys(parPersonne).length? hEnv : 'Aucune présence encore') + `<div class="total-box">💰 TOTAL ENVELOPPES À PAYER : ${totalEnv.toLocaleString()} GNF</div>`;
}
function savePres(){
  let n = document.getElementById('prNom').value.trim(); if(!n) return alert('Écris le Nom et Prénom'); let heure = document.getElementById('prHeure').value || '08:00'; let dateFr = document.getElementById('prDate').value || new Date().toLocaleDateString('fr-FR'); let choix = document.getElementById('prSt').value; let statut, retenue; let parts = heure.split(':'); let hh = parseInt(parts[0]||0), mm = parseInt(parts[1]||0);
  if(choix==='Absent'){ statut='Absent'; retenue=20000; heure='Absent'; } else if(hh>8 || (hh===8 && mm>=1)){ statut='Retard'; retenue=5000; } else { statut='Présent'; retenue=0; }
  let heureAff = (heure==='Absent') ? 'Absent' : heure.replace(':','h'); db.ref('presence_600k').push({nom:n, statut:statut, retenue:retenue, heureArrivee:heureAff, heure:heureAff, dateFr:dateFr, date:new Date().toLocaleString()}); document.getElementById('prNom').value=''; alert(n+' pointé à '+heureAff+' - '+statut); showPresPage('pres-liste', document.querySelectorAll('.pres-menu button')[1]);
}
function deletePres(k){ if(confirm('Supprimer ce pointage ?')) db.ref('presence_600k/'+k).remove(); }
loadMedicaments();
</script>
