<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filanidialakoro</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#1877f2;color:white;padding:12px;text-align:center;border-radius:10px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:white;padding:16px;border-radius:10px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1);cursor:pointer;font-weight:bold}
#content{background:white;margin-top:12px;padding:12px;border-radius:10px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.btn{border:none;padding:11px;border-radius:8px;width:100%;font-weight:bold;color:white;cursor:pointer;margin-top:5px}
.btn-blue{background:#1877f2} .btn-green{background:#42b72a} .btn-orange{background:#ff9800} .btn-red{background:#e74c3c} .btn-grey{background:#6c757d} .btn-pink{background:#e91e63}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px} th,td{border:1px solid #ddd;padding:6px}
.section{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #e0e0e0}
.med-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.med-row select{flex:2} .med-row input{flex:1}
.total-box{background:#e3f2fd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px}
.somme-box{background:#e8f5e9;padding:6px;border-radius:6px;text-align:center;font-weight:bold;color:#2e7d32}
.jour-box{background:#fff3cd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #ffca28}
.jour-box2{background:#d4edda;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #28a745}
.bilan-box{background:white;padding:14px;border-radius:10px;text-align:center;margin-top:10px;border:2px solid #1877f2}
.bilan-big{font-size:22px;font-weight:bold}
.num-col{width:32px;text-align:center;font-weight:bold;background:#f0f2f5}
.alert-box{background:#ffebee;padding:12px;border-radius:10px;border:2px solid #e74c3c;text-align:center;font-weight:bold;margin-top:10px;color:#b71c1c}
.alert-ok{background:#e8f5e9;padding:10px;border-radius:10px;border:1px solid #42b72a;text-align:center;font-weight:bold;margin-top:10px;color:#2e7d32}
.low-row{background:#ffebee !important}
.zero-row{background:#ffcdd2 !important}
.caisse-big{background:#1877f2;color:white;padding:16px;border-radius:12px;text-align:center;margin-top:10px}
.caisse-big b{font-size:26px}
.patient-link{color:#1877f2;font-weight:bold;cursor:pointer;text-decoration:underline}
.fiche-box{background:#e3f2fd;padding:12px;border-radius:10px;border:2px solid #1877f2;margin-top:10px}
.rdv-urgent{background:#ffcdd2 !important}
.rdv-today{background:#fff3cd !important}
.grossesse-badge{background:#e91e63;color:white;padding:4px 8px;border-radius:12px;font-weight:bold;font-size:12px;display:inline-block;margin-top:4px}
.ordonnance{background:white;border:2px solid #000;padding:16px;border-radius:4px;margin-top:12px}
.ordonnance h2{text-align:center;margin:0;border-bottom:2px solid #000;padding-bottom:8px}
.benef-box{background:#e8f5e9;padding:8px;border-radius:8px;text-align:center;font-weight:bold;color:#2e7d32;border:1px solid #42b72a;margin-top:8px}
@media print{body *{visibility:hidden} #printZone, #printZone *{visibility:visible} #printZone{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div class="header" id="header"></div>
<div class="grid" id="grid"></div>
<div id="content"></div>
<div id="printZone"></div>
<div id="gpsStatus" style="text-align:center;font-size:12px;color:#666;margin-top:8px"></div>
<div id="errorBox" style="color:red;text-align:center;font-size:12px"></div>
<script>
window.onerror=function(m){document.getElementById('errorBox').innerHTML='Erreur: '+m;};
const DB_URL="https://filanidialakoro-default-rtdb.firebaseio.com";
function dbGet(path){return fetch(DB_URL+"/"+path+".json").then(r=>r.json()).then(d=>d||null).catch(e=>null);}
function dbSet(path,val){return fetch(DB_URL+"/"+path+".json",{method:"PUT",body:JSON.stringify(val)}).catch(e=>{});}
function dbPush(path,val){return fetch(DB_URL+"/"+path+".json",{method:"POST",body:JSON.stringify(val)}).then(r=>r.json()).catch(e=>{});}
function dbRemove(path){return fetch(DB_URL+"/"+path+".json",{method:"DELETE"}).catch(e=>{});}
let _listeners=[]; let _isTyping=false;
document.addEventListener('focusin',function(e){if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')) _isTyping=true;});
document.addEventListener('focusout',function(e){setTimeout(function(){_isTyping=false;},800);});
function _notify(){if(_isTyping) return; _listeners.forEach(function(L){dbGet(L.path).then(function(v){if(L.limit && v){let ks=Object.keys(v);let s={};ks.slice(-L.limit).forEach(k=>s[k]=v[k]);v=s;}L.cb({val:function(){return v;}});});});}
setInterval(_notify,30000);
function makeRef(path,limit){return{on:function(ev,cb){_listeners.push({path:path,cb:cb,limit:limit});dbGet(path).then(function(v){if(limit && v){let ks=Object.keys(v);let s={};ks.slice(-limit).forEach(k=>s[k]=v[k]);v=s;}cb({val:function(){return v;}});});},limitToLast:function(n){return makeRef(path,n);},push:function(val){let p=dbPush(path,val);setTimeout(function(){_notify();},1000);return p;},set:function(val){let p=dbSet(path,val);setTimeout(function(){_notify();},1000);return Promise.resolve();},remove:function(){let p=dbRemove(path);setTimeout(function(){_notify();},1000);return Promise.resolve();}};}
const db={ref:function(p){return makeRef(p,0);}};
let role=new URLSearchParams(location.search).get('role');
if(role){try{localStorage.setItem('mon_role',role);}catch(e){}}else{try{role=localStorage.getItem('mon_role')||'patron';}catch(e){role='patron';}}
const isPatron=role==='patron';
document.getElementById('header').innerHTML=isPatron?'<div>👑 PATRON - Accès complet</div><div style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé Brousse</div><div style="font-size:11px;background:#42b72a;padding:4px;border-radius:6px;margin-top:6px">✅ CONNECTÉ À FIREBASE</div>':'<div>👤 SUPPLÉANT - Traiter patients seulement</div><div style="font-size:12px;font-weight:normal">Filanidialakoro - Poste Santé Brousse</div>';

function getPrixVente(m){ if(!m) return 0; if(m.prixVente) return m.prixVente; if(m.prix) return m.prix; return 0; }
function getPrixAchat(m){ if(!m) return 0; if(m.prixAchat) return m.prixAchat; return 0; }
function getBenef(m){ return getPrixVente(m)-getPrixAchat(m); }

// ===== GRID : SUPPLEANT VOIT SEULEMENT 2 CASES =====
let gridHTML='';
if(isPatron){
gridHTML=`<div class="card" onclick="openModule('medicaments')">💊 Médicaments<br><small>Patients à traiter</small></div><div class="card" onclick="openModule('dettes')">📒 Dettes Payé</div><div class="card" style="background:#fce4ec" onclick="openModule('carnet')">🤰👶 CARNET SUIVI</div><div class="card" style="background:#fff3cd;border:2px solid #ff9800" onclick="openModule('achats')">🛒 LISTE D'ACHAT VILLE <span id="badgeAchat"></span></div><div class="card" onclick="openModule('bilan')">📊 BILAN DU MOIS</div><div class="card" onclick="openModule('localisation')">📍 Localisation GPS</div><div class="card" style="background:#1877f2;color:white" onclick="openModule('caisse')">💰 CAISSE DU JOUR</div>`;
}else{
gridHTML=`<div class="card" style="background:#e3f2fd;border:2px solid #1877f2" onclick="openModule('medicaments')">💊 MÉDICAMENTS<br><small>Patients à traiter</small></div><div class="card" onclick="openModule('dettes')">📒 Dettes Payé</div>`;
}
document.getElementById('grid').innerHTML=gridHTML;

function openModule(n){
  // BLOCAGE TOTAL POUR SUPPLEANT
  if(!isPatron && (n==='bilan'||n==='caisse'||n==='localisation'||n==='carnet'||n==='achats')){
    document.getElementById('content').innerHTML='<h3>⛔ Accès refusé</h3><p>Seul le Patron peut voir ça.</p><p>Toi, tu peux voir seulement :<br>✅ 💊 Médicaments / Patients à traiter<br>✅ 📒 Dettes Payé</p>';
    return;
  }
  if(n==='medicaments') loadMedicaments(); if(n==='dettes') loadDettes(); if(n==='bilan') loadBilan(); if(n==='localisation') loadLocalisation(); if(n==='caisse') loadCaisse(); if(n==='carnet') loadCarnet(); if(n==='achats') loadAchats();
}
function isThisMonth(dateStr){if(!dateStr) return false;let now=new Date();let m=now.getMonth()+1;let y=now.getFullYear();let mm=m<10?'0'+m:''+m;return dateStr.includes('/'+m+'/'+y) || dateStr.includes('/'+mm+'/'+y) || dateStr.includes(m+'/'+y);}
function isToday(dateStr){if(!dateStr) return false; return dateStr.startsWith(new Date().toLocaleDateString());}

// ===== LISTE D'ACHAT - PATRON SEULEMENT =====
let achatsData={};
function loadAchats(){
if(!isPatron){document.getElementById('content').innerHTML='<h3>⛔ Accès refusé</h3><p>Seul le Patron.</p>';return;}
document.getElementById('content').innerHTML=`<h3>🛒 LISTE D'ACHAT POUR LA VILLE - SIGUIRI - PATRON SEUL</h3><div style="background:#e3f2fd;padding:10px;border-radius:8px;font-size:13px"><b>💡 Prix Achat</b> = ce que TU payes à Siguiri<br><b>💰 Prix Vente</b> = ce que le PATIENT te paye</div><div class="section"><b>➕ Ajouter à la main</b><select id="achatSelect"></select><div style="display:flex;gap:6px"><input id="achatQte" type="number" placeholder="Qté à acheter ex: 10" value="10"><input id="achatPrix" type="number" placeholder="Prix Achat ex: 15000"></div><input id="achatNomLibre" placeholder="Ou autre chose ex: Pansement, Alcool..."><button class="btn btn-green" onclick="ajouterAchat()">➕ AJOUTER À LA LISTE</button></div><div id="achatsList">Chargement...</div><div id="achatsTotal"></div><button class="btn btn-blue" onclick="copierListeAchat()">📋 COPIER POUR WHATSAPP</button><button class="btn btn-orange" onclick="printListeAchat()">🖨️ IMPRIMER LA LISTE</button><button class="btn btn-red" onclick="if(confirm('Vider toute la liste ?')) db.ref('achats').remove()">🗑️ Vider la liste</button>`;
db.ref('achats').on('value',snap=>{achatsData=snap.val()||{}; if(!_isTyping) renderAchats();});
db.ref('postes').on('value',snap=>{postesData=snap.val()||{}; if(!_isTyping) renderAchats(); updateAchatSelect();});
}
function updateAchatSelect(){let el=document.getElementById('achatSelect'); if(!el) return;let html='<option value="">Choisir médicament</option>'; let keys=Object.keys(postesData).sort(function(a,b){return (postesData[a].nom||'').localeCompare(postesData[b].nom||'');});keys.forEach(function(k){html+='<option value="'+k+'">'+(postesData[k].nom||k)+' (stock: '+(postesData[k].quantite||0)+' - Achat: '+getPrixAchat(postesData[k]).toLocaleString()+')</option>';}); el.innerHTML=html;el.onchange=function(){let k=el.value; if(k && postesData[k]){let p=document.getElementById('achatPrix'); if(p) p.value=getPrixAchat(postesData[k])||'';}};}
function ajouterAchat(){if(!isPatron) return;let key=document.getElementById('achatSelect').value; let qte=parseInt(document.getElementById('achatQte').value)||10; let prix=parseInt(document.getElementById('achatPrix').value)||0; let libre=document.getElementById('achatNomLibre').value.trim();let nom=''; let posteKey='';if(libre){nom=libre; posteKey='libre_'+Date.now();} else if(key){nom=postesData[key]?.nom||key; posteKey=key;} else return alert('Choisis un médicament ou écris autre chose');db.ref('achats/'+posteKey.replace(/[^a-zA-Z0-9_]/g,'_')).set({nom:nom,posteKey:posteKey,qte:qte,prix:prix,prixAchat:prix,date:new Date().toLocaleString(),auto:false});document.getElementById('achatNomLibre').value=''; document.getElementById('achatQte').value='10'; document.getElementById('achatPrix').value='';alert('✅ '+nom+' ajouté');}
function renderAchats(){if(!isPatron) return;if(!document.getElementById('achatsList')) return;let autoList=[];for(let k in postesData){let q=postesData[k].quantite||0; if(q===0) autoList.push({key:k,nom:postesData[k].nom||k,stock:q,prixAchat:getPrixAchat(postesData[k]),prixVente:getPrixVente(postesData[k]),etat:'⛔ RUPTURE',qteSugg:20}); else if(q<=seuilAlerte) autoList.push({key:k,nom:postesData[k].nom||k,stock:q,prixAchat:getPrixAchat(postesData[k]),prixVente:getPrixVente(postesData[k]),etat:'⚠️ BIENTÔT FINI',qteSugg:10});}let badge=document.getElementById('badgeAchat'); if(badge){let totalAchat=Object.keys(achatsData).length+autoList.length; badge.innerHTML=totalAchat?'<span style="background:#e74c3c;color:white;padding:2px 8px;border-radius:10px;font-size:12px">'+totalAchat+'</span>':'';}let h='<h4>⚠️ AUTOMATIQUE - À ACHETER D\'URGENCE</h4>';if(!autoList.length) h+='<div class="alert-ok">✅ Aucun médicament en rupture</div>';else {h+='<table><tr><th>N°</th><th>Médicament</th><th>Stock</th><th>Qté à acheter</th><th>Prix Achat</th><th>Action</th></tr>'; let i=1; autoList.forEach(function(a){let deja=achatsData[a.key]; let qteA=deja?deja.qte:a.qteSugg; let total=qteA*(a.prixAchat||0); h+='<tr class="'+(a.stock===0?'zero-row':'low-row')+'"><td class="num-col">'+(i++)+'</td><td><b>'+a.nom+'</b><br><small>'+a.etat+'<br>Achat: '+a.prixAchat.toLocaleString()+' | Vente: '+a.prixVente.toLocaleString()+'</small></td><td><b>'+a.stock+'</b></td><td><input type="number" value="'+qteA+'" id="autoQte_'+a.key+'" style="width:70px;padding:4px" onchange="updateAutoQte(\''+a.key+'\',this.value)"></td><td><b>'+total.toLocaleString()+' GNF</b></td><td><button onclick="ajouterAutoAchat(\''+a.key+'\')" style="background:#42b72a;color:white;border:none;padding:6px;border-radius:6px">➕ Mettre dans liste</button></td></tr>';}); h+='</table>';}h+='<h4>📝 MA LISTE POUR LA VILLE</h4>';let keys=Object.keys(achatsData); let totalListe=0;if(!keys.length) h+='<p>Aucune chose dans ta liste.</p>';else {h+='<table><tr><th>N°</th><th>À acheter</th><th>Qté</th><th>Prix Achat / Total</th><th>✅ Acheté ?</th><th>X</th></tr>'; let j=1; keys.forEach(function(k){let a=achatsData[k]; let prixA=a.prixAchat||a.prix||0; let tot=(a.qte||0)*prixA; totalListe+=tot; h+='<tr><td class="num-col">'+(j++)+'</td><td><b>'+a.nom+'</b><br><small>'+(a.date||'')+'</small></td><td><input type="number" value="'+(a.qte||0)+'" onchange="db.ref(\'achats/'+k+'/qte\').set(parseInt(this.value)||0)" style="width:70px;padding:4px"></td><td>'+prixA.toLocaleString()+' x '+(a.qte||0)+' = <b>'+tot.toLocaleString()+' GNF</b></td><td><button onclick="marquerAchete(\''+k+'\')" style="background:#42b72a;color:white;border:none;padding:8px;border-radius:6px;font-weight:bold">✅ J\'AI ACHETÉ</button></td><td><button onclick="db.ref(\'achats/'+k+'\').remove()">X</button></td></tr>';}); h+='</table>';}document.getElementById('achatsList').innerHTML=h;if(document.getElementById('achatsTotal')) document.getElementById('achatsTotal').innerHTML=keys.length?'<div class="total-box" style="background:#fff3cd">💰 TOTAL À PAYER À SIGUIRI (PRIX ACHAT) : '+totalListe.toLocaleString()+' GNF</div>':'';}
function updateAutoQte(key,val){let el=document.getElementById('autoQte_'+key); if(el) el.value=val;}
function ajouterAutoAchat(key){let qteEl=document.getElementById('autoQte_'+key); let qte=qteEl?parseInt(qteEl.value)||10:10; let p=postesData[key]; if(!p) return;db.ref('achats/'+key).set({nom:p.nom||key,posteKey:key,qte:qte,prix:getPrixAchat(p),prixAchat:getPrixAchat(p),date:new Date().toLocaleString(),auto:true});alert('✅ '+p.nom+' mis dans ta liste');}
function marquerAchete(k){if(!isPatron) return;let a=achatsData[k]; if(!a) return;if(!confirm('Tu as acheté '+a.qte+' x '+a.nom+' ?')) return;if(a.posteKey && postesData[a.posteKey]){let cur=postesData[a.posteKey].quantite||0; db.ref('postes/'+a.posteKey+'/quantite').set(cur + (parseInt(a.qte)||0));alert('✅ Stock mis à jour : '+a.nom+' passe de '+cur+' à '+(cur+parseInt(a.qte)));} else { alert('✅ '+a.nom+' acheté'); }db.ref('achats/'+k).remove();}
function copierListeAchat(){let txt='🛒 LISTE D\'ACHAT - FILANIDIALAKORO - '+new Date().toLocaleDateString()+'\n\n'; let total=0; let i=1;for(let k in achatsData){let a=achatsData[k]; let prixA=a.prixAchat||a.prix||0; let tot=(a.qte||0)*prixA; total+=tot; txt+=i+'. '+a.nom+' - '+a.qte+' x '+prixA+' (Achat) = '+tot+' GNF\n'; i++;}txt+='\nTOTAL À PAYER À SIGUIRI : '+total.toLocaleString()+' GNF';if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){alert('✅ Liste copiée !');}); else alert(txt);}
function printListeAchat(){let html='<div id="ordonnanceBox" class="ordonnance"><h2>🛒 LISTE D\'ACHAT - VILLE<br><span style="font-size:14px">POSTE DE SANTÉ - FILANIDIALAKORO - '+new Date().toLocaleDateString()+'</span></h2>'; let total=0; let i=1;for(let k in achatsData){let a=achatsData[k]; let prixA=a.prixAchat||a.prix||0; let tot=(a.qte||0)*prixA; total+=tot; html+='<div style="border-bottom:1px dashed #ccc;padding:6px 0">'+(i++)+'. <b>'+a.nom+'</b> - '+a.qte+' x '+prixA.toLocaleString()+' (Achat) = '+tot.toLocaleString()+' GNF</div>';}html+='<div style="text-align:right;font-weight:bold;margin-top:10px">TOTAL À PAYER : '+total.toLocaleString()+' GNF</div></div>';document.getElementById('printZone').innerHTML=html; window.print(); setTimeout(function(){document.getElementById('printZone').innerHTML='';},500);}

// ===== ORDONNANCE - PRIX VENTE SEULEMENT POUR SUPPLEANT =====
function openOrdonnance(key){
let c=allCons[key]; if(!c) return alert('Introuvable');
let total=0; let medsHtml='';
if(c.meds){c.meds.forEach(function(m,i){let pr=m.prixVente||m.prix||getPrixVente(postesData[m.key])||0; let pt=pr*m.qte; total+=pt; medsHtml+='<div style="border-bottom:1px dashed #ccc;padding:8px 0"><b>'+(i+1)+'. '+m.nom+'</b><br>Quantité : '+m.qte+' - Prix : '+pr.toLocaleString()+' GNF - Total : '+pt.toLocaleString()+' GNF</div>';});}
let html='<div id="ordonnanceBox" class="ordonnance"><h2>📄 ORDONNANCE<br><span style="font-size:14px">POSTE DE SANTÉ - FILANIDIALAKORO<br>SIGUIRI - BROUSSE</span></h2><div><b>Date :</b> '+c.date+'</div><div><b>Nom :</b> '+c.patient+'</div><div><b>Sexe / Âge :</b> '+(c.sexe||'-')+' / '+(c.age?c.age+' ans':'-')+'</div><div><b>Plainte :</b> '+(c.plainte||'-')+'</div><div><b>Examen :</b> '+(c.examen||'-')+'</div><div><b>Diagnostic :</b> <b>'+(c.diagnostic||'-')+'</b></div><h3 style="border-top:2px solid #000;padding-top:8px">💊 TRAITEMENT</h3>'+medsHtml+'<div style="text-align:right;font-weight:bold;margin-top:10px">TOTAL À PAYER : '+total.toLocaleString()+' GNF</div><div><b>Conseil :</b> '+(c.conseil||'Bien suivre le traitement. Revenir si fièvre persiste.')+'</div><div style="display:flex;justify-content:space-between;margin-top:30px"><div>Signature Soignant<br><br>__________________</div><div>Signature Patient<br><br>__________________</div></div></div><button class="btn btn-blue" onclick="printOrdonnance()">🖨️ IMPRIMER / CAPTURE</button><button class="btn btn-green" onclick="copyOrdonnance(\''+key+'\')">📋 COPIER LE TEXTE</button><button class="btn btn-grey" onclick="document.getElementById(\'ordonnanceBtns\')?.remove()">Fermer</button>';
let old=document.getElementById('ordonnanceBtns'); if(old) old.remove();
document.getElementById('content').insertAdjacentHTML('afterbegin', '<div id="ordonnanceBtns">'+html+'</div>');
document.getElementById('ordonnanceBox').scrollIntoView({behavior:'smooth'});
}
function printOrdonnance(){let el=document.getElementById('ordonnanceBox'); if(!el) return; document.getElementById('printZone').innerHTML=el.outerHTML; window.print(); setTimeout(function(){document.getElementById('printZone').innerHTML='';},500);}
function copyOrdonnance(key){let c=allCons[key]; let txt='ORDONNANCE - FILANIDIALAKORO\nDate: '+c.date+'\nPatient: '+c.patient+'\nDiagnostic: '+(c.diagnostic||'-')+'\nTraitement:\n'; if(c.meds) c.meds.forEach(function(m,i){let pr=m.prixVente||m.prix||0; txt+=(i+1)+'. '+m.nom+' x'+m.qte+' = '+(pr*m.qte)+' GNF\n';}); if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){alert('✅ Texte copié !');}); else alert(txt);}

function loadCarnet(){

document.getElementById('content').innerHTML=`<h3>🤰👶 CARNET DE SUIVI - Femme & Enfant - PATRON SEUL</h3><div id="carnetAlerte"></div><div class="section" style="background:#fce4ec"><b>➕ NOUVEL ENREGISTREMENT</b><select id="cType" onchange="changeCarnetType()"><option value="Femme Enceinte">🤰 Femme Enceinte</option><option value="Enfant">👶 Enfant</option></select><input id="cNom" placeholder="Nom et Prénom"><input id="cVillage" placeholder="Village / Quartier"><div style="display:flex;gap:6px"><input id="cAge" placeholder="Âge de la femme ex: 28 ans"><input id="cTel" placeholder="Téléphone (si dispo)"></div><div id="cFemmeFields"><div style="background:white;padding:10px;border-radius:8px;border:2px solid #e91e63;margin:6px 0"><b style="color:#e91e63">🤰 ÂGE DE LA GROSSESSE</b><div style="display:flex;gap:6px;margin-top:6px"><input id="cGrossesseMois" type="number" placeholder="Mois ex: 5"><input id="cGrossesseSA" type="number" placeholder="Semaines SA ex: 22"></div></div><label style="font-size:12px">📅 DDR</label><input id="cDdr" type="date"><input id="cTension" placeholder="Tension ex: 12/8"><input id="cPoidsF" placeholder="Poids ex: 62 kg"></div><div id="cEnfantFields" style="display:none"><input id="cPoidsE" placeholder="Poids ex: 8 kg"><input id="cVaccin" placeholder="Vaccin fait ex: BCG, Penta 1"><input id="cTaille" placeholder="Taille ex: 70 cm"></div><label style="font-size:13px;font-weight:bold">📅 Prochain RDV</label><input id="cRdv" type="date"><textarea id="cNote" rows="2" placeholder="📝 Note / Traitement / Conseil"></textarea><button class="btn btn-pink" onclick="saveCarnet()">✅ ENREGISTRER</button></div><div class="section"><b>🔍 Rechercher</b><input id="searchCarnet" placeholder="Rechercher nom, village..." oninput="renderCarnet()"><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn btn-blue" style="width:auto;padding:8px 12px" onclick="filterCarnet='Tous';renderCarnet()">Tous</button><button class="btn btn-pink" style="width:auto;padding:8px 12px" onclick="filterCarnet='Femme Enceinte';renderCarnet()">🤰 Femmes</button><button class="btn btn-green" style="width:auto;padding:8px 12px" onclick="filterCarnet='Enfant';renderCarnet()">👶 Enfants</button><button class="btn btn-orange" style="width:auto;padding:8px 12px" onclick="filterCarnet='RDV';renderCarnet()">⚠️ RDV Urgents</button></div><div id="carnetList">Chargement...</div></div>`;

function saveCarnet(){if(!isPatron) return;let type=document.getElementById('cType').value; let nom=document.getElementById('cNom').value.trim(); if(!nom) return alert('Mets le nom');let obj={type:type,nom:nom,village:document.getElementById('cVillage').value||'',age:document.getElementById('cAge').value||'',tel:document.getElementById('cTel').value||'',rdv:document.getElementById('cRdv').value||'',note:document.getElementById('cNote').value||'',date:new Date().toLocaleString(),role:role};if(type==='Femme Enceinte'){let mois=document.getElementById('cGrossesseMois').value||'';let sa=document.getElementById('cGrossesseSA').value||'';let saCalc = sa ? sa : (mois ? Math.round(parseFloat(mois)*4.3) : '');let moisCalc = mois ? mois : (sa ? (parseFloat(sa)/4.3).toFixed(1) : '');obj.grossesseMois=moisCalc; obj.grossesseSA=saCalc; obj.grossesse = (moisCalc?moisCalc+' mois':'') + (saCalc?' / '+saCalc+' SA':'');obj.ddr=document.getElementById('cDdr').value||''; obj.tension=document.getElementById('cTension').value||''; obj.poids=document.getElementById('cPoidsF').value||'';} else {obj.poids=document.getElementById('cPoidsE').value||''; obj.vaccin=document.getElementById('cVaccin').value||''; obj.taille=document.getElementById('cTaille').value||'';}db.ref('carnet_suivi').push(obj);['cNom','cVillage','cAge','cTel','cGrossesseMois','cGrossesseSA','cDdr','cTension','cPoidsF','cPoidsE','cVaccin','cTaille','cRdv','cNote'].forEach(function(id){let el=document.getElementById(id); if(el) el.value='';});alert('✅ '+nom+' enregistré');}
function renderCarnet(){if(!isPatron) return;if(!document.getElementById('carnetList')) return;let q=(document.getElementById('searchCarnet')?.value||'').toLowerCase();let today=new Date(); today.setHours(0,0,0,0);let keys=Object.keys(carnetData).reverse();let urgents=0; let aujourdhuiCount=0;keys.forEach(function(k){let c=carnetData[k]; if(c.rdv){let d=new Date(c.rdv); d.setHours(0,0,0,0); if(d<today) urgents++; else if(d.getTime()===today.getTime()) aujourdhuiCount++;}});let alerteEl=document.getElementById('carnetAlerte');if(alerteEl){ if(urgents||aujourdhuiCount) alerteEl.innerHTML='<div class="alert-box">⚠️ '+urgents+' RDV DÉPASSÉS - '+aujourdhuiCount+' RDV AUJOURD\'HUI</div>'; else alerteEl.innerHTML='<div class="alert-ok">✅ Aucun RDV urgent aujourd\'hui</div>';}let h='<table><tr><th>N°</th><th>Type</th><th>Nom / Village</th><th>🤰 Âge Grossesse / Détails</th><th>Prochain RDV</th><th>Note</th><th>📄</th><th>X</th></tr>'; let num=1; let shown=0;for(let k of keys){let c=carnetData[k];if(filterCarnet!=='Tous'){ if(filterCarnet==='RDV'){ if(!c.rdv) continue; let d=new Date(c.rdv); d.setHours(0,0,0,0); if(d>today) continue; } else if(c.type!==filterCarnet) continue;}let txt=((c.nom||'')+' '+(c.village||'')).toLowerCase(); if(q && !txt.includes(q)) continue; shown++;let rdvClass=''; let rdvTxt=c.rdv||'-';if(c.rdv){let d=new Date(c.rdv); d.setHours(0,0,0,0); if(d<today){rdvClass='rdv-urgent'; rdvTxt+=' ⛔ DÉPASSÉ';} else if(d.getTime()===today.getTime()){rdvClass='rdv-today'; rdvTxt+=' ⚠️ AUJOURD\'HUI';}}let details='';if(c.type==='Femme Enceinte'){let ageG = c.grossesse || ((c.grossesseMois||c.grossesseSA) ? (c.grossesseMois?c.grossesseMois+' mois':'') + (c.grossesseSA?' / '+c.grossesseSA+' SA':'') : '-');details='<b>Âge femme:</b> '+(c.age||'-')+'<br><span class="grossesse-badge">🤰 '+ageG+'</span><br><b>DDR:</b> '+(c.ddr||'-')+'<br><b>Tension:</b> '+(c.tension||'-')+'<br><b>Poids:</b> '+(c.poids||'-');} else {details='<b>Âge:</b> '+(c.age||'-')+'<br><b>Poids:</b> '+(c.poids||'-')+'<br><b>Vaccin:</b> '+(c.vaccin||'-')+'<br><b>Taille:</b> '+(c.taille||'-');}h+=`<tr class="${rdvClass}"><td class="num-col">${num++}</td><td>${c.type==='Femme Enceinte'?'🤰 Femme':'👶 Enfant'}</td><td><b>${c.nom}</b><br>${c.village||''}<br><small>📞 ${c.tel||'Pas de tel'}<br>${c.date||''}</small></td><td>${details}</td><td><b>${rdvTxt}</b></td><td>${c.note||'-'}</td><td><button onclick="openOrdonnanceCarnet('${k}')" style="background:#1877f2;color:white;border:none;padding:6px;border-radius:6px">📄</button></td><td><button onclick="db.ref('carnet_suivi/${k}').remove()">X</button></td></tr>`;}h+='</table>';if(document.getElementById('carnetList')) document.getElementById('carnetList').innerHTML=shown?h+'<div style="text-align:center;margin-top:8px;font-weight:bold">'+shown+' personnes suivies</div>':'<p>Aucune personne dans le carnet</p>';}
function openFichePatient(nom){
let visites=[];for(let k in allCons){let c=allCons[k]; if((c.patient||'').toLowerCase()===nom.toLowerCase()) visites.push(c);}if(!visites.length){alert('Aucune fiche pour '+nom); return;}visites.sort(function(a,b){return a.date.localeCompare(b.date);});let totalDep=0; let dernierDiag=visites[visites.length-1].diagnostic||'-'; let dernierDate=visites[visites.length-1].date||'';visites.forEach(function(c){ if(c.meds) c.meds.forEach(function(m){let pr=m.prixVente||m.prix||getPrixVente(postesData[m.key])||0; totalDep+=pr*m.qte;});});let html='<div id="fichePatientBox" class="fiche-box"><h3>👤 FICHE PATIENT : '+nom+'</h3>';html+='<div><b>Nombre de visites :</b> '+visites.length+' fois</div>';html+='<div><b>Total payé :</b> '+totalDep.toLocaleString()+' GNF</div>';html+='<div><b>Sexe / Âge :</b> '+(visites[0].sexe||'-')+' / '+(visites[0].age?visites[0].age+' ans':'-')+'</div>';html+='<div><b>Dernier diagnostic :</b> <b>'+dernierDiag+'</b> le '+dernierDate+'</div>';html+='<h4>📋 Historique complet</h4><table><tr><th>N°</th><th>Date</th><th>Plainte</th><th>Examen</th><th>Diagnostic</th><th>Traitement</th><th>Somme</th></tr>';let idx=1; visites.slice().reverse().forEach(function(c){let medsTxt=''; let somme=0; if(c.meds){c.meds.forEach(function(m){let pr=m.prixVente||m.prix||getPrixVente(postesData[m.key])||0; let pt=pr*m.qte; somme+=pt; medsTxt+='<div>• '+m.nom+' x'+m.qte+' = '+pt.toLocaleString()+'</div>';});} html+='<tr><td class="num-col">'+(idx++)+'</td><td>'+c.date+'</td><td>'+(c.plainte||'-')+'</td><td>'+(c.examen||'-')+'</td><td><b>'+(c.diagnostic||'-')+'</b></td><td>'+medsTxt+'</td><td><b>'+somme.toLocaleString()+' GNF</b></td></tr>';});html+='</table><br><button class="btn btn-blue" onclick="remplirPatient(\''+nom.replace(/'/g,"\\'")+'\')">➕ NOUVELLE CONSULTATION POUR '+nom+'</button><button class="btn btn-grey" onclick="document.getElementById(\'fichePatientBox\').remove()">Fermer fiche</button></div>';let box=document.getElementById('fichePatientBox'); if(box) box.remove();document.getElementById('content').insertAdjacentHTML('afterbegin', html);document.getElementById('fichePatientBox').scrollIntoView({behavior:'smooth'});
}
function remplirPatient(nom){let el=document.getElementById('patientName'); if(!el){alert('Va dans Médicaments d\'abord'); return;} el.value=nom;let visites=[]; for(let k in allCons){if((allCons[k].patient||'').toLowerCase()===nom.toLowerCase()) visites.push(allCons[k]);}if(visites.length){let last=visites[visites.length-1]; document.getElementById('patientSexe').value=last.sexe||''; document.getElementById('patientAge').value=last.age||'';}window.scrollTo({top:0,behavior:'smooth'});alert('Nom rempli pour '+nom);}
function loadCaisse(){
if(!isPatron){document.getElementById('content').innerHTML='<h3>⛔ Accès refusé</h3><p>Seul le Patron.</p>';return;}
document.getElementById('content').innerHTML='<h3>💰 CAISSE DU JOUR - '+new Date().toLocaleDateString()+'</h3><div id="caisseBox">Chargement...</div><div id="caisseDetail"></div><button class="btn btn-green" onclick="loadCaisse()">🔄 Actualiser</button>';
Promise.all([dbGet('consultations'),dbGet('dettes_paye')]).then(function(res){
let cons=res[0]||{};let dettes=res[1]||{};let ventesJour=0; let qteJour=0; let nbPatientsJour=0; let detailJour=[]; let benefJour=0;
for(let k in cons){let c=cons[k]; if(!isToday(c.date)) continue; nbPatientsJour++; let somme=0; if(c.meds){c.meds.forEach(function(m){let prV=m.prixVente||m.prix||getPrixVente(postesData[m.key])||0; let prA=m.prixAchat||getPrixAchat(postesData[m.key])||0; somme+=prV*m.qte; qteJour+=m.qte; benefJour+=(prV-prA)*m.qte;});} ventesJour+=somme; detailJour.push({patient:c.patient||'?', somme:somme, heure:c.date, role:c.role||''});}
let dettesJour=0; let nbDettesJour=0; let detailDettes=[];for(let k in dettes){let d=dettes[k]; if(!isToday(d.date)) continue; dettesJour+=parseInt(d.montant)||0; nbDettesJour++; detailDettes.push(d);}
let caisse = ventesJour - dettesJour;
let html=`<div class="bilan-box" style="background:#e3f2fd"><div>💊 VENTES AUJOURD'HUI</div><div class="bilan-big">${ventesJour.toLocaleString()} GNF</div><div>${nbPatientsJour} patients - ${qteJour} boîtes</div></div><div class="bilan-box" style="background:#e8f5e9;border-color:#42b72a"><div>💚 BÉNÉFICE AUJOURD'HUI (Vente - Achat)</div><div class="bilan-big" style="color:#2e7d32">${benefJour.toLocaleString()} GNF</div></div><div class="bilan-box" style="background:#fff3cd;border-color:#ff9800"><div>📒 DETTES AUJOURD'HUI</div><div class="bilan-big" style="color:#e65100">${dettesJour.toLocaleString()} GNF</div><div>${nbDettesJour} dettes</div></div><div class="caisse-big"><div>💰 ARGENT EN CAISSE CE SOIR</div><b>${caisse.toLocaleString()} GNF</b></div>`;
document.getElementById('caisseBox').innerHTML=html;let det='<h4>📋 Détail ventes aujourd\'hui</h4><table><tr><th>N°</th><th>Heure</th><th>Patient</th><th>Qui a vendu</th><th>Somme Vente</th></tr>'; let idx=1; detailJour.reverse().forEach(function(d){det+=`<tr><td class="num-col">${idx++}</td><td>${d.heure}</td><td>${d.patient}</td><td>${d.role==='suppleant'?'👤 Suppléant':'👑 Patron'}</td><td><b>${d.somme.toLocaleString()} GNF</b></td></tr>`;}); det+='</table>';let det2='<h4>📒 Détail dettes aujourd\'hui</h4>'; if(detailDettes.length){det2+='<table><tr><th>N°</th><th>Nom</th><th>Montant</th><th>Date</th></tr>'; let i2=1; detailDettes.forEach(function(d){det2+=`<tr><td class="num-col">${i2++}</td><td>${d.nom}</td><td>${d.montant} GNF</td><td>${d.date}</td></tr>`;}); det2+='</table>';} else det2+='<p>Aucune dette aujourd\'hui ✅</p>';document.getElementById('caisseDetail').innerHTML=(detailJour.length?det:'<p>Aucune vente aujourd\'hui</p>')+det2;
});
}
function loadBilan(){
if(!isPatron){document.getElementById('content').innerHTML='<h3>⛔ Accès refusé</h3><p>Seul le Patron.</p>';return;}
document.getElementById('content').innerHTML='<h3>📊 BILAN DU MOIS - '+new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</h3><div id="bilanBox">Chargement...</div><div id="bilanDetail"></div>';
Promise.all([dbGet('consultations'),dbGet('dettes_paye'),dbGet('postes')]).then(function(res){
let cons=res[0]||{};let dettes=res[1]||{};let postes=res[2]||{};let qteMois=0;let sommeVentesMois=0;let coutAchatMois=0;let benefMois=0;let nbPatientsMois=0;let detailMed={};
for(let k in cons){let c=cons[k];if(!isThisMonth(c.date)) continue;nbPatientsMois++;if(c.meds){c.meds.forEach(function(m){let prV=m.prixVente||m.prix||getPrixVente(postes[m.key])||0;let prA=m.prixAchat||getPrixAchat(postes[m.key])||0;let ptV=prV*m.qte;let ptA=prA*m.qte;sommeVentesMois+=ptV;coutAchatMois+=ptA;benefMois+=(prV-prA)*m.qte;qteMois+=m.qte;if(!detailMed[m.nom]) detailMed[m.nom]={qte:0,somme:0,benef:0};detailMed[m.nom].qte+=m.qte;detailMed[m.nom].somme+=ptV;detailMed[m.nom].benef+=(prV-prA)*m.qte;});}}
let totalDettesMois=0;let nbDettesMois=0;for(let k in dettes){let d=dettes[k];if(!isThisMonth(d.date)) continue;totalDettesMois+=parseInt(d.montant)||0;nbDettesMois++;}
let soldeMois=sommeVentesMois-totalDettesMois;let totalStockAchat=0;let totalStockVente=0;for(let k in postes){totalStockAchat+=(postes[k].quantite||0)*getPrixAchat(postes[k]);totalStockVente+=(postes[k].quantite||0)*getPrixVente(postes[k]);}
let html=`<div class="bilan-box" style="background:#e3f2fd"><div>💊 VENTES CE MOIS</div><div class="bilan-big">${sommeVentesMois.toLocaleString()} GNF</div><div>${qteMois} boîtes - ${nbPatientsMois} patients</div></div><div class="bilan-box" style="background:#fff3cd;border-color:#ff9800"><div>🛒 COÛT D'ACHAT DES MÉDICAMENTS VENDUS</div><div class="bilan-big" style="color:#e65100">${coutAchatMois.toLocaleString()} GNF</div></div><div class="bilan-box" style="background:#e8f5e9;border-color:#42b72a"><div>💚 BÉNÉFICE DU MOIS (Vente - Achat)</div><div class="bilan-big" style="color:#2e7d32">${benefMois.toLocaleString()} GNF</div></div><div class="bilan-box" style="background:#fff3cd;border-color:#ff9800"><div>📒 DETTES DANS LE MOIS</div><div class="bilan-big" style="color:#e65100">${totalDettesMois.toLocaleString()} GNF</div><div>${nbDettesMois} dettes</div></div><div class="bilan-box"><div>💰 SOLDE DU MOIS</div><div class="bilan-big">${soldeMois.toLocaleString()} GNF</div></div><div class="bilan-box"><div>📦 STOCK RESTANT</div><div>Valeur Achat : ${totalStockAchat.toLocaleString()} GNF<br>Valeur Vente : ${totalStockVente.toLocaleString()} GNF<br><b>Bénéfice futur : ${(totalStockVente-totalStockAchat).toLocaleString()} GNF</b></div></div>`;
document.getElementById('bilanBox').innerHTML=html;let det='<h4>📋 Détail par médicament ce mois</h4><table><tr><th>N°</th><th>Médicament</th><th>Qté</th><th>Ventes</th><th>Bénéfice</th></tr>';let idx=1;for(let n in detailMed){det+=`<tr><td class="num-col">${idx++}</td><td>${n}</td><td><b>${detailMed[n].qte}</b></td><td>${detailMed[n].somme.toLocaleString()} GNF</td><td style="color:#2e7d32"><b>${detailMed[n].benef.toLocaleString()} GNF</b></td></tr>`;}det+='</table>';document.getElementById('bilanDetail').innerHTML=Object.keys(detailMed).length?det:'<p>Aucune vente ce mois</p>';
});
}
function trackLocation(){if(!navigator.geolocation){document.getElementById('gpsStatus').innerHTML='GPS non supporté';return;}navigator.geolocation.getCurrentPosition(function(pos){let lat=pos.coords.latitude;let lng=pos.coords.longitude;let acc=Math.round(pos.coords.accuracy);document.getElementById('gpsStatus').innerHTML='📍 GPS activé';try{db.ref('localisations').push({role:role,lat:lat,lng:lng,accuracy:acc,date:new Date().toLocaleString(),maps:'https://www.google.com/maps?q='+lat+','+lng,device:(navigator.userAgent||'').substring(0,80)});}catch(e){}},function(err){document.getElementById('gpsStatus').innerHTML='⚠️ GPS refusé';},{enableHighAccuracy:true,timeout:10000});}
try{trackLocation();}catch(e){} setInterval(function(){try{trackLocation();}catch(e){}},15*60*1000);
function loadLocalisation(){if(!isPatron){document.getElementById('content').innerHTML='<h3>⛔ Accès refusé</h3>';return;}document.getElementById('content').innerHTML='<h3>📍 Localisation GPS - PATRON SEUL</h3><div id="locList">Chargement...</div>';db.ref('localisations').limitToLast(100).on('value',snap=>{let d=snap.val()||{};let h='<table><tr><th>N°</th><th>Date</th><th>Qui</th><th>Position</th><th>Voir</th></tr>';let keys=Object.keys(d).reverse();let i=1;for(let k of keys){let l=d[k];let badge=l.role==='patron'?'👑 PATRON':'👤 SUPPLÉANT';let color=l.role==='patron'?'#e3f2fd':'#fff3cd';h+=`<tr style="background:${color}"><td class="num-col">${i++}</td><td>${l.date}</td><td><b>${badge}</b></td><td>${(l.lat||0).toFixed(5)}, ${(l.lng||0).toFixed(5)}<br><small>Précision: ${l.accuracy}m</small></td><td><a href="${l.maps}" target="_blank" style="background:#1877f2;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold">🗺️ Voir</a></td></tr>`;}document.getElementById('locList').innerHTML=h+'</table><br><button class="btn btn-red" onclick="if(confirm(\'Effacer ?\')) db.ref(\'localisations\').remove()">Effacer historique</button>';});}
let postesData={};
function loadMedicaments(){
let h='';
if(isPatron){
h=`<div class="section"><b>STOCK PERMANENT - PATRON : Prix Achat / Prix Vente / Bénéfice</b><div style="background:#e8f5e9;padding:8px;border-radius:8px;font-size:13px;margin-top:6px"><b>Prix Achat</b> = ce que TU payes à Siguiri &nbsp;|&nbsp; <b>Prix Vente</b> = ce que le PATIENT paye &nbsp;|&nbsp; <b>Bénéfice</b> = Vente - Achat</div><div style="display:flex;gap:6px;align-items:center;margin-top:6px"><span style="font-size:13px">⚠️ Alerter si stock ≤</span><input id="seuilInput" type="number" value="${seuilAlerte}" style="width:80px"><button class="btn btn-orange" style="width:auto;padding:10px 14px" onclick="changerSeuil()">Changer seuil</button></div><div id="alerteBox"></div><div style="background:#fff3cd;padding:10px;border-radius:8px;margin-top:8px"><b>➕ Nouveau médicament</b><input id="newMedName" placeholder="Nom médicament"><div style="display:flex;gap:6px"><input id="newMedAchat" type="number" placeholder="Prix Achat ex: 15000"><input id="newMedVente" type="number" placeholder="Prix Vente ex: 20000"></div><button class="btn btn-green" onclick="addMedicament()">AUGMENTER LA LISTE</button></div><div id="medTable">Chargement...</div><div id="totalStockBox"></div><div id="totalJourBox"></div><div id="bilanMoisMini"></div></div>`;
}else{
h=`<div class="section"><b>💊 MÉDICAMENTS - STOCK</b><div id="alerteBox"></div><div id="medTable">Chargement...</div><div id="totalJourBox"></div></div>`;
}
h+=`<div class="section" style="background:#e3f2fd"><b>👤 NOUVEAU PATIENT À TRAITER</b><input id="patientName" placeholder="Nom et Prénom du patient"><div style="display:flex;gap:6px"><select id="patientSexe" style="flex:1"><option value="">Sexe</option><option value="Homme">👨 Homme</option><option value="Femme">👩 Femme</option></select><input id="patientAge" type="number" placeholder="Âge" style="flex:1"></div><textarea id="patientPlainte" rows="2" placeholder="📝 Plainte"></textarea><textarea id="patientExamen" rows="2" placeholder="🔬 Examen Paraclinique"></textarea><input id="patientDiag" placeholder="🩺 Diagnostic"><textarea id="patientConseil" rows="2" placeholder="💡 Conseil"></textarea><b style="font-size:13px">💊 Traitement - Prix à faire payer au patient</b><div id="medRows"></div><button class="btn btn-blue" onclick="addMedRow()">+ AJOUTER UN AUTRE MÉDICAMENT</button><button class="btn btn-orange" onclick="saveConsultation()">✅ ENREGISTRER PATIENT + DIMINUER STOCK</button></div><div class="section"><b>📋 HISTORIQUE PATIENTS</b><input id="searchPatient" placeholder="Rechercher patient, diagnostic..." oninput="filterPatients()"><div id="consultTable">Chargement...</div></div>`;
document.getElementById('content').innerHTML=h;loadStock();loadConsultations();addMedRow();if(isPatron) loadBilanMini();
}
function loadBilanMini(){if(!isPatron) return; Promise.all([dbGet('consultations'),dbGet('dettes_paye')]).then(function(res){let cons=res[0]||{};let dettes=res[1]||{};let qte=0;let sommeV=0;let benef=0;for(let k in cons){let c=cons[k];if(!isThisMonth(c.date)) continue;if(c.meds)c.meds.forEach(function(m){let prV=m.prixVente||m.prix||getPrixVente(postesData[m.key])||0;let prA=m.prixAchat||getPrixAchat(postesData[m.key])||0;sommeV+=prV*m.qte;benef+=(prV-prA)*m.qte;qte+=m.qte;});}let det=0;for(let k in dettes){if(isThisMonth(dettes[k].date)) det+=parseInt(dettes[k].montant)||0;}let el=document.getElementById('bilanMoisMini');if(el) el.innerHTML=`<div class="jour-box">💊 VENTES CE MOIS : ${qte} boîtes = ${sommeV.toLocaleString()} GNF</div><div class="jour-box2">💚 BÉNÉFICE CE MOIS : ${benef.toLocaleString()} GNF</div><div class="jour-box">📒 DETTES CE MOIS : ${det.toLocaleString()} GNF</div><button class="btn btn-blue" onclick="loadBilan()">📊 VOIR BILAN COMPLET</button>`;});}
let seuilAlerte = 2;
try{seuilAlerte = parseInt(localStorage.getItem('seuil_alerte')) || 2;}catch(e){seuilAlerte=2;}
function changerSeuil(){if(!isPatron) return;let v=parseInt(document.getElementById('seuilInput').value); if(!v && v!==0) return; seuilAlerte=v; try{localStorage.setItem('seuil_alerte',v);}catch(e){} dbSet('config/seuil_alerte',v); loadStock(); alert('Seuil changé à '+v);}
dbGet('config/seuil_alerte').then(function(v){if(v){seuilAlerte=parseInt(v)||2; try{localStorage.setItem('seuil_alerte',seuilAlerte);}catch(e){}}});
function loadStock(){db.ref('postes').on('value',snap=>{postesData=snap.val()||{};if(_isTyping) return; let keys=Object.keys(postesData).sort(function(a,b){return (postesData[a].nom||'').localeCompare(postesData[b].nom||'');});
let low=[]; let zero=[];
for(let k of keys){let q=postesData[k].quantite||0; if(q===0) zero.push(postesData[k].nom||k); else if(q<=seuilAlerte) low.push((postesData[k].nom||k)+' ('+q+')');}
let alerteEl=document.getElementById('alerteBox');
if(alerteEl){
  if(zero.length || low.length){
    let txt='';
    if(zero.length) txt+='⛔ RUPTURE : '+zero.join(', ')+'<br>';
    if(low.length) txt+='⚠️ BIENTÔT FINI (≤ '+seuilAlerte+') : '+low.join(', ');
    alerteEl.innerHTML='<div class="alert-box">'+txt+'</div>';
  } else { alerteEl.innerHTML='<div class="alert-ok">✅ Stock OK</div>'; }
}
let t='';
if(isPatron){
t='<table><tr><th>N°</th><th>Nom</th><th>Stock</th><th>Prix Achat</th><th>Prix Vente</th><th>Bénéfice</th><th>Valeur Stock Vente</th><th>X</th></tr>';
}else{
t='<table><tr><th>N°</th><th>Nom</th><th>Stock</th><th>Prix à payer</th></tr>';
}
let grandTotalVente=0;let grandTotalAchat=0;let num=1;for(let k of keys){let q=postesData[k].quantite||0;let pA=getPrixAchat(postesData[k]);let pV=getPrixVente(postesData[k]);let benef=getBenef(postesData[k]);let totalV=q*pV;let totalA=q*pA;grandTotalVente+=totalV;grandTotalAchat+=totalA;let rowClass=q===0?'zero-row':(q<=seuilAlerte?'low-row':'');let stockTxt=q===0?'⛔ 0':(q<=seuilAlerte?'⚠️ '+q:q);
if(isPatron){
t+=`<tr class="${rowClass}"><td class="num-col">${num++}</td><td>${postesData[k].nom||k} ${q===0?'⛔ RUPTURE':(q<=seuilAlerte?'⚠️':'' )}</td><td><input id="q_${k}" type="number" value="${q}" onchange="updateQ('${k}')" style="padding:4px"></td><td><input id="pa_${k}" type="number" value="${pA}" onchange="updatePrixAchat('${k}')" style="padding:4px"></td><td><input id="pv_${k}" type="number" value="${pV}" onchange="updatePrixVente('${k}')" style="padding:4px"></td><td style="color:${benef>=0?'#2e7d32':'#c62828'}"><b>${benef.toLocaleString()}</b></td><td><b>${totalV.toLocaleString()} GNF</b></td><td><button onclick="deleteMed('${k}')">X</button></td></tr>`;
}else{
t+=`<tr class="${rowClass}"><td class="num-col">${num++}</td><td>${postesData[k].nom||k} ${q===0?'⛔ RUPTURE':(q<=seuilAlerte?'⚠️':'' )}</td><td><b style="font-size:16px">${stockTxt}</b></td><td><b>${pV.toLocaleString()} GNF</b></td></tr>`;
}
}
t+='</table>';if(document.getElementById('medTable')) document.getElementById('medTable').innerHTML=t;
if(isPatron && document.getElementById('totalStockBox')) document.getElementById('totalStockBox').innerHTML=`<div class="total-box">📦 STOCK : Valeur Achat ${grandTotalAchat.toLocaleString()} GNF | Valeur Vente ${grandTotalVente.toLocaleString()} GNF</div><div class="benef-box">💚 Bénéfice si tu vends tout : ${(grandTotalVente-grandTotalAchat).toLocaleString()} GNF</div>`;
if(!_isTyping) updateAllSelects();if(document.getElementById('consultTable')) renderConsultations(allCons);});}
function getSelectHTML(){let html='<option value="">Choisir médicament</option>';let keys=Object.keys(postesData).sort(function(a,b){return (postesData[a].nom||'').localeCompare(postesData[b].nom||'');});for(let k of keys){html+=`<option value="${k}">${postesData[k].nom||k} (stock:${postesData[k].quantite||0} - Prix:${getPrixVente(postesData[k]).toLocaleString()})</option>`;}return html;}
function addMedRow(){let el=document.getElementById('medRows');if(!el)return;let div=document.createElement('div');div.className='med-row';div.innerHTML=`<select class="medSelect">${getSelectHTML()}</select><input type="number" class="medQte" placeholder="Qté" value="1" style="width:70px"><button class="btn btn-red" style="width:40px;padding:6px" onclick="this.parentElement.remove()">X</button>`;el.appendChild(div);}
function updateAllSelects(){if(_isTyping) return; let selHTML=getSelectHTML();document.querySelectorAll('.medSelect').forEach(sel=>{let val=sel.value;if(document.activeElement===sel) return; sel.innerHTML=selHTML;sel.value=val;});}
function addMedicament(){if(!isPatron)return alert('Seul le Patron');let nom=document.getElementById('newMedName').value.trim();let pa=parseInt(document.getElementById('newMedAchat').value)||0;let pv=parseInt(document.getElementById('newMedVente').value)||0;if(!nom)return;if(!pv) pv=pa;let key=nom.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now();db.ref('postes/'+key).set({nom:nom,quantite:0,prixAchat:pa,prixVente:pv,prix:pv}).then(()=>{document.getElementById('newMedName').value='';document.getElementById('newMedAchat').value='';document.getElementById('newMedVente').value='';});}
function updateQ(k){if(!isPatron)return;let q=document.getElementById('q_'+k).value;db.ref('postes/'+k+'/quantite').set(parseInt(q)||0);}
function updatePrixAchat(k){if(!isPatron)return;let p=document.getElementById('pa_'+k).value;db.ref('postes/'+k+'/prixAchat').set(parseInt(p)||0);}
function updatePrixVente(k){if(!isPatron)return;let p=document.getElementById('pv_'+k).value;db.ref('postes/'+k+'/prixVente').set(parseInt(p)||0);db.ref('postes/'+k+'/prix').set(parseInt(p)||0);}
function deleteMed(k){if(!isPatron) return; if(confirm('Supprimer?')) db.ref('postes/'+k).remove();}
function saveConsultation(){let patient=document.getElementById('patientName').value.trim();if(!patient)return alert('Mets nom du patient');let sexe=document.getElementById('patientSexe').value||'';let age=document.getElementById('patientAge').value||'';let plainte=document.getElementById('patientPlainte').value||'';let examen=document.getElementById('patientExamen').value||'';let diagnostic=document.getElementById('patientDiag').value||'';let conseil=document.getElementById('patientConseil')?.value||'';let rows=document.querySelectorAll('.med-row');let meds=[];for(let r of rows){let key=r.querySelector('.medSelect').value;let qte=parseInt(r.querySelector('.medQte').value)||0;if(key && qte>0){meds.push({key:key,nom:postesData[key]?.nom||key,qte:qte,prix:getPrixVente(postesData[key]),prixVente:getPrixVente(postesData[key]),prixAchat:getPrixAchat(postesData[key])});}}if(meds.length===0)return alert('Ajoute au moins 1 médicament');meds.forEach(m=>{let cur=postesData[m.key]?.quantite||0;db.ref('postes/'+m.key+'/quantite').set(cur-m.qte);});db.ref('consultations').push({patient:patient,sexe:sexe,age:age,plainte:plainte,examen:examen,diagnostic:diagnostic,conseil:conseil,meds:meds,date:new Date().toLocaleString(),role:role}).then(function(res){ if(res && res.name){ setTimeout(function(){openOrdonnance(res.name);},800);} });document.getElementById('patientName').value='';document.getElementById('patientSexe').value='';document.getElementById('patientAge').value='';document.getElementById('patientPlainte').value='';document.getElementById('patientExamen').value='';document.getElementById('patientDiag').value='';if(document.getElementById('patientConseil')) document.getElementById('patientConseil').value='';document.getElementById('medRows').innerHTML='';addMedRow();addMedRow();alert('✅ '+patient+' enregistré');}
let allCons={};
function loadConsultations(){db.ref('consultations').on('value',snap=>{allCons=snap.val()||{};if(!_isTyping) renderConsultations(allCons);});}
function renderConsultations(data){if(_isTyping && document.activeElement && document.activeElement.id==='searchPatient') return; let h='<table><tr><th>N°</th><th>Date</th><th>Patient</th><th>📝 Plainte</th><th>🔬 Examen</th><th>🩺 Diagnostic</th><th>💊 Traitement</th><th>Somme</th><th>📄</th>'+(isPatron?'<th>X</th>':'')+'</tr>';let keys=Object.keys(data).reverse();let totalJour=0;let qteJour=0;let aujourdhui=new Date().toLocaleDateString();let num=1;for(let k of keys){let c=data[k];let medsTxt='';let sommeTotale=0;if(c.meds){c.meds.forEach(m=>{let prixReel=m.prixVente||m.prix||getPrixVente(postesData[m.key])||0;let pt=prixReel*m.qte;sommeTotale+=pt;medsTxt+=`<div>• ${m.nom} : <b>${m.qte}</b> x ${prixReel.toLocaleString()} = ${pt.toLocaleString()} GNF</div>`;});}else{medsTxt=c.med||'';}if(c.date && c.date.startsWith(aujourdhui)){totalJour+=sommeTotale;if(c.meds){c.meds.forEach(m=>{qteJour+=m.qte;});}}let safeNom=(c.patient||'').replace(/'/g,"\\'");h+=`<tr><td class="num-col">${num++}</td><td>${c.date}</td><td><span class="patient-link" onclick="openFichePatient('${safeNom}')">👤 ${c.patient} 🔍</span><br><small>${c.sexe||''} ${c.age?c.age+' ans':''}</small></td><td>${c.plainte||'-'}</td><td>${c.examen||'-'}</td><td><b>${c.diagnostic||'-'}</b></td><td>${medsTxt}</td><td><div class="somme-box">${sommeTotale.toLocaleString()} GNF</div></td><td><button onclick="openOrdonnance('${k}')" style="background:#1877f2;color:white;border:none;padding:6px;border-radius:6px">📄</button></td>${isPatron?`<td><button onclick="db.ref('consultations/${k}').remove()">X</button></td>`:''}</tr>`;}h+='</table>';if(document.getElementById('consultTable')) document.getElementById('consultTable').innerHTML=keys.length?h:'Aucun patient encore';if(document.getElementById('totalJourBox')){ if(isPatron){document.getElementById('totalJourBox').innerHTML=`<div class="jour-box">💊 TOTAL VENDUS AUJOURD'HUI : ${qteJour}</div><div class="jour-box2">💰 SOMME JOURNALIÈRE : ${totalJour.toLocaleString()} GNF</div>`;} else {document.getElementById('totalJourBox').innerHTML=`<div class="jour-box">💊 TOTAL VENDUS AUJOURD'HUI : ${qteJour} boîtes</div><div style="font-size:12px;text-align:center;color:#666">Le total d'argent est visible seulement par le Patron</div>`;}}}
function filterPatients(){let q=document.getElementById('searchPatient').value.toLowerCase();let filtered={};for(let k in allCons){let txt=((allCons[k].patient||'')+' '+(allCons[k].diagnostic||'')+' '+(allCons[k].plainte||'')).toLowerCase();if(txt.includes(q)) filtered[k]=allCons[k];}renderConsultations(filtered);}
function loadDettes(){document.getElementById('content').innerHTML='<h3>📒 Dettes Payé</h3><input id="dNom" placeholder="Nom"><input id="dMont" type="number" placeholder="Montant"><button class="btn btn-blue" onclick="saveDette()">Enregistrer</button><div id="dTotalMois"></div><div id="dList"></div>';db.ref('dettes_paye').on('value',s=>{let d=s.val()||{},h='<table><tr><th>N°</th><th>Client</th><th>Montant</th><th>Date</th>'+(isPatron?'<th>X</th>':'')+'</tr>';let totMois=0;let i=1;for(let k in d){if(isThisMonth(d[k].date)) totMois+=parseInt(d[k].montant)||0;h+=`<tr><td class="num-col">${i++}</td><td>${d[k].nom}</td><td>${d[k].montant}</td><td>${d[k].date}</td>${isPatron?`<td><button onclick="deleteDette('${k}')" style="background:#e74c3c;color:white;border:none;padding:6px 10px;border-radius:6px;font-weight:bold">X</button></td>`:''}</tr>`;}if(isPatron){document.getElementById('dTotalMois').innerHTML=`<div class="jour-box">📒 DETTES CE MOIS : ${totMois.toLocaleString()} GNF</div>`;} else {document.getElementById('dTotalMois').innerHTML='';}document.getElementById('dList').innerHTML=h+'</table>';});}
function saveDette(){let n=document.getElementById('dNom').value,m=document.getElementById('dMont').value;if(!n||!m)return;db.ref('dettes_paye').push({nom:n,montant:m,date:new Date().toLocaleString()});}
function deleteDette(k){if(!isPatron) return; if(confirm('Supprimer ?')){db.ref('dettes_paye/'+k).remove();}}
loadMedicaments();
</script>
</body>
</html>
