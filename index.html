<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATRON</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:10px}
h1{background:#ffcc00;text-align:center;padding:12px;border-radius:10px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
button{padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:15px;background:white;box-shadow:0 1px 3px #ccc}
button:active{background:#ffcc00}
.box{background:white;padding:10px;border-radius:10px}
input{width:100%;padding:10px;font-size:16px;margin:8px 0;box-sizing:border-box}
.table-wrap{overflow-x:auto;overflow-y:auto;max-height:300px;border:1px solid #ddd}
table{width:100%;border-collapse:collapse;min-width:400px}
th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:14px}
th{background:#333;color:white;position:sticky;top:0}
.rouge{background:#ffcccc;font-weight:bold}
.total{background:#e6ffe6;padding:10px;font-weight:bold;text-align:center;border-radius:8px;margin:8px 0}
</style>
</head>
<body>

<h1>⭐ PATRON ⭐</h1>

<div class="grid">
<button onclick="alert('Médicaments')">💊 Médicaments</button>
<button onclick="alert('Dettes')">💰 Dettes Payé</button>
<button onclick="alert('Suivi Live')">📈 SUIVI LIVE</button>
<button onclick="alert('Primes')">🎁 Primes</button>
<button onclick="alert('Observation')">📝 Observation</button>
<button onclick="alert('Présence')">👥 Présence 600k</button>
<button onclick="alert('GPS')">📍 Localisation GPS</button>
<button onclick="sauvegarder()">💾 Sauvegarde</button>
</div>

<div class="box">
<h3>💊 STOCK PERMANENT</h3>
<div class="total" id="total">Valeur totale : 0 GNF</div>
<input id="recherche" placeholder="🔍 Chercher un médicament..." onkeyup="filtrer()">
<div class="table-wrap">
<table>
<tr><th>Médicament</th><th>Stock</th><th>Prix</th><th>État</th></tr>
<tbody id="liste">
<tr><td>Amoxicilline</td><td>163</td><td>5000</td><td></td></tr>
<tr><td>Artemether</td><td>15</td><td>8000</td><td></td></tr>
<tr><td>Paracétamol</td><td>250</td><td>2000</td><td></td></tr>
<tr><td>Vitamine C</td><td>8</td><td>3000</td><td></td></tr>
</tbody>
</table>
</div>
<p style="font-size:12px;color:#666">Si tu vois une ligne ROUGE = stock bas, il faut commander.</p>
</div>

<script>
function calculer(){
  let total=0;
  let lignes=document.querySelectorAll("#liste tr");
  lignes.forEach(l=>{
    let stock=parseInt(l.cells[1].innerText);
    let prix=parseInt(l.cells[2].innerText);
    total+=stock*prix;
    if(stock<20){ l.classList.add("rouge"); l.cells[3].innerText="À COMMANDER"; }
    else{ l.classList.remove("rouge"); l.cells[3].innerText="OK"; }
  });
  document.getElementById("total").innerText="Valeur totale : "+total+" GNF";
}
function filtrer(){
  let mot=document.getElementById("recherche").value.toLowerCase();
  document.querySelectorAll("#liste tr").forEach(l=>{
    l.style.display=l.innerText.toLowerCase().includes(mot)?"":"none";
  });
}
function sauvegarder(){
  localStorage.setItem("stock_patron","ok");
  alert("Sauvegarde réussie !");
}
calculer();
</script>
</body>
</html>
