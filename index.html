<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poste Santé - Dettes Non Payé</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:10px}
h1{text-align:center;color:#0a7a42;font-size:22px}
.card{background:white;padding:12px;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
input{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0a7a42;color:white;border:none;border-radius:8px;font-size:17px;font-weight:bold}
.total{background:#FFD700;color:#000;padding:14px;text-align:center;font-weight:bold;font-size:19px;border-radius:8px;margin:10px 0;border:2px solid #e6c200}
.item{display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;padding:10px;border-radius:8px;margin:6px 0}
.small{font-size:13px;color:#555}
.btn-del{background:#e60000;padding:7px 10px;width:auto;font-size:13px}
.btn-paye{background:#0a7a42;padding:7px 10px;width:auto;font-size:13px}
</style>
</head>
<body>

<h1>🏥 POSTE SANTÉ - SIGUIRI<br>Dettes Non Payé</h1>

<div class="card">
<h3>Ajouter une dette non payée</h3>
<input id="nom" placeholder="Nom du patient">
<input id="montant" type="number" placeholder="Montant en GNF">
<button onclick="ajouterDette()">➕ ENREGISTRER</button>
</div>

<div class="total" id="totalBox">TOTAL DETTES NON PAYÉ : 0 GNF<br><span id="nbDettes" style="font-size:14px">0 dettes non payées</span></div>

<div class="card">
<h3>❌ Dettes Non Payé</h3>
<div id="liste"></div>
</div>

<script>
let dettes = JSON.parse(localStorage.getItem('dettes') || '[]');
// Pour garder tes anciennes données si elles étaient en "paye"
dettes = dettes.filter(d => d.statut !== 'paye');

function ajouterDette(){
  let nom = document.getElementById('nom').value.trim();
  let montant = Number(document.getElementById('montant').value);
  if(!nom || !montant){ alert('Mets le nom et le montant'); return; }
  dettes.push({nom:nom, montant:montant, statut:'nonpaye', date:new Date().toLocaleDateString()});
  localStorage.setItem('dettes', JSON.stringify(dettes));
  document.getElementById('nom').value='';
  document.getElementById('montant').value='';
  afficher();
}

function supprimer(i){
  if(confirm('Supprimer cette dette ?')){ dettes.splice(i,1); localStorage.setItem('dettes', JSON.stringify(dettes)); afficher(); }
}

function marquerPaye(i){
  if(confirm('Cette personne a payé ? On l’enlève de la liste ?')){ dettes.splice(i,1); localStorage.setItem('dettes', JSON.stringify(dettes)); afficher(); }
}

function afficher(){
  let total = 0;
  let html = '';
  dettes.forEach((d, i) => {
    total += Number(d.montant);
    html += `<div class="item"><div><b>${d.nom}</b><br><span class="small">${Number(d.montant).toLocaleString()} GNF - ${d.date}</span></div><div><button class="btn-paye" onclick="marquerPaye(${i})">✔ Payé</button> <button class="btn-del" onclick="supprimer(${i})">X</button></div></div>`;
  });
  document.getElementById('liste').innerHTML = html || 'Aucune dette non payée';
  document.getElementById('totalBox').innerHTML = 'TOTAL DETTES NON PAYÉ : ' + total.toLocaleString() + ' GNF<br><span style="font-size:14px">' + dettes.length + ' dettes non payées</span>';
}
afficher();
</script>
</body>
</html>
