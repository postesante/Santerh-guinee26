<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharmacie</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:10px}
h2{text-align:center}
button{padding:10px 14px;border:none;border-radius:8px;background:#007bff;color:#fff;font-size:15px;margin:3px}
button.vert{background:#28a745}
button.gris{background:#6c757d}
input,select{padding:9px;width:100%;box-sizing:border-box;margin:4px 0;border:1px solid #ccc;border-radius:6px}
table{width:100%;background:#fff;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:14px}
th{background:#eee}
.card{background:#fff;padding:12px;border-radius:10px;margin-top:10px}
.total{background:#d4edda;padding:10px;text-align:center;font-weight:bold;border-radius:8px;margin-top:10px}
.cache{color:red;cursor:pointer}
</style>
</head>
<body>

<div id="login" style="text-align:center;padding:40px 10px">
<h2>🔒 Pharmacie</h2>
<p>Qui est là ?</p>
<input id="code" type="password" placeholder="Tape ton code" style="text-align:center;font-size:18px">
<br><br>
<button onclick="entrer()">Entrer</button>
<p id="erreur" style="color:red"></p>
<p style="font-size:12px;color:#666">Patron : 1989 - Suppléant : 1111</p>
</div>

<div id="appli" style="display:none">
<h2 id="titreRole">PATRON</h2>
<div style="text-align:center">
<button onclick="show('stock')">💊 STOCK</button>
<button onclick="show('patient')">👤 PATIENT</button>
<button class="cache-suppleant" onclick="show('caisse')">💰 CAISSE DU JOUR</button>
<button class="cache-suppleant" onclick="show('archives')">📁 ARCHIVES</button>
<button class="gris" onclick="location.reload()">🔓 Sortir</button>
</div>

<div id="page-stock" class="card">
<h3>💊 Stock - Reste des médicaments</h3>
<table>
<tr><th>Médicament</th><th>Stock</th><th class="cache-suppleant">Prix</th><th class="cache-suppleant">Total</th><th class="cache-suppleant">X</th></tr>
<tbody id="tbody"></tbody>
</table>
<div class="cache-suppleant total" id="totalStock"></div>

<h3>➕ Ajouter un nouveau médicament</h3>
<input id="nNom" placeholder="Nom du médicament ex: Paracétamol">
<input id="nStock" type="number" placeholder="Quantité ex: 50">
<input id="nPrix" class="cache-suppleant" type="number" placeholder="Prix en GNF ex: 5000">
<button class="vert" onclick="ajouterMed()">Ajouter</button>
<p id="msgAjout" style="color:green"></p>
</div>

<div id="page-patient" class="card" style="display:none">
<h3>👤 Nouveau Patient</h3>
<input id="pNom" placeholder="Nom du patient">
<select id="pMed"></select>
<input id="pQte" type="number" value="1" placeholder="Quantité">
<button class="vert" onclick="vendre()">Enregistrer vente</button>
<p id="msgVente"></p>
<h3>Patients du jour</h3>
<div id="listePatients"></div>
</div>

<div id="page-caisse" class="card cache-suppleant" style="display:none">
<h3>💰 Caisse du Jour</h3>
<div id="caisseJour">0 GNF</div>
<div id="detailCaisse"></div>
<button onclick="cloturer()">Clôturer la journée -> Archives</button>
</div>

<div id="page-archives" class="card cache-suppleant" style="display:none">
<h3>📁 Archives</h3>
<div id="listeArchives"></div>
</div>
</div>

<script>
let stock = JSON.parse(localStorage.getItem("stock")) || [
{n:"Paracetamol", s:145, p:500},
{n:"Sérum glucosé", s:13, p:90000},
{n:"Seringue 5cc", s:51, p:2000},
{n:"Vitamine B6", s:42, p:3000}
];
let ventes = JSON.parse(localStorage.getItem("ventes")) || [];
let archives = JSON.parse(localStorage.getItem("archives")) || [];
let role = "";

function save(){ localStorage.setItem("stock", JSON.stringify(stock)); localStorage.setItem("ventes", JSON.stringify(ventes)); localStorage.setItem("archives", JSON.stringify(archives)); }
function entrer(){
  let c = document.getElementById("code").value;
  if(c=="1989"){ role="patron"; document.getElementById("titreRole").innerText="👤 PATRON - Accès complet"; }
  else if(c=="1111"){ role="suppleant"; document.getElementById("titreRole").innerText="👤 SUPPLÉANT - 2 modules"; }
  else { document.getElementById("erreur").innerText="Mauvais code"; return; }
  document.getElementById("login").style.display="none";
  document.getElementById("appli").style.display="block";
  if(role=="suppleant"){
    document.querySelectorAll(".cache-suppleant").forEach(e=>e.style.display="none");
  }
  afficher();
}
function show(page){
  ["stock","patient","caisse","archives"].forEach(p=>{
    document.getElementById("page-"+p).style.display = (p==page ? "block" : "none");
  });
  if(role=="suppleant" && (page=="caisse" || page=="archives")) return;
  afficher();
}
function afficher(){
  let tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  let total = 0;
  let sel = document.getElementById("pMed");
  sel.innerHTML = "";
  stock.forEach((m,i)=>{
    total += m.s * m.p;
    let tr = document.createElement("tr");
    if(role=="patron"){
      tr.innerHTML = `<td>${m.n}</td>
      <td><input type="number" value="${m.s}" onchange="changeStock(${i},this.value)"></td>
      <td class="cache-suppleant"><input type="number" value="${m.p}" onchange="changePrix(${i},this.value)"></td>
      <td class="cache-suppleant">${(m.s*m.p).toLocaleString()} GNF</td>
      <td class="cache-suppleant"><span class="cache" onclick="supprimer(${i})">X</span></td>`;
    } else {
      tr.innerHTML = `<td>${m.n}</td><td>${m.s}</td>`;
    }
    tbody.appendChild(tr);
    let opt = document.createElement("option");
    opt.value = i; opt.text = m.n + " - Stock: " + m.s;
    sel.appendChild(opt);
  });
  document.getElementById("totalStock").innerText = "TOTAL STOCK : " + total.toLocaleString() + " GNF";
  let caisse = ventes.reduce((a,b)=>a+b.total,0);
  document.getElementById("caisseJour").innerHTML = "<h2>"+caisse.toLocaleString()+" GNF</h2>";
  document.getElementById("detailCaisse").innerHTML = ventes.map(v=>v.patient+" - "+v.med+" x"+v.qte+" = "+v.total.toLocaleString()+" GNF").join("<br>");
  document.getElementById("listePatients").innerHTML = ventes.map(v=>v.patient+" - "+v.med+" x"+v.qte).join("<br>") || "Aucun patient pour le moment";
  document.getElementById("listeArchives").innerHTML = archives.map(a=>a.date+" : "+a.total.toLocaleString()+" GNF - "+a.nb+" ventes").join("<br>") || "Aucune archive";
}
function changeStock(i,val){ if(role!="patron") return; stock[i].s = parseInt(val)||0; save(); afficher(); }
function changePrix(i,val){ if(role!="patron") return; stock[i].p = parseInt(val)||0; save(); afficher(); }
function supprimer(i){ if(role!="patron") return; if(confirm("Supprimer "+stock[i].n+" ?")){ stock.splice(i,1); save(); afficher(); } }
function ajouterMed(){
  let nom = document.getElementById("nNom").value.trim();
  let s = parseInt(document.getElementById("nStock").value)||0;
  let p = parseInt(document.getElementById("nPrix").value)||0;
  if(!nom){ alert("Écris le nom"); return; }
  if(role=="suppleant"){ p = 0; }
  stock.push({n:nom, s:s, p:p});
  save(); afficher();
  document.getElementById("msgAjout").innerText = nom + " ajouté. Patron complétera le prix plus tard.";
  document.getElementById("nNom").value=""; document.getElementById("nStock").value=""; document.getElementById("nPrix").value="";
}
function vendre(){
  let nom = document.getElementById("pNom").value.trim() || "Patient";
  let idx = document.getElementById("pMed").value;
  let qte = parseInt(document.getElementById("pQte").value)||1;
  if(stock[idx].s < qte){ alert("Stock insuffisant. Il reste "+stock[idx].s); return; }
  stock[idx].s -= qte;
  let total = qte * stock[idx].p;
  ventes.push({patient:nom, med:stock[idx].n, qte:qte, total:total});
  save(); afficher();
  document.getElementById("msgVente").innerText = "Vente enregistrée : "+nom+" - "+stock[idx].n;
  document.getElementById("pNom").value="";
}
function cloturer(){
  if(ventes.length==0){ alert("Caisse vide"); return; }
  let total = ventes.reduce((a,b)=>a+b.total,0);
  archives.push({date:new Date().toLocaleDateString()+" "+new Date().toLocaleTimeString(), total:total, nb:ventes.length});
  ventes = []; save(); afficher(); alert("Journée clôturée : "+total.toLocaleString()+" GNF");
}
</script>
</body>
 </html>
