<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filanidialakoro</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#1877f2;color:white;padding:16px;text-align:center;border-radius:10px;font-weight:bold;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:white;padding:18px;border-radius:10px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer;font-weight:bold;font-size:16px}
#content{background:white;margin-top:12px;padding:12px;border-radius:10px;min-height:200px}
input,select,textarea{width:100%;padding:13px;margin:6px 0;border:2px solid #1877f2;border-radius:8px;background:#fffde7;font-size:16px}
.btn{border:none;padding:13px;border-radius:8px;width:100%;font-weight:bold;color:white;cursor:pointer;margin-top:6px;font-size:16px}
.btn-blue{background:#1877f2}.btn-green{background:#42b72a}.btn-orange{background:#ff9800}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}th,td{border:1px solid #ddd;padding:6px}
.section{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #e0e0e0}
.thermo-box{background:#fff3cd;border:3px solid #1877f2;padding:12px;border-radius:10px;margin:8px 0}
.thermo-box input{background:white;font-size:18px;font-weight:bold}
.thermo-result{padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-top:10px;border:2px solid #000;font-size:17px;background:#fff}
.role-bar{display:flex;gap:8px;margin-top:10px}
.role-bar button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header" id="header">Filanidialakoro - Poste Santé</div>
<div class="role-bar">
<button id="btnPatron" onclick="setRole('patron')" style="background:#1877f2;color:white">👑 PATRON</button>
<button id="btnSupp" onclick="setRole('suppleant')" style="background:#fff;color:#1877f2;border:2px solid #1877f2">👤 SUPPLÉANT</button>
</div>
<div class="grid" id="grid"></div>
<div id="content"></div>
<script>
var role = new URLSearchParams(location.search).get('role');
if(role){ localStorage.setItem('mon_role', role); } else { role = localStorage.getItem('mon_role') || 'patron'; }
var isPatron = (role === 'patron');
function setRole(r){ localStorage.setItem('mon_role', r); location.href = location.pathname + '?role=' + r + '&v=103'; }
function updateHeader(){
  document.getElementById('header').innerHTML = isPatron ? '👑 PATRON - Accès complet<br><span style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</span>' : '👤 SUPPLÉANT - Médicaments + Dettes + Patients<br><span style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</span>';
  document.getElementById('btnPatron').style.background = isPatron ? '#1877f2' : '#fff';
  document.getElementById('btnPatron').style.color = isPatron ? 'white' : '#1877f2';
  document.getElementById('btnSupp').style.background = !isPatron ? '#1877f2' : '#fff';
  document.getElementById('btnSupp').style.color = !isPatron ? 'white' : '#1877f2';
  var g = document.getElementById('grid');
  if(isPatron){
    g.innerHTML = '<div class="card" onclick="showMed()">💊<br>Médicaments</div><div class="card" onclick="showDettes()">📒<br>Dettes Payé</div><div class="card" onclick="showThermo()" style="background:#fff3cd;border:3px solid #1877f2">🌡️<br>Thermomètre</div><div class="card" onclick="showPatients()">👤<br>Patients</div><div class="card" onclick="showSuivi()">📈<br>SUIVI LIVE</div><div class="card" onclick="showGPS()">📍<br>Localisation GPS</div>';
  } else {
    g.innerHTML = '<div class="card" onclick="showMed()">💊<br>Médicaments</div><div class="card" onclick="showDettes()">📒<br>Dettes Payé</div><div class="card" onclick="showPatients()">👤<br>Patients</div>';
  }
}
updateHeader();
function get(k){ try{ return JSON.parse(localStorage.getItem(k) || '[]'); }catch(e){ return []; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function thermoMsg(t){
  if(t < 36.5) return '🔵 BASSE - Couvre-toi bien';
  if(t <= 37.5) return '🟢 NORMAL - Pas de fièvre';
  if(t <= 38.5) return '🟡 FIÈVRE LÉGÈRE - Repos, bois beaucoup d eau';
  return '🔴 ALERTE ROUGE - FIÈVRE FORTE ! Hôpital vite !';
}
function thermoColor(t){
  if(t < 36.5) return '#38bdf8';
  if(t <= 37.5) return '#4ade80';
  if(t <= 38.5) return '#facc15';
  return '#ef4444';
}
function checkThermo(){
  var nom = document.getElementById('tNom').value || 'Patient';
  var t = parseFloat(document.getElementById('tTemp').value);
  if(!t) return alert('Mets température Ex: 38.2');
  var el = document.getElementById('tRes');
  el.innerHTML = nom + ' : ' + t + '°C<br>' + thermoMsg(t);
  el.style.background = thermoColor(t);
}
function checkThermo2(){
  var t = parseFloat(document.getElementById('pTemp').value);
  if(!t) return alert('Mets température Ex: 38.2');
  var el = document.getElementById('tRes2');
  el.innerHTML = t + '°C - ' + thermoMsg(t);
  el.style.background = thermoColor(t);
}
function showThermo(){
  if(!isPatron){ return alert('Utilise Médicaments pour prendre la température du patient.'); }
  var c = document.getElementById('content');
  c.innerHTML = '<div class="thermo-box"><h3>🌡️ Thermomètre - Patient</h3><p>1. Mesure avec le thermomètre<br>2. Tape le chiffre<br>3. Clique VÉRIFIER</p><input id="tNom" placeholder="Nom du patient Ex: Mamadou"><input id="tTemp" type="number" step="0.1" placeholder="Température Ex: 38.2"><button class="btn btn-blue" onclick="checkThermo()">VÉRIFIER LA TEMPÉRATURE</button><div id="tRes" class="thermo-result">Le résultat va s afficher ici en couleur</div></div>';
}
function showMed(){
  var meds = get('meds');
  var rows = '';
  for(var i=0;i<meds.length;i++){ rows = rows + '<tr><td>' + meds[i].nom + '</td><td>' + meds[i].qte + '</td><td>' + meds[i].prix + ' GNF</td>' + (isPatron ? '<td><button onclick="delMed(' + i + ')">X</button></td>' : '<td>-</td>') + '</tr>'; }
  var addStock = '';
  if(isPatron){ addStock = '<input id="mNom" placeholder="Nom médicament"><input id="mPrix" type="number" placeholder="Prix ex: 500"><input id="mQte" type="number" placeholder="Quantité ex: 10"><button class="btn btn-green" onclick="addMed()">AUGMENTER LA LISTE</button>'; }
  else { addStock = '<p style="font-size:13px;color:#666">Suppléant : tu peux voir le stock, mais seul le Patron peut ajouter / supprimer.</p>'; }
  var c = document.getElementById('content');
  c.innerHTML = '<div class="section"><b>STOCK PERMANENT</b>' + addStock + '<table><tr><th>Nom</th><th>Stock</th><th>Prix</th><th>X</th></tr>' + rows + '</table></div><div class="section" style="background:#e3f2fd"><b>NOUVEAU PATIENT</b><input id="pNom" placeholder="Nom et Prénom du patient"><input id="pAge" type="number" placeholder="Âge"><div class="thermo-box"><b>🌡️ TEMPÉRATURE</b><input id="pTemp" type="number" step="0.1" placeholder="Température Ex: 38.2"><button class="btn btn-blue" onclick="checkThermo2()">VÉRIFIER TEMPÉRATURE</button><div id="tRes2" class="thermo-result">Résultat ici</div></div><input id="pPlainte" placeholder="Plainte"><input id="pDiag" placeholder="Diagnostic"><input id="pMed" placeholder="Médicament donné ex: Paracétamol x2"><button class="btn btn-orange" onclick="savePatient()">ENREGISTRER PATIENT</button></div>';
}
function addMed(){
  if(!isPatron) return alert('Seul le Patron');
  var n = document.getElementById('mNom').value;
  if(!n) return alert('Mets nom');
  var a = get('meds');
  a.push({nom:n, prix:document.getElementById('mPrix').value, qte:document.getElementById('mQte').value});
  save('meds', a); showMed();
}
function delMed(i){ if(!isPatron) return alert('Seul le Patron peut supprimer'); var a = get('meds'); a.splice(i,1); save('meds', a); showMed(); }
function savePatient(){
  var nom = document.getElementById('pNom').value;
  if(!nom) return alert('Mets nom patient');
  var a = get('cons');
  a.push({patient:nom, age:document.getElementById('pAge').value, temp:document.getElementById('pTemp').value, plainte:document.getElementById('pPlainte').value, diag:document.getElementById('pDiag').value, medsTxt:document.getElementById('pMed').value, date:new Date().toLocaleString()});
  save('cons', a); alert('✅ ' + nom + ' enregistré'); showPatients();
}
function showPatients(){
  var cons = get('cons'); var h = '';
  for(var i=cons.length-1;i>=0;i--){ h = h + '<tr><td>' + cons[i].date + '</td><td><b>' + cons[i].patient + '</b><br><small>' + (cons[i].age || '') + ' ans</small></td><td>' + (cons[i].temp ? cons[i].temp + '°C - ' + thermoMsg(parseFloat(cons[i].temp)) : '-') + '</td><td>' + (cons[i].plainte || '') + '</td><td><b>' + (cons[i].diag || '') + '</b></td><td>' + (cons[i].medsTxt || '') + '</td>' + (isPatron ? '<td><button onclick="delPatient(' + i + ')">X</button></td>' : '<td>-</td>') + '</tr>'; }
  document.getElementById('content').innerHTML = '<h3>👤 PATIENTS - Historique</h3><input id="searchP" placeholder="Rechercher patient..." oninput="filterPatients()"><div id="patTable"><table><tr><th>Date</th><th>Patient</th><th>Temp</th><th>Plainte</th><th>Diagnostic</th><th>Traitement</th><th>X</th></tr>' + h + '</table></div>';
}
function filterPatients(){
  var q = document.getElementById('searchP').value.toLowerCase();
  var cons = get('cons'); var h = '';
  for(var i=cons.length-1;i>=0;i--){ var txt = (cons[i].patient + ' ' + cons[i].diag + ' ' + cons[i].plainte).toLowerCase(); if(txt.indexOf(q) === -1) continue; h = h + '<tr><td>' + cons[i].date + '</td><td><b>' + cons[i].patient + '</b></td><td>' + (cons[i].temp || '') + '°C</td><td>' + (cons[i].plainte || '') + '</td><td>' + (cons[i].diag || '') + '</td><td>' + (cons[i].medsTxt || '') + '</td><td>-</td></tr>'; }
  document.getElementById('patTable').innerHTML = '<table><tr><th>Date</th><th>Patient</th><th>Temp</th><th>Plainte</th><th>Diagnostic</th><th>Traitement</th><th>X</th></tr>' + h + '</table>';
}
function delPatient(i){ if(!isPatron) return alert('Seul le Patron peut supprimer'); var a = get('cons'); a.splice(i,1); save('cons', a); showPatients(); }
function showDettes(){
  var d = get('dettes'); var h = '';
  for(var i=0;i<d.length;i++){ h = h + '<tr><td>' + d[i].nom + '</td><td>' + d[i].montant + '</td><td>' + d[i].date + '</td>' + (isPatron ? '<td><button onclick="delDette(' + i + ')">X</button></td>' : '<td>-</td>') + '</tr>'; }
  document.getElementById('content').innerHTML = '<h3>📒 Dettes Payé</h3><input id="dNom" placeholder="Nom"><input id="dMont" type="number" placeholder="Montant"><button class="btn btn-blue" onclick="saveDette()">Enregistrer</button><table><tr><th>Nom</th><th>Montant</th><th>Date</th><th>X</th></tr>' + h + '</table>';
}
function saveDette(){ var n = document.getElementById('dNom').value; var m = document.getElementById('dMont').value; if(!n || !m) return alert('Mets nom et montant'); var a = get('dettes'); a.push({nom:n, montant:m, date:new Date().toLocaleString()}); save('dettes', a); showDettes(); }
function delDette(i){ if(!isPatron) return alert('Seul le Patron peut supprimer'); var a = get('dettes'); a.splice(i,1); save('dettes', a); showDettes(); }
function showSuivi(){
  var cons = get('cons'); var h = '';
  for(var i=cons.length-1;i>=0;i--){ h = h + '<tr><td>' + cons[i].date + '</td><td>' + cons[i].patient + '</td><td>' + (cons[i].temp || '') + '°C</td><td>' + (cons[i].diag || '') + '</td><td>' + (cons[i].medsTxt || '') + '</td></tr>'; }
  document.getElementById('content').innerHTML = '<h3>📈 SUIVI LIVE - Patron</h3><table><tr><th>Date</th><th>Patient</th><th>Temp</th><th>Diag</th><th>Traitement</th></tr>' + h + '</table>';
}
function showGPS(){
  if(!isPatron) return alert('Seul le Patron');
  document.getElementById('content').innerHTML = '<h3>📍 Localisation GPS</h3><button class="btn btn-blue" onclick="getGPS()">MA POSITION</button><div id="gpsRes"></div>';
}
function getGPS(){
  if(!navigator.geolocation) return alert('GPS non supporté');
  navigator.geolocation.getCurrentPosition(function(p){ document.getElementById('gpsRes').innerHTML = '<p>📍 ' + p.coords.latitude + ', ' + p.coords.longitude + '</p><a href="https://www.google.com/maps?q=' + p.coords.latitude + ',' + p.coords.longitude + '" target="_blank">Voir sur Maps</a>'; }, function(){ alert('Autorise GPS'); });
}
showMed();
</script>
</body>
</html>
