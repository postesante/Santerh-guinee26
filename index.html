 <!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Filanidialakoro V8.1</title><style>body{font-family:system-ui;background:#f2f5ff;margin:0;padding:0 12px 220px}.top{background:#1a73e8;color:#fff;padding:14px;border-radius:0 0 16px 16px;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#f5f7fb;z-index:100;overflow:auto;padding:12px}.med{background:#fff;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}.cart{position:fixed;bottom:0;left:0;right:0;background:#1a73e8;color:#fff;padding:12px;border-radius:16px 16px 0 0}</style></head><body>
<div class="top"><b>Filanidialakoro V8.1 - OK</b><br>📍 GPS 11.259809, -8.940853</div>
<div class="grid">
<div class="card" onclick="alert('Observation OK')"><div style="font-size:28px">📝</div><b>Observation</b></div>
<div class="card" onclick="openM()"><div style="font-size:28px">💊</div><b>Médicaments</b><br><small>Panier+Total</small></div>
<div class="card" onclick="alert('Primes OK')"><div style="font-size:28px">🏆</div><b>Primes</b></div>
<div class="card" onclick="alert('Suivi OK')"><div style="font-size:28px">📈</div><b>SUIVI LIVE</b></div>
<div class="card" onclick="presence()" style="border:2px solid #4CAF50"><div style="font-size:28px">✅</div><b>Présence</b></div>
<div class="card" onclick="openD()"><div style="font-size:28px">📒</div><b>Dettes</b></div>
</div>
<div id="med" class="modal"><div style="background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:space-between"><b>💊 Médicaments</b><button onclick="closeM()">Fermer</button></div><div id="L" style="margin-top:10px"></div><div style="height:200px"></div><div class="cart"><div id="cd" style="font-size:13px">Panier vide</div><input id="nom" placeholder="Nom patient" style="width:100%;padding:10px;border-radius:8px;border:none;margin:6px 0"><div style="display:flex;justify-content:space-between;font-weight:800"><span>TOTAL:</span><span id="tot">0 GNF</span></div><button onclick="save()" style="width:100%;margin-top:8px;padding:12px;border-radius:8px;border:none;background:#fff;color:#1a73e8;font-weight:800">Enregistrer Dette</button></div></div>
<div id="det" class="modal"><div style="background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:space-between"><b>Dettes</b><button onclick="document.getElementById('det').style.display='none'">Fermer</button></div><div id="LD" style="margin-top:10px"></div></div>
<script>
const meds=[["Paracétamol 500mg 10cp",2500],["AAS 300mg 10cp",5000],["Cotri 960mg 10cp",10000],["Ibuprofène 400mg 10cp",10000],["Ampi 1g flacon",5000],["Artemether 80mg amp",5000],["Amoxicilline 500mg",1000],["Metamizole 500mg amp",5000],["Genta 80mg amp",2000],["Dexa 4mg amp",2000],["Vit B Complexe amp",10000],["Sérum Salé flacon",60000],["Ringer flacon",60000],["Glucosé flacon",60000],["Cotri Sirop",20000],["Para Sirop",20000],["Métro Sirop",20000],["Artemether Sirop",25000],["Cimétidine inj",2500],["Diclofénac 75mg",3500],["Ceftriaxone",15000],["Quinine 600mg",10000],["Accouchement",65000],["Oxytocine amp",10000],["TDR",10000],["Taux Hb",20000],["Ciproperf flacon",15000],["Fil suture",30000]];
let pan={};
function openM(){document.getElementById('med').style.display='block';render();}
function closeM(){document.getElementById('med').style.display='none';}
function render(){let h="";meds.forEach((m,i)=>{let q=pan[i]||0;h+=`<div class=med><div><b>${m[0]}</b><br>${m[1]} GNF ${q?`<br><b style=color:green>x${q}=${q*m[1]} GNF</b>`:''}</div><div><button onclick="add(${i},-1)">-</button> <button onclick="add(${i},1)">+</button></div></div>`});document.getElementById('L').innerHTML=h;upd();}
function add(i,d){pan[i]=(pan[i]||0)+d;if(pan[i]<=0)delete pan[i];render();}
function upd(){let t=0,s="";for(let i in pan){t+=meds[i][1]*pan[i];s+=meds[i][0]+" x"+pan[i]+" = "+meds[i][1]*pan[i]+" GNF<br>"}document.getElementById('tot').innerText=t+" GNF";document.getElementById('cd').innerHTML=s||"Panier vide";}
function presence(){navigator.geolocation.getCurrentPosition(p=>alert("✅ Présence Filanidialakoro\n"+p.coords.latitude+", "+p.coords.longitude),()=>alert("Présence OK"));}
function save(){let n=document.getElementById('nom').value.trim();if(!n){alert('Mets le nom');return;}let t=0,its=[];for(let i in pan){its.push(meds[i][0]+' x'+pan[i]);t+=meds[i][1]*pan[i];}if(t==0){alert('Panier vide');return;}let ds=JSON.parse(localStorage.getItem('dettes')||'[]');ds.push({n,its,t,d:new Date().toLocaleString()});localStorage.setItem('dettes',JSON.stringify(ds));pan={};document.getElementById('nom').value='';render();alert('Dette '+n+' : '+t+' GNF OK');}
function openD(){let ds=JSON.parse(localStorage.getItem('dettes')||'[]');let h="",gt=0;ds.forEach(x=>{gt+=x.t;h+=`<div style="background:#fff;padding:10px;border-radius:12px;margin-bottom:8px"><b>${x.n}</b> - ${x.d}<br><small>${x.its.join(', ')}</small><br><b style=color:green>${x.t} GNF</b></div>`});h+=`<div style="background:#1a73e8;color:#fff;padding:12px;border-radius:12px;text-align:center"><b>TOTAL DETTES: ${gt} GNF</b></div>`;document.getElementById('LD').innerHTML=h||'Aucune dette';document.getElementById('det').style.display='block';}
</script></body></html>
