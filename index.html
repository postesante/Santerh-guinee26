 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filanidialakoro</title>
<style>
body{font-family:Arial;margin:0;background:#f0f2f5}
.header{padding:12px;text-align:center;color:white}
.patron{background:#2563eb} .suppleant{background:#ea580c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:white;padding:18px;border-radius:12px;text-align:center;font-weight:bold;cursor:pointer;box-shadow:0 2px 5px #0001}
.page{display:none;padding:10px}
.box{background:white;padding:12px;border-radius:12px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;background:white}
th{background:#2563eb;color:white;padding:10px;text-align:left}
td{padding:8px;border-bottom:1px solid #eee}
input.qte{width:80px;padding:10px;border:2px solid #22c55e;border-radius:8px;text-align:center;font-weight:bold;font-size:16px;background:#f0fdf4}
.sauv{font-size:10px;color:green;display:none}
</style>
</head>
<body>
<div id="top" class="header patron">
  <div id="title">👑 PATRON - Filanidialakoro</div>
  <div id="sync">🟢 Prêt</div>
</div>

<div id="menu" class="grid">
  <div id="bMeds" class="card" onclick="ouvrir('meds')" style="border:2px solid #2563eb">💊<br>Médicaments 28<br><small>Tape le nombre directement</small></div>
  <div id="bSuivi" class="card" onclick="ouvrir('suivi')" style="border:2px solid #ea580c">📈<br>SUIVI LIVE</div>
  <div id="bPrimes" class="card">🏆<br>Primes</div>
  <div id="bDettes" class="card">📒<br>Dettes Payé</div>
  <div id="bObs" class="card">📝<br>Observation</div>
  <div id="bPresence" class="card">✅<br>Présence 600k</div>
</div>

<div id="meds" class="page">
  <div class="box">
    <h3>💊 Tableau des 28 Médicaments</h3>
    <p style="color:#ea580c;font-weight:bold">Tape le nombre, ça s'enregistre seul vers le patron</p>
    <table><thead><tr><th>#</th><th>Médicament</th><th>Qté Stock</th></tr></thead><tbody id="tableBody"></tbody></table>
  </div>
  <button style="padding:12px;background:#666;color:white;border:none;border-radius:8px;width:100%" onclick="retour()">⬅ Retour</button>
</div>

<div id="suivi" class="page"><div class="box" style="background:#2563eb;color:white;text-align:center"><h3>👀 PATRON SUIT SUPPLÉANT</h3></div><div class="box"><div id="liveFeed"></div></div><button style="padding:12px;background:#666;color:white;border:none;border-radius:8px;width:100%" onclick="retour()">Retour</button></div>

<script>
const DB = "https://filanidialakoro-default-rtdb.firebaseio.com";
const params = new URLSearchParams(location.search);
const role = params.get('role') || 'patron';
const isSupp = role === 'suppleant';

const medsBase = ["Paracétamol 500mg","Amoxicilline 500mg","Métronidazole 250mg","Quinine 500mg","Cotrimoxazole","Ibuprofène 400mg","Chloroquine","Mebendazole","Artemether","Fer + Acide Folique","Amoxicilline sirop","Paracétamol sirop","SRO","Ciproflaxacine","Oméprazole","Diclofénac","Gentamicine","Pénicilline","Vitamine A","Vit B complexe","Albendazole","Captopril","Salbutamol","Doxycycline","Azithromycine","Lidocaïne","Ringer","Glucose"];

if(isSupp){
  document.getElementById('top').className='header suppleant';
  document.getElementById('title').innerText='🟠 SUPPLÉANT - Filanidialakoro - SEULEMENT MÉDICAMENTS';
  document.getElementById('sync').innerText='🟢 Tu ne peux modifier que les médicaments';
  // FERMER TOUT SAUF MÉDICAMENTS
  document.getElementById('bSuivi').style.display='none';
  document.getElementById('bPrimes').style.display='none';
  document.getElementById('bDettes').style.display='none';
  document.getElementById('bObs').style.display='none';
  document.getElementById('bPresence').style.display='none';
  document.getElementById('menu').style.gridTemplateColumns='1fr';
  document.getElementById('bMeds').style.padding='40px 20px';
  document.getElementById('bMeds').innerHTML='💊<br><span style="font-size:22px">MÉDICAMENTS 28</span><br><small>Tape le nombre ici</small>';
}

function ouvrir(id){ document.getElementById('menu').style.display='none'; document.getElementById(id).style.display='block'; if(id==='meds') charger(); }
function retour(){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById('menu').style.display='grid'; }

async function charger(){
  const r = await fetch(`${DB}/postes/stock28.json`); const stock = await r.json() || {};
  let html=''; medsBase.forEach((nom,i)=>{
    const qte = stock[i]?.qte ?? ''; const qui = stock[i]?.qui ? `<br><small style="color:#ea580c">par ${stock[i].qui}</small>` : ''; const sauvId=`sauv_${i}`;
    html+=`<tr><td>${i+1}</td><td><b>${nom}</b>${qui}<div id="${sauvId}" class="sauv">✅ Envoyé au patron</div></td><td><input class="qte" id="q_${i}" type="number" value="${qte}" placeholder="0" oninput="sauver(${i},'${nom.replace(/'/g,"\\'")}')" onfocus="this.select()"></td></tr>`;
  });
  document.getElementById('tableBody').innerHTML=html;
  const r2 = await fetch(`${DB}/postes/historique.json`); const hist = await r2.json(); let live=''; if(hist){ Object.values(hist).reverse().slice(0,20).forEach(h=>{ live+=`<div style="padding:8px;border-left:4px solid #22c55e;background:#f0fdf4;margin:5px 0">💊 <b>${h.nom}</b> → <b>${h.qte}</b><br><small>👤 ${h.qui} à ${h.date}</small></div>`; }); }
  document.getElementById('liveFeed').innerHTML=live||'Aucun';
}

let timers={};
async function sauver(index,nom){
  clearTimeout(timers[index]);
  timers[index]=setTimeout(async ()=>{
    const qteEl=document.getElementById('q_'+index); const qte=qteEl.value; if(qte==='') return;
    qteEl.style.background='#fff7ed';
    await fetch(`${DB}/postes/stock28/${index}.json`,{method:'PUT',body:JSON.stringify({nom:nom,qte:qte,qui:role,date:new Date().toLocaleTimeString('fr-GN')})});
    await fetch(`${DB}/postes/historique.json`,{method:'POST',body:JSON.stringify({nom:nom,qte:qte,qui:role,date:new Date().toLocaleTimeString('fr-GN')})});
    qteEl.style.background='#f0fdf4'; document.getElementById(`sauv_${index}`).style.display='block';
    document.getElementById('sync').innerText=`✅ ${nom} = ${qte} envoyé au patron !`;
    setTimeout(()=>{ document.getElementById(`sauv_${index}`).style.display='none'; },2000);
  },800);
}
charger();
</script>
</body>
</html>
