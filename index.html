<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poste de Santé - Filanidialakoro</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f1f5f9;padding:10px;padding-bottom:80px}
  .top{background:#fef3c7;border:2px solid #f59e0b;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:8px}
  .top2{background:#fef9c3;border:2px solid #eab308;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:8px}
  .top3{background:#dcfce7;border:2px solid #22c55e;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:12px}
  .form{background:#dbeafe;padding:14px;border-radius:14px}
  .form h2{margin:0 0 10px;font-size:16px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  label{font-size:13px;font-weight:bold;margin:10px 0 4px;display:block}
  input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;background:white}
  textarea{resize:vertical;min-height:55px}
  .btn-blue{width:100%;background:#2563eb;color:white;border:0;padding:13px;border-radius:10px;font-weight:bold;margin-top:10px;cursor:pointer}
  .btn-orange{width:100%;background:#f59e0b;color:white;border:0;padding:13px;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}
  .btn-red{background:#dc2626;color:white;border:0;padding:11px 14px;border-radius:10px;font-weight:bold;cursor:pointer}
  .hist{background:white;padding:12px;border-radius:12px;margin-top:12px}
  table{width:100%;background:white;border-collapse:collapse;font-size:12px;margin-top:10px}
  th{background:#0f766e;color:white;padding:9px;text-align:left}
  td{padding:9px;border-bottom:1px solid #e2e8f0;vertical-align:top}
  .del{background:#fee2e2;color:#991b1b;border:0;padding:6px 9px;border-radius:7px;cursor:pointer}
  .export{background:#111827;color:white;border:0;padding:10px 14px;border-radius:8px;margin:8px 4px 0 0;cursor:pointer}
</style>
</head>
<body>

<div class="top">💰 TOTAL STOCK : <span id="totalStock">5 211 000 GNF</span></div>
<div class="top2">💊 TOTAL MÉDICAMENTS VENDUS AUJOURD'HUI : <span id="vendusJour">0</span> médicaments</div>
<div class="top3">💰 SOMME TOTALE JOURNALIÈRE : <span id="sommeJour">0 GNF</span></div>

<div class="form">
  <h2>👤 NOUVEAU PATIENT - Dossier Complet</h2>

  <input id="nom" placeholder="Nom et Prénom du patient">

  <!-- ===== C'EST ICI QUE J'AI MODIFIÉ CHEF ===== -->
  <div class="row" style="margin-top:10px">
    <select id="sexe"><option value="">Sexe</option><option>Masculin</option><option>Féminin</option></select>
    <div style="display:flex;gap:6px">
      <input id="age" type="number" placeholder="Âge" style="flex:1">
      <select id="uniteAge" style="flex:1">
        <option value="Ans">Année(s)</option>
        <option value="Mois">Mois</option>
        <option value="Jours">Jour(s)</option>
      </select>
    </div>
  </div>

  <div class="row" style="margin-top:10px">
    <input id="village" placeholder="📍 Village / Provenance - ex: Filanidialakoro">
    <input id="tel" type="tel" placeholder="📞 Numéro de Téléphone - ex: 622 00 00 00">
  </div>
  <!-- ===== FIN MODIFICATION ===== -->

  <textarea id="plainte" placeholder="📝 Plainte - ex: Fièvre, maux de tête depuis 3 jours..."></textarea>
  <textarea id="examen" placeholder="🔬 Examen Paraclinique - ex: TDR Palu, Glycémie, Tension..."></textarea>
  <input id="diagnostic" placeholder="🩺 Diagnostic - ex: Paludisme simple">

  <label>💊 Traitement / Médicaments</label>
  <div id="meds"></div>
  <button class="btn-blue" onclick="ajouterLigne()">+ AJOUTER UN AUTRE MÉDICAMENT</button>
  <button class="btn-orange" onclick="enregistrer()">✅ ENREGISTRER PATIENT + DIMINUER STOCK</button>
</div>

<div class="hist">
  <h3 style="margin:0">📋 HISTORIQUE PAR PATIENT</h3>
  <input id="recherche" oninput="afficher()" placeholder="Rechercher patient, diagnostic..." style="margin-top:10px">
  <div style="overflow-x:auto">
  <table>
    <thead><tr><th>Patient</th><th>Âge / Village / Tél</th><th>Plainte</th><th>Diagnostic</th><th>Traitement / Prix</th><th>Action</th></tr></thead>
    <tbody id="liste"></tbody>
  </table>
  </div>
  <button class="export" onclick="window.print()">📥 Exporter / Imprimer</button>
  <button class="export" onclick="effacerTout()" style="background:#dc2626">🗑️ Tout effacer</button>
</div>

<script>
const STOCK_INIT = 5211000;
let patients = JSON.parse(localStorage.getItem('patients_filanidialakoro')||'[]');
let medicaments = [
  {nom:'Artemether 80mg', prix:15000},
  {nom:'Paracetamol 500mg', prix:5000},
  {nom:'Amoxicilline 500mg', prix:8000},
  {nom:'Ciprofloxacine', prix:10000},
  {nom:'Metronidazole', prix:6000},
  {nom:'Ibuprofene', prix:5000},
  {nom:'Vitamine C', prix:4000},
  {nom:'Fer + Acide Folique', prix:7000},
  {nom:'ORS / SRO', prix:3000},
  {nom:'Albendazole', prix:4000},
];

function ajouterLigne(){
  const div = document.createElement('div');
  div.style.cssText='display:grid;grid-template-columns:1fr 70px 40px;gap:6px;margin-top:8px';
  div.innerHTML = `<select class="med-nom"><option value="">Choisir médicament</option>${medicaments.map((m,i)=>`<option value="${i}">${m.nom} - ${m.prix} GNF</option>`).join('')}</select>
  <input class="med-qte" type="number" value="1" min="1">
  <button class="btn-red" onclick="this.parentElement.remove()">X</button>`;
  document.getElementById('meds').appendChild(div);
}
ajouterLigne();

function fmt(n){ return Number(n||0).toLocaleString('fr-GN')+' GNF'; }

function enregistrer(){
  const nom = document.getElementById('nom').value.trim();
  const village = document.getElementById('village').value.trim();
  const age = document.getElementById('age').value;
  if(!nom || !age || !village){ alert('Chef, mets le Nom, l\'Âge et le Village'); return; }
  let total=0, qteTotal=0, trait='';
  document.querySelectorAll('#meds > div').forEach(d=>{
    const idx=d.querySelector('.med-nom').value;
    const q=Number(d.querySelector('.med-qte').value||1);
    if(idx!==''){ const m=medicaments[idx]; total+=m.prix*q; qteTotal+=q; trait+=m.nom+' x'+q+' ; '; }
  });
  const p={
    id:Date.now(),
    nom:nom,
    sexe:document.getElementById('sexe').value,
    age:age,
    unite:document.getElementById('uniteAge').value,
    village:village,
    tel:document.getElementById('tel').value,
    plainte:document.getElementById('plainte').value,
    examen:document.getElementById('examen').value,
    diagnostic:document.getElementById('diagnostic').value,
    traitement:trait,
    prix:total,
    qte:qteTotal,
    date:new Date().toISOString().slice(0,10)
  };
  patients.unshift(p);
  localStorage.setItem('patients_filanidialakoro', JSON.stringify(patients));
  ['nom','village','tel','age','plainte','examen','diagnostic'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('meds').innerHTML=''; ajouterLigne();
  afficher();
  alert('Patient enregistré Chef ✅');
}

function supprimer(id){
  if(!confirm('Supprimer ?')) return;
  patients=patients.filter(x=>x.id!==id);
  localStorage.setItem('patients_filanidialakoro', JSON.stringify(patients));
  afficher();
}
function effacerTout(){
  if(!confirm('Tout effacer ?')) return;
  patients=[]; localStorage.removeItem('patients_filanidialakoro'); afficher();
}
function afficher(){
  const q=(document.getElementById('recherche').value||'').toLowerCase();
  const list=patients.filter(p=>(p.nom+' '+p.village+' '+p.diagnostic+' '+p.tel).toLowerCase().includes(q));
  const today=new Date().toISOString().slice(0,10);
  const auj=patients.filter(p=>p.date===today);
  document.getElementById('vendusJour').textContent=auj.reduce((s,p)=>s+(p.qte||1),0);
  document.getElementById('sommeJour').textContent=fmt(auj.reduce((s,p)=>s+p.prix,0));
  document.getElementById('totalStock').textContent=fmt(STOCK_INIT - patients.reduce((s,p)=>s+p.prix,0));
  document.getElementById('liste').innerHTML=list.map(p=>`
    <tr>
      <td><b>${p.nom}</b><br><span>${p.sexe}</span><br><small>${p.date}</small></td>
      <td><b>${p.age} ${p.unite}</b><br>📍 ${p.village}<br>📞 ${p.tel||'-'}</td>
      <td>${p.plainte||'-'}<br><small>Examen: ${p.examen||'-'}</small></td>
      <td><b>${p.diagnostic||'-'}</b></td>
      <td>${p.traitement||'-'}<br><b>${fmt(p.prix)}</b></td>
      <td><button class="del" onclick="supprimer(${p.id})">Supprimer</button></td>
    </tr>`).join('') || '<tr><td colspan="6" style="text-align:center">Aucun patient</td></tr>';
}
afficher();
</script>
</body>
</html>
