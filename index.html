<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filanidialakoro</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#1877f2;color:white;padding:14px;text-align:center;border-radius:10px;font-weight:bold;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:white;padding:16px;border-radius:10px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1);cursor:pointer;font-weight:bold}
#content{background:white;margin-top:12px;padding:12px;border-radius:10px;min-height:200px}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border:2px solid #1877f2;border-radius:8px;box-sizing:border-box;background:#fffde7;font-size:16px;color:#000}
.btn{border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold;color:white;cursor:pointer;margin-top:5px}
.btn-blue{background:#1877f2} .btn-green{background:#42b72a} .btn-orange{background:#ff9800} .btn-red{background:#e74c3c}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px} th,td{border:1px solid #ddd;padding:6px}
.section{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #e0e0e0}
.med-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.med-row select{flex:2} .med-row input{flex:1}
.total-box{background:#e3f2fd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px}
.somme-box{background:#e8f5e9;padding:6px;border-radius:6px;text-align:center;font-weight:bold;color:#2e7d32}
.jour-box{background:#fff3cd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #ffca28}
.jour-box2{background:#d4edda;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #28a745}
.thermo-box{background:#fff3cd !important;border:3px solid #1877f2 !important;padding:12px;border-radius:10px;margin:8px 0}
.thermo-box input{background:white !important;border:2px solid #1877f2 !important;font-size:18px;font-weight:bold}
.thermo-result{padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-top:10px;min-height:45px;border:2px solid #000;font-size:17px;background:#fff}
</style>
</head>
<body>
<div class="header" id="header">👑 PATRON - Accès complet<br><span style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</span></div>
<div class="grid" id="grid"></div>
<div id="content"><h3>Chargement...</h3></div>
<div id="gpsStatus" style="text-align:center;font-size:12px;color:#666;margin-top:8px"></div>
<script>
// === 1. AFFICHER D'ABORD LE MENU, AVANT FIREBASE (ANTI-PAGE BLANCHE) ===
let role = new URLSearchParams(location.search).get('role');
if(role){ localStorage.setItem('mon_role', role); } else { role = localStorage.getItem('mon_role') || 'patron'; }
const isPatron = role==='patron';
document.getElementById('header').innerHTML = isPatron ? '👑 PATRON - Accès complet<br><span style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</span>' : '👤 SUPPLÉANT';

// === 2. FIREBASE PROTÉGÉ - SI CLÉ FAUSSE, ÇA NE BLOQUE PLUS ===
let db = null;
try{
  const firebaseConfig = {
    apiKey: "COLLE TA VRAIE CLE ICI - REGARDE HISTORY",
    authDomain: "filanidialakoro.firebaseapp.com",
    databaseURL: "https://filanidialakoro-default-rtdb.firebaseio.com",
    projectId: "filanidialakoro",
    storageBucket: "filanidialakoro.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcd"
  };
  // Si la clé est encore le faux texte, on n'initialise pas Firebase pour ne pas bloquer
  if(firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('COLLE TA VRAIE')){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } else {
    console.log('Firebase non configuré - mode local');
    document.getElementById('gpsStatus').innerHTML = '⚠️ Mode local - Mets ta vraie clé Firebase pour synchroniser';
  }
}catch(e){
  console.log('Erreur Firebase, mode local :', e);
  db = null;
  document.getElementById('gpsStatus').innerHTML = '⚠️ Mode local - Vérifie ta clé Firebase';
}

// === 3. FAUSSE BASE LOCALE SI FIREBASE NE MARCHE PAS (POUR NE JAMAIS AVOIR PAGE BLANCHE) ===
if(!db){
  db = {
    ref: function(path){
      return {
        on: function(ev, cb){ 
          let val = JSON.parse(localStorage.getItem('local_'+path) || 'null');
          cb({ val: function(){ return val; } });
        },
        push: function(obj){ 
          let arr = JSON.parse(localStorage.getItem('local_'+path) || '{}');
          let k = 'k'+Date.now(); arr[k]=obj; localStorage.setItem('local_'+path, JSON.stringify(arr));
          return Promise.resolve();
        },
        set: function(v){ localStorage.setItem('local_'+path, JSON.stringify(v)); return Promise.resolve(); },
        remove: function(){ localStorage.removeItem('local_'+path); return Promise.resolve(); },
        limitToLast: function(n){ return this; }
      };
    }
  };
}

let gridHTML=`<div class="card" onclick="openModule('medicaments')">💊 Médicaments</div><div class="card" onclick="openModule('dettes')">📒 Dettes Payé</div><div class="card" onclick="openModule('thermometre')" style="background:#fff3cd;border:3px solid #1877f2">🌡️ Thermomètre</div>`;
if(isPatron){ gridHTML+=`<div class="card" onclick="openModule('suivi')">📈 SUIVI LIVE</div><div class="card" onclick="openModule('primes')">🏆 Primes</div><div class="card" onclick="openModule('observation')">📝 Observation</div><div class="card" onclick="openModule('presence')">✅ Présence 600k</div><div class="card" onclick="openModule('localisation')">📍 Localisation GPS</div>`; }
document.getElementById('grid').innerHTML=gridHTML;
function openModule(n){ if(n==='medicaments') loadMedicaments(); if(n==='dettes') loadDettes(); if(n==='thermometre') loadThermometre(); if(n==='suivi') loadSuivi(); if(n==='primes') loadPrimes(); if(n==='observation') loadObservation(); if(n==='presence') loadPresence(); if(n==='localisation') loadLocalisation(); }
function trackLocation(){
  if(!navigator.geolocation){ document.getElementById('gpsStatus').innerHTML='GPS non supporté'; return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    let lat = pos.coords.latitude; let lng = pos.coords.longitude; let acc = Math.round(pos.coords.accuracy);
    document.getElementById('gpsStatus').innerHTML = '📍 GPS activé';
    try{ db.ref('localisations').push({ role: role, lat: lat, lng: lng, accuracy: acc, date: new Date().toLocaleString(), maps: 'https://www.google.com/maps?q='+lat+','+lng }); }catch(e){}
  }, function(err){ document.getElementById('gpsStatus').innerHTML = '⚠️ GPS refusé'; }, {enableHighAccuracy:true, timeout:10000});
}
try{ trackLocation(); }catch(e){}
setInterval(function(){ try{ trackLocation(); }catch(e){} }, 5*60*1000);
function loadLocalisation(){
  document.getElementById('content').innerHTML='<h3>📍 Localisation GPS</h3><div id="locList">Chargement...</div>';
  db.ref('localisations').limitToLast(100).on('value', snap=>{
    let d=snap.val()||{}; let h='<table><tr><th>Date</th><th>Qui</th><th>Position</th><th>Voir</th></tr>'; let keys=Object.keys(d).reverse();
    for(let k of keys){ let l=d[k]; if(!l.lat) continue; let badge = l.role==='patron' ? '👑 PATRON' : '👤 SUPPLÉANT'; let color = l.role==='patron' ? '#e3f2fd' : '#fff3cd'; h+=`<tr style="background:${color}"><td>${l.date}</td><td><b>${badge}</b></td><td>${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}<br><small>Précision: ${l.accuracy}m</small></td><td><a href="${l.maps}" target="_blank" style="background:#1877f2;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold">🗺️ Voir</a></td></tr>`; }
    document.getElementById('locList').innerHTML = h+'</table><br><button class="btn btn-red" onclick="if(confirm(\'Effacer ?\')) db.ref(\'localisations\').remove()">Effacer historique</button>';
  });
}
function getThermoInterpretation(t){
  if(t < 36.5) return {msg:'🔵 TEMPÉRATURE BASSE - Couvre-toi bien', couleur:'#38bdf8', txt:'#000'};
  if(t <= 37.5) return {msg:'🟢 NORMAL - Pas de fièvre', couleur:'#4ade80', txt:'#000'};
  if(t <= 38.5) return {msg:'🟡 FIÈVRE LÉGÈRE - Repos, bois beaucoup d’eau', couleur:'#facc15', txt:'#000'};
  return {msg:'🔴 ALERTE ROUGE - FIÈVRE FORTE ! Hôpital vite !', couleur:'#ef4444', txt:'#fff'};
}
function loadThermometre(){
  document.getElementById('content').innerHTML=`
  <div class="thermo-box">
  <h3 style="margin:0">🌡️ Thermomètre - Patient</h3>
  <p style="font-size:13px;margin:5px 0">1. Mesure avec le thermomètre<br>2. Tape le chiffre ici<br>3. Clique VÉRIFIER</p>
  <input id="thermoNom" placeholder="Nom du patient Ex: Mamadou">
  <input id="thermoTemp" type="number" step="0.1" placeholder="Température Ex: 38.2">
  <button class="btn btn-blue" onclick="checkThermo()">VÉRIFIER LA TEMPÉRATURE</button>
  <div id="thermoResult" class="thermo-result">👆 Le résultat va s'afficher ici en couleur</div>
  </div>
  <div class="section"><b>ℹ️ Rappel :</b><br>36.5 à 37.5 = Normal 🟢<br>37.5 à 38.5 = Fièvre légère 🟡<br>38.5 et + = Va à l'hôpital vite 🔴</div>
  <div class="section"><b>📋 Derniers patients avec température</b><div id="thermoHist">Chargement...</div></div>`;
  db.ref('consultations').limitToLast(20).on('value', snap=>{
    let d=snap.val()||{}; let h=''; let keys=Object.keys(d).reverse();
    for(let k of keys){ if(d[k].temp){ let inter=getThermoInterpretation(parseFloat(d[k].temp)); h+=`<div style="padding:6px;border-bottom:1px solid #eee"><b>${d[k].patient}</b> : ${d[k].temp}°C - ${inter.msg}<br><small>${d[k].date}</small></div>`; } }
    document.getElementById('thermoHist').innerHTML = h || 'Aucune température encore';
  });
}
function checkThermo(){
  let nom=document.getElementById('thermoNom').value.trim() || 'Patient';
  let t=parseFloat(document.getElementById('thermoTemp').value);
  if(!t) return alert('Mets la température Ex: 38.2');
  let inter=getThermoInterpretation(t);
  let el=document.getElementById('thermoResult');
  el.innerHTML=`${nom} : ${t}°C<br>${inter.msg}`;
  el.style.background = inter.couleur; el.style.color = inter.txt;
}
let postesData={};
function loadMedicaments(){
let h=`
<div class="section">
<b>STOCK PERMANENT</b>
${isPatron?`<input id="newMedName" placeholder="Nom nouveau médicament"><input id="newMedPrix" type="number" placeholder="Prix unitaire ex: 500"><button class="btn btn-green" onclick="addMedicament()">AUGMENTER LA LISTE</button>`:''}
<div id="medTable">Chargement...</div>
<div id="totalStockBox"></div>
<div id="totalJourBox"></div>
</div>
<div class="section" style="background:#e3f2fd">
<b>👤 NOUVEAU PATIENT - Dossier Complet</b>
<input id="patientName" placeholder="Nom et Prénom du patient">
<div style="display:flex;gap:6px">
<select id="patientSexe" style="flex:1"><option value="">Sexe</option><option value="Homme">👨 Homme</option><option value="Femme">👩 Femme</option></select>
<input id="patientAge" type="number" placeholder="Âge" style="flex:1">
</div>
<div class="thermo-box">
<b style="font-size:14px">🌡️ TEMPÉRATURE DU PATIENT</b>
<input id="patientTemp" type="number" step="0.1" placeholder="Température Ex: 38.2">
<button class="btn btn-blue" onclick="checkTempDansDossier()">VÉRIFIER TEMPÉRATURE</button>
<div id="tempDossierResult" class="thermo-result">Résultat ici</div>
</div>
<textarea id="patientPlainte" rows="2" placeholder="📝 Plainte - ex: Fièvre, maux de tête depuis 3 jours..."></textarea>
<textarea id="patientExamen" rows="2" placeholder="🔬 Examen Paraclinique - ex: TDR Palu, Glycémie, Tension..."></textarea>
<input id="patientDiag" placeholder="🩺 Diagnostic - ex: Paludisme simple">
<b style="font-size:13px">💊 Traitement / Médicaments</b>
<div id="medRows"></div>
<button class="btn btn-blue" onclick="addMedRow()">+ AJOUTER UN AUTRE MÉDICAMENT</button>
<button class="btn btn-orange" onclick="saveConsultation()">✅ ENREGISTRER PATIENT + DIMINUER STOCK</button>
</div>
<div class="section">
<b>📋 HISTORIQUE PAR PATIENT</b>
<input id="searchPatient" placeholder="Rechercher patient, diagnostic..." oninput="filterPatients()">
<div id="consultTable">Chargement...</div>
</div>`;
document.getElementById('content').innerHTML=h;
loadStock(); loadConsultations(); addMedRow();
}
function checkTempDansDossier(){
  let t=parseFloat(document.getElementById('patientTemp').value);
  if(!t) return alert('Mets la température Ex: 38.2');
  let inter=getThermoInterpretation(t);
  let el=document.getElementById('tempDossierResult');
  el.innerHTML=`${t}°C - ${inter.msg}`; el.style.background=inter.couleur; el.style.color=inter.txt;
}
function loadStock(){
 db.ref('postes').on('value',snap=>{
  postesData=snap.val()||{};
  let t='<table><tr><th>Nom</th><th>Stock</th><th>Prix unitaire</th><th>Total de prix</th>'+(isPatron?'<th>X</th>':'')+'</tr>';
  let grandTotal=0;
  for(let k in postesData){
    let q = postesData[k].quantite||0; let p = postesData[k].prix||0; let total = q * p; grandTotal += total;
    t+=`<tr><td>${postesData[k].nom||k}</td><td>${isPatron?`<input id="q_${k}" type="number" value="${q}" onchange="updateQ('${k}')" style="padding:4px">`:`<b style="font-size:16px">${q}</b>`}</td><td>${isPatron?`<input id="p_${k}" type="number" value="${p}" onchange="updatePrix('${k}')" placeholder="0" style="padding:4px">`:`<b>${p.toLocaleString()} GNF</b>`}</td><td><b>${total.toLocaleString()} GNF</b></td>${isPatron?`<td><button onclick="deleteMed('${k}')">X</button></td>`:''}</tr>`;
  }
  t+='</table>';
  document.getElementById('medTable').innerHTML=t;
  document.getElementById('totalStockBox').innerHTML=`<div class="total-box">💰 TOTAL STOCK : ${grandTotal.toLocaleString()} GNF</div>`;
  updateAllSelects(); if(document.getElementById('consultTable')) renderConsultations(allCons);
 });
}
function getSelectHTML(){ let html='<option value="">Choisir médicament</option>'; for(let k in postesData){ html+=`<option value="${k}">${postesData[k].nom||k} (stock:${postesData[k].quantite||0} - prix:${postesData[k].prix||0})</option>`; } return html; }
function addMedRow(){ let div=document.createElement('div'); div.className='med-row'; div.innerHTML=`<select class="medSelect">${getSelectHTML()}</select><input type="number" class="medQte" placeholder="Qté" value="1" style="width:70px"><button class="btn btn-red" style="width:40px;padding:6px" onclick="this.parentElement.remove()">X</button>`; document.getElementById('medRows').appendChild(div); }
function updateAllSelects(){ let selHTML=getSelectHTML(); document.querySelectorAll('.medSelect').forEach(sel=>{ let val=sel.value; sel.innerHTML=selHTML; sel.value=val; }); }
function addMedicament(){ if(!isPatron) return alert('Seul le Patron'); let nom=document.getElementById('newMedName').value.trim(); let prix=parseInt(document.getElementById('newMedPrix').value)||0; if(!nom)return; let key=nom.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now(); db.ref('postes/'+key).set({nom:nom,quantite:0,prix:prix}).then(()=>{ document.getElementById('newMedName').value=''; document.getElementById('newMedPrix').value=''; }); }
function updateQ(k){ if(!isPatron) return alert('Seul le Patron peut changer le stock'); let q=document.getElementById('q_'+k).value; db.ref('postes/'+k+'/quantite').set(parseInt(q)||0); }
function updatePrix(k){ if(!isPatron) return alert('Seul le Patron peut changer le prix'); let p=document.getElementById('p_'+k).value; db.ref('postes/'+k+'/prix').set(parseInt(p)||0); }
function deleteMed(k){if(confirm('Supprimer?')) db.ref('postes/'+k).remove();}
function saveConsultation(){
 let patient=document.getElementById('patientName').value.trim(); if(!patient) return alert('Mets nom du patient');
 let sexe=document.getElementById('patientSexe').value||''; let age=document.getElementById('patientAge').value||''; let temp=document.getElementById('patientTemp').value||'';
 let plainte=document.getElementById('patientPlainte').value||''; let examen=document.getElementById('patientExamen').value||''; let diagnostic=document.getElementById('patientDiag').value||'';
 let rows=document.querySelectorAll('.med-row'); let meds=[];
 for(let r of rows){ let key=r.querySelector('.medSelect').value; let qte=parseInt(r.querySelector('.medQte').value)||0; if(key && qte>0){ meds.push({key:key, nom:postesData[key]?.nom||key, qte:qte, prix:postesData[key]?.prix||0}); } }
 if(meds.length===0) return alert('Ajoute au moins 1 médicament');
 meds.forEach(m=>{ let cur=postesData[m.key]?.quantite||0; db.ref('postes/'+m.key+'/quantite').set(cur - m.qte); });
 db.ref('consultations').push({patient:patient, sexe:sexe, age:age, temp:temp, plainte:plainte, examen:examen, diagnostic:diagnostic, meds:meds, date:new Date().toLocaleString(), role:role});
 document.getElementById('patientName').value=''; document.getElementById('patientSexe').value=''; document.getElementById('patientAge').value=''; document.getElementById('patientTemp').value=''; document.getElementById('patientPlainte').value=''; document.getElementById('patientExamen').value=''; document.getElementById('patientDiag').value=''; document.getElementById('medRows').innerHTML=''; addMedRow(); addMedRow(); alert('✅ '+patient+' enregistré - Temp: '+temp+'°C');
}
let allCons={};
function loadConsultations(){ db.ref('consultations').on('value',snap=>{ allCons=snap.val()||{}; renderConsultations(allCons); });}
function renderConsultations(data){
 let h='<table><tr><th>Date</th><th>Patient<br><small>Sexe / Âge</small></th><th>🌡️ Temp</th><th>📝 Plainte</th><th>🔬 Examen Para</th><th>🩺 Diagnostic</th><th>💊 Traitement + Prix</th><th>Somme Totale</th>'+(isPatron?'<th>X</th>':'')+'</tr>'; let keys=Object.keys(data).reverse(); let totalJour = 0; let qteJour = 0; let aujourdhui = new Date().toLocaleDateString();
 for(let k of keys){ let c=data[k]; let medsTxt=''; let sommeTotale=0; if(c.meds){ c.meds.forEach(m=>{ let prixReel = (m.prix && m.prix>0) ? m.prix : (postesData[m.key]?.prix||0); let pt = prixReel * m.qte; sommeTotale += pt; medsTxt+=`<div>• ${m.nom} : <b>${m.qte}</b> x ${prixReel.toLocaleString()} = ${pt.toLocaleString()} GNF</div>`; }); } else { medsTxt=c.med||''; } if(c.date && c.date.startsWith(aujourdhui)){ totalJour += sommeTotale; if(c.meds){ c.meds.forEach(m=>{ qteJour += m.qte; }); } } let tempAff = c.temp ? `<b>${c.temp}°C</b><br><small>${getThermoInterpretation(parseFloat(c.temp)).msg}</small>` : '-'; h+=`<tr><td>${c.date}</td><td><b>${c.patient}</b><br><small>${c.sexe||''} ${c.age?c.age+' ans':''}</small></td><td>${tempAff}</td><td>${c.plainte||'-'}</td><td>${c.examen||'-'}</td><td><b>${c.diagnostic||'-'}</b></td><td>${medsTxt}</td><td><div class="somme-box">${sommeTotale.toLocaleString()} GNF</div></td>${isPatron?`<td><button onclick="db.ref('consultations/${k}').remove()">X</button></td>`:''}</tr>`; }
 h+='</table>'; if(document.getElementById('consultTable')) document.getElementById('consultTable').innerHTML = keys.length? h : 'Aucun patient encore'; if(document.getElementById('totalJourBox')){ document.getElementById('totalJourBox').innerHTML = `<div class="jour-box">💊 TOTAL MÉDICAMENTS VENDUS AUJOURD'HUI : ${qteJour} médicaments</div><div class="jour-box2">💰 SOMME TOTALE JOURNALIÈRE : ${totalJour.toLocaleString()} GNF</div>`; }
}
function filterPatients(){ let q=document.getElementById('searchPatient').value.toLowerCase(); let filtered={}; for(let k in allCons){ let txt=((allCons[k].patient||'')+' '+(allCons[k].diagnostic||'')+' '+(allCons[k].plainte||'')).toLowerCase(); if(txt.includes(q)) filtered[k]=allCons[k]; } renderConsultations(filtered); }
function loadDettes(){document.getElementById('content').innerHTML='<h3>📒 Dettes Payé</h3><input id="dNom" placeholder="Nom"><input id="dMont" type="number" placeholder="Montant"><button
