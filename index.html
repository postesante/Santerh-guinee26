 <!DOCTYPE html>

<style>
body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0}
.header{color:white;text-align:center;padding:18px 10px;font-weight:bold}
.patron{background:#2563eb}.suppleant{background:#ea580c}
.sync{margin-top:6px;font-size:13px;background:rgba(255,255,255,.25);display:inline-block;padding:4px 12px;border-radius:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:white;border-radius:14px;padding:18px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;font-weight:600;position:relative;min-height:75px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card.locked{opacity:.38;pointer-events:none;background:#e5e7eb}
.card.locked::after{content:"🔒 Verrouillé";position:absolute;bottom:4px;font-size:10px;background:#111;color:white;padding:2px 6px;border-radius:8px}
.live{background:white;margin:0 14px 14px;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.small{font-size:12px;color:#6b7280}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #d1d5db;box-sizing:border-box}
button.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#2563eb;color:white;font-weight:bold;margin-top:6px}
.view{display:none;padding:14px}.view.show{display:block}
</style>
</head>
