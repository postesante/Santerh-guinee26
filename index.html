<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filanidialakoro</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#1877f2;color:white;padding:12px;text-align:center;border-radius:10px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:white;padding:16px;border-radius:10px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1);cursor:pointer;font-weight:bold}
#content{background:white;margin-top:12px;padding:12px;border-radius:10px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.btn{border:none;padding:11px;border-radius:8px;width:100%;font-weight:bold;color:white;cursor:pointer;margin-top:5px}
.btn-blue{background:#1877f2} .btn-green{background:#42b72a} .btn-orange{background:#ff9800} .btn-red{background:#e74c3c}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px} th,td{border:1px solid #ddd;padding:6px}
.section{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #e0e0e0}
.med-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.med-row select{flex:2} .med-row input{flex:1}
.total-box{background:#e3f2fd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px}
.somme-box{background:#e8f5e9;padding:6px;border-radius:6px;text-align:center;font-weight:bold;color:#2e7d32}
.jour-box{background:#fff3cd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #ffca28}
.jour-box2{background:#d4edda;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #28a745}
.bilan-box{background:white;padding:14px;border-radius:10px;text-align:center;margin-top:10px;border:2px solid #1877f2}
.bilan-big{font-size:22px;font-weight:bold}
.num-col{width:32px;text-align:center;font-weight:bold;background:#f0f2f5}
.alert-box{background:#ffebee;padding:12px;border-radius:10px;border:2px solid #e74c3c;text-align:center;font-weight:bold;margin-top:10px;color:#b71c1c}
.alert-ok{background:#e8f5e9;padding:10px;border-radius:10px;border:1px solid #42b72a;text-align:center;font-weight:bold;margin-top:10px;color:#2e7d32}
.low-row{background:#ffebee !important}
.zero-row{background:#ffcdd2 !important}
.caisse-big{background:#1877f2;color:white;padding:16px;border-radius:12px;text-align:center;margin-top:10px}
.caisse-big b{font-size:26px}
</style>
</head>
<body>
<div class="header" id="header"></div>
<div class="grid" id="grid"></div>
<div id="content"></div>
<div id="gpsStatus" style="text-align:center;font-size:12px;color:#666;margin-top:8px"></div>
<div id="errorBox" style="color:red;text-align:center;font-size:12px"></div>
<script>
window.onerror=function(m){document.getElementById('errorBox').innerHTML='Erreur: '+m;};
const DB_URL="https://filanidialakoro-default-rtdb.firebaseio.com";
function dbGet(path){return fetch(DB_URL+"/"+path+".json").then(r=>r.json()).then(d=>d||null).catch(e=>null);}
function dbSet(path,val){return fetch(DB_URL+"/"+path+".json",{method:"PUT",body:JSON.stringify(val)}).catch(e=>{});}
function dbPush(path,val){return fetch(DB_URL+"/"+path+".json",{method:"POST",body:JSON.stringify(val)}).then(r=>r.json()).catch(e=>{});}
function dbRemove(path){return fetch(DB_URL+"/"+path+".json",{method:"DELETE"}).catch(e=>{});}
let _listeners=[]; let _isTyping=false;
document.addEventListener('focusin',function(e){if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')) _isTyping=true;});
document.addEventListener('focusout',function(e){setTimeout(function(){_isTyping=false;},800);});
function _notify(){if(_isTyping) return; _listeners.forEach(function(L){dbGet(L.path).then(function(v){if(L.limit && v){let ks=Object.keys(v);let s={};ks.slice(-L.limit).forEach(k=>s[k]=v[k]);v=s;}L.cb({val:function(){return v;}});});});}
setInterval(_notify,30000);
function makeRef(path,limit){return{on:function(ev,cb){_listeners.push({path:path,cb:cb,limit:limit});dbGet(path).then(function(v){if(limit && v){let ks=Object.keys(v);let s={};ks.slice(-limit).forEach(k=>s[k]=v[k]);v=s;}cb({val:function(){return v;}});});},limitToLast:function(n){return makeRef(path,n);},push:function(val){let p=dbPush(path,val);setTimeout(function(){_notify();},1000);return p;},set:function(val){let p=dbSet(path,val);setTimeout(function(){_notify();},1000);return Promise.resolve();},remove:function(){let p=dbRemove(path);setTimeout(function(){_notify();},1000);return Promise.resolve();}};}
const db={ref:function(p){return makeRef(p,0);}};
let role=new URLSearchParams(location.search).get('role');
if(role){try{localStorage.setItem('mon_role',role);}catch(e){}}else{try{role=localStorage.getItem('mon_role')||'patron';}catch(e){role='patron';}}
const isPatron=role==='patron';
document.getElementById('header').innerHTML=isPatron?'<div>👑 PATRON - Accès complet</div><div style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</div><div style="font-size:11px;background:#42b72a;padding:4px;border-radius:6px;margin-top:6px">✅ CONNECTÉ À FIREBASE - MODE LENT</div>':'👤 SUPPLÉANT - 2 modules';
let gridHTML=`<div class="card" onclick="openModule('medicaments')">💊 Médicaments</div><div class="card" onclick="openModule('dettes')">📒 Dettes Payé</div>`;
if(isPatron){gridHTML+=`<div class="card" onclick="openModule('bilan')">📊 BILAN DU MOIS</div><div class="card" onclick="openModule('localisation')">📍 Localisation GPS</div><div class="card" style="background:#1877f2;color:white" onclick="openModule('caisse')">💰 CAISSE DU JOUR</div>`;}
document.getElementById('grid').innerHTML=gridHTML;
function openModule(n){if((n==='bilan'||n==='caisse'||n==='localisation') && !isPatron){alert('Seul le Patron peut voir');return;} if(n==='medicaments') loadMedicaments(); if(n==='dettes') loadDettes(); if(n==='bilan') loadBilan(); if(n==='localisation') loadLocalisation(); if(n==='caisse') loadCaisse();}
function isThisMonth(dateStr){if(!dateStr) return false;let now=new Date();let m=now.getMonth()+1;let y=now.getFullYear();let mm=m<10?'0'+m:''+m;return dateStr.includes('/'+m+'/'+y) || dateStr.includes('/'+mm+'/'+y) || dateStr.includes(m+'/'+y);}
function isToday(dateStr){if(!dateStr) return false; return dateStr.startsWith(new Date().toLocaleDateString());}

// ===== CAISSE DU JOUR =====
function loadCaisse(){
if(!isPatron){document.getElementById('content').innerHTML='<h3>⛔ Accès refusé</h3>';return;}
document.getElementById('content').innerHTML='<h3>💰 CAISSE DU JOUR - '+new Date().toLocaleDateString()+'</h3><div id="caisseBox">Chargement...</div><div id="caisseDetail"></div><button class="btn btn-green" onclick="loadCaisse()">🔄 Actualiser</button>';
Promise.all([dbGet('consultations'),dbGet('dettes_paye')]).then(function(res){
let cons=res[0]||{};let dettes=res[1]||{};
let ventesJour=0; let qteJour=0; let nbPatientsJour=0; let detailJour=[];
for(let k in cons){let c=cons[k]; if(!isToday(c.date)) continue; nbPatientsJour++; let somme=0; if(c.meds){c.meds.forEach(function(m){let pr=(m.prix&&m.prix>0)?m.prix:(postesData[m.key]?.prix||0); somme+=pr*m.qte; qteJour+=m.qte;});} ventesJour+=somme; detailJour.push({patient:c.patient||'?', somme:somme, heure:c.date, role:c.role||''});}
let dettesJour=0; let nbDettesJour=0; let detailDettes=[];
for(let k in dettes){let d=dettes[k]; if(!isToday(d.date)) continue; dettesJour+=parseInt(d.montant)||0; nbDettesJour++; detailDettes.push(d);}
let caisse = ventesJour - dettesJour;
let html=`<div class="bilan-box" style="background:#e3f2fd"><div>💊 VENTES AUJOURD'HUI</div><div class="bilan-big">${ventesJour.toLocaleString()} GNF</div><div>${nbPatientsJour} patients - ${qteJour} boîtes</div></div><div class="bilan-box" style="background:#fff3cd;border-color:#ff9800"><div>📒 DETTES AUJOURD'HUI</div><div class="bilan-big" style="color:#e65100">${dettesJour.toLocaleString()} GNF</div><div>${nbDettesJour} dettes</div></div><div class="caisse-big"><div>💰 ARGENT EN CAISSE CE SOIR</div><b>${caisse.toLocaleString()} GNF</b><div style="font-size:13px;margin-top:6px">Ventes ${ventesJour.toLocaleString()} - Dettes ${dettesJour.toLocaleString()} = ${caisse.toLocaleString()}</div><div style="font-size:12px;margin-top:6px">${caisse<0?'⚠️ Attention caisse négative, vérifie les dettes':caisse===0?'Aucune vente encore aujourd\'hui':'✅ Vérifie que tu as bien ce montant dans ta main'}</div></div>`;
document.getElementById('caisseBox').innerHTML=html;
let det='<h4>📋 Détail ventes aujourd\'hui</h4><table><tr><th>N°</th><th>Heure</th><th>Patient</th><th>Qui a vendu</th><th>Somme</th></tr>'; let idx=1; detailJour.reverse().forEach(function(d){det+=`<tr><td class="num-col">${idx++}</td><td>${d.heure}</td><td>${d.patient}</td><td>${d.role==='suppleant'?'👤 Suppléant':'👑 Patron'}</td><td><b>${d.somme.toLocaleString()} GNF</b></td></tr>`;}); det+='</table>';
let det2='<h4>📒 Détail dettes aujourd\'hui</h4>'; if(detailDettes.length){det2+='<table><tr><th>N°</th><th>Nom</th><th>Montant</th><th>Date</th></tr>'; let i2=1; detailDettes.forEach(function(d){det2+=`<tr><td class="num-col">${i2++}</td><td>${d.nom}</td><td>${d.montant} GNF</td><td>${d.date}</td></tr>`;}); det2+='</table>';} else det2+='<p>Aucune dette aujourd\'hui ✅</p>';
document.getElementById('caisseDetail').innerHTML=(detailJour.length?det:'<p>Aucune vente aujourd\'hui</p>')+det2;
});
}

function loadBilan(){
if(!isPatron){document.getElementById('content').innerHTML='<h3>⛔ Accès refusé</h3><p>Seul le Patron peut voir le Bilan du Mois.</p>';return;}
document.getElementById('content').innerHTML='<h3>📊 BILAN DU MOIS - '+new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</h3><div id="bilanBox">Chargement...</div><div id="bilanDetail"></div>';
Promise.all([dbGet('consultations'),dbGet('dettes_paye'),dbGet('postes')]).then(function(res){
let cons=res[0]||{};let dettes=res[1]||{};let postes=res[2]||{};
let qteMois=0;let sommeVentesMois=0;let nbPatientsMois=0;let detailMed={};
for(let k in cons){let c=cons[k];if(!isThisMonth(c.date)) continue;nbPatientsMois++;if(c.meds){c.meds.forEach(function(m){let pr=(m.prix&&m.prix>0)?m.prix:(postes[m.key]?.prix||0);let pt=pr*m.qte;sommeVentesMois+=pt;qteMois+=m.qte;if(!detailMed[m.nom]) detailMed[m.nom]={qte:0,somme:0};detailMed[m.nom].qte+=m.qte;detailMed[m.nom].somme+=pt;});}}
let totalDettesMois=0;let nbDettesMois=0;
for(let k in dettes){let d=dettes[k];if(!isThisMonth(d.date)) continue;totalDettesMois+=parseInt(d.montant)||0;nbDettesMois++;}
let soldeMois=sommeVentesMois-totalDettesMois;
let totalStock=0;for(let k in postes){totalStock+=(postes[k].quantite||0)*(postes[k].prix||0);}
let html=`<div class="bilan-box" style="background:#e3f2fd"><div>💊 MÉDICAMENTS UTILISÉS CE MOIS</div><div class="bilan-big">${qteMois} boîtes</div><div>${sommeVentesMois.toLocaleString()} GNF vendus</div><div>👥 ${nbPatientsMois} patients ce mois</div></div><div class="bilan-box" style="background:#fff3cd;border-color:#ff9800"><div>📒 DETTES DANS LE MOIS</div><div class="bilan-big" style="color:#e65100">${totalDettesMois.toLocaleString()} GNF</div><div>${nbDettesMois} dettes enregistrées</div></div><div class="bilan-box" style="background:#e8f5e9;border-color:#42b72a"><div>💰 SOLDE DU MOIS</div><div class="bilan-big" style="color:#2e7d32">${soldeMois.toLocaleString()} GNF</div><div>Ventes - Dettes = ${sommeVentesMois.toLocaleString()} - ${totalDettesMois.toLocaleString()}</div></div><div class="bilan-box"><div>📦 STOCK RESTANT ACTUEL</div><div class="bilan-big">${totalStock.toLocaleString()} GNF</div></div>`;
document.getElementById('bilanBox').innerHTML=html;
let det='<h4>📋 Détail par médicament ce mois</h4><table><tr><th>N°</th><th>Médicament</th><th>Quantité utilisée</th><th>Somme</th></tr>';let idx=1;for(let n in detailMed){det+=`<tr><td class="num-col">${idx++}</td><td>${n}</td><td><b>${detailMed[n].qte}</b></td><td>${detailMed[n].somme.toLocaleString()} GNF</td></tr>`;}det+='</table>';document.getElementById('bilanDetail').innerHTML=Object.keys(detailMed).length?det:'<p>Aucune vente ce mois pour le moment</p>';
});
}
function trackLocation(){if(!navigator.geolocation){document.getElementById('gpsStatus').innerHTML='GPS non supporté';return;}navigator.geolocation.getCurrentPosition(function(pos){let lat=pos.coords.latitude;let lng=pos.coords.longitude;let acc=Math.round(pos.coords.accuracy);document.getElementById('gpsStatus').innerHTML='📍 GPS activé';try{db.ref('localisations').push({role:role,lat:lat,lng:lng,accuracy:acc,date:new Date().toLocaleString(),maps:'https://www.google.com/maps?q='+lat+','+lng,device:(navigator.userAgent||'').substring(0,80)});}catch(e){}},function(err){document.getElementById('gpsStatus').innerHTML='⚠️ GPS refusé';},{enableHighAccuracy:true,timeout:10000});}
try{trackLocation();}catch(e){} setInterval(function(){try{trackLocation();}catch(e){}},15*60*1000);
function loadLocalisation(){document.getElementById('content').innerHTML='<h3>📍 Localisation GPS</h3><div id="locList">Chargement...</div>';db.ref('localisations').limitToLast(100).on('value',snap=>{let d=snap.val()||{};let h='<table><tr><th>N°</th><th>Date</th><th>Qui</th><th>Position</th><th>Voir</th></tr>';let keys=Object.keys(d).reverse();let i=1;for(let k of keys){let l=d[k];let badge=l.role==='patron'?'👑 PATRON':'👤 SUPPLÉANT';let color=l.role==='patron'?'#e3f2fd':'#fff3cd';h+=`<tr style="background:${color}"><td class="num-col">${i++}</td><td>${l.date}</td><td><b>${badge}</b></td><td>${(l.lat||0).toFixed(5)}, ${(l.lng||0).toFixed(5)}<br><small>Précision: ${l.accuracy}m</small></td><td><a href="${l.maps}" target="_blank" style="background:#1877f2;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold">🗺️ Voir</a></td></tr>`;}document.getElementById('locList').innerHTML=h+'</table><br><button class="btn btn-red" onclick="if(confirm(\'Effacer ?\')) db.ref(\'localisations\').remove()">Effacer historique</button>';});}
let postesData={};
function loadMedicaments(){let h=`<div class="section"><b>STOCK PERMANENT</b>${isPatron?`<div style="display:flex;gap:6px;align-items:center;margin-top:6px"><span style="font-size:13px">⚠️ Alerter si stock ≤</span><input id="seuilInput" type="number" value="${seuilAlerte}" style="width:80px"><button class="btn btn-orange" style="width:auto;padding:10px 14px" onclick="changerSeuil()">Changer seuil</button></div>`:`<div style="font-size:13px;margin-top:6px">⚠️ Alerte si stock ≤ <b>${seuilAlerte}</b> (fixé par le Patron)</div>`}<div id="alerteBox"></div>${isPatron?`<input id="newMedName" placeholder="Nom nouveau médicament"><input id="newMedPrix" type="number" placeholder="Prix unitaire ex: 500"><button class="btn btn-green" onclick="addMedicament()">AUGMENTER LA LISTE</button>`:''}<div id="medTable">Chargement...</div><div id="totalStockBox"></div><div id="totalJourBox"></div><div id="bilanMoisMini"></div></div><div class="section" style="background:#e3f2fd"><b>👤 NOUVEAU PATIENT</b><input id="patientName" placeholder="Nom et Prénom du patient"><div style="display:flex;gap:6px"><select id="patientSexe" style="flex:1"><option value="">Sexe</option><option value="Homme">👨 Homme</option><option value="Femme">👩 Femme</option></select><input id="patientAge" type="number" placeholder="Âge" style="flex:1"></div><textarea id="patientPlainte" rows="2" placeholder="📝 Plainte"></textarea><textarea id="patientExamen" rows="2" placeholder="🔬 Examen Paraclinique"></textarea><input id="patientDiag" placeholder="🩺 Diagnostic"><b style="font-size:13px">💊 Traitement</b><div id="medRows"></div><button class="btn btn-blue" onclick="addMedRow()">+ AJOUTER UN AUTRE MÉDICAMENT</button><button class="btn btn-orange" onclick="saveConsultation()">✅ ENREGISTRER PATIENT + DIMINUER STOCK</button></div><div class="section"><b>📋 HISTORIQUE PAR PATIENT</b><input id="searchPatient" placeholder="Rechercher patient, diagnostic..." oninput="filterPatients()"><div id="consultTable">Chargement...</div></div>`;document.getElementById('content').innerHTML=h;loadStock();loadConsultations();addMedRow();loadBilanMini();}
function loadBilanMini(){if(!isPatron){let el=document.getElementById('bilanMoisMini');if(el) el.innerHTML='';return;} Promise.all([dbGet('consultations'),dbGet('dettes_paye')]).then(function(res){let cons=res[0]||{};let dettes=res[1]||{};let qte=0;let somme=0;for(let k in cons){let c=cons[k];if(!isThisMonth(c.date)) continue;if(c.meds)c.meds.forEach(function(m){let pr=(m.prix&&m.prix>0)?m.prix:(postesData[m.key]?.prix||0);somme+=pr*m.qte;qte+=m.qte;});}let det=0;for(let k in dettes){if(isThisMonth(dettes[k].date)) det+=parseInt(dettes[k].montant)||0;}let el=document.getElementById('bilanMoisMini');if(el) el.innerHTML=`<div class="jour-box">💊 UTILISÉS CE MOIS : ${qte} boîtes = ${somme.toLocaleString()} GNF</div><div class="jour-box">📒 DETTES CE MOIS : ${det.toLocaleString()} GNF</div><div class="jour-box2">💰 SOLDE CE MOIS : ${(somme-det).toLocaleString()} GNF</div><button class="btn btn-blue" onclick="loadBilan()">📊 VOIR BILAN COMPLET DU MOIS</button>`;});}
let seuilAlerte = 2;
try{seuilAlerte = parseInt(localStorage.getItem('seuil_alerte')) || 2;}catch(e){seuilAlerte=2;}
function changerSeuil(){let v=parseInt(document.getElementById('seuilInput').value); if(!v && v!==0) return; seuilAlerte=v; try{localStorage.setItem('seuil_alerte',v);}catch(e){} dbSet('config/seuil_alerte',v); loadStock(); alert('Seuil changé à '+v);}
dbGet('config/seuil_alerte').then(function(v){if(v){seuilAlerte=parseInt(v)||2; try{localStorage.setItem('seuil_alerte',seuilAlerte);}catch(e){}}});
function loadStock(){db.ref('postes').on('value',snap=>{postesData=snap.val()||{};if(_isTyping) return; let keys=Object.keys(postesData).sort(function(a,b){return (postesData[a].nom||'').localeCompare(postesData[b].nom||'');});
let low=[]; let zero=[];
for(let k of keys){let q=postesData[k].quantite||0; if(q===0) zero.push(postesData[k].nom||k); else if(q<=seuilAlerte) low.push((postesData[k].nom||k)+' ('+q+')');}
let alerteEl=document.getElementById('alerteBox');
if(alerteEl){
  if(zero.length || low.length){
    let txt='';
    if(zero.length) txt+='⛔ RUPTURE : '+zero.join(', ')+'<br>';
    if(low.length) txt+='⚠️ BIENTÔT FINI (≤ '+seuilAlerte+') : '+low.join(', ');
    alerteEl.innerHTML='<div class="alert-box">'+txt+'<br><small>Il faut acheter ces médicaments vite !</small></div>';
  } else {
    alerteEl.innerHTML='<div class="alert-ok">✅ Stock OK - Aucun médicament en alerte</div>';
  }
}
let t='<table><tr><th>N°</th><th>Nom</th><th>Stock</th><th>Prix unitaire</th><th>Total de prix</th>'+(isPatron?'<th>X</th>':'')+'</tr>';let grandTotal=0;let num=1;for(let k of keys){let q=postesData[k].quantite||0;let p=postesData[k].prix||0;let total=q*p;grandTotal+=total;let rowClass=q===0?'zero-row':(q<=seuilAlerte?'low-row':'');let stockTxt=q===0?'⛔ 0':(q<=seuilAlerte?'⚠️ '+q:q);t+=`<tr class="${rowClass}"><td class="num-col">${num++}</td><td>${postesData[k].nom||k} ${q===0?'⛔ RUPTURE':(q<=seuilAlerte?'⚠️':'' )}</td><td>${isPatron?`<input id="q_${k}" type="number" value="${q}" onchange="updateQ('${k}')" style="padding:4px">`:`<b style="font-size:16px">${stockTxt}</b>`}</td><td>${isPatron?`<input id="p_${k}" type="number" value="${p}" onchange="updatePrix('${k}')" style="padding:4px">`:`<b>${p.toLocaleString()} GNF</b>`}</td><td><b>${total.toLocaleString()} GNF</b></td>${isPatron?`<td><button onclick="deleteMed('${k}')">X</button></td>`:''}</tr>`;}t+='</table>';if(document.getElementById('medTable')) document.getElementById('medTable').innerHTML=t;if(document.getElementById('totalStockBox')) document.getElementById('totalStockBox').innerHTML=`<div class="total-box">💰 TOTAL STOCK : ${grandTotal.toLocaleString()} GNF</div>`;if(!_isTyping) updateAllSelects();if(document.getElementById('consultTable')) renderConsultations(allCons);});}
function getSelectHTML(){let html='<option value="">Choisir médicament</option>';let keys=Object.keys(postesData).sort(function(a,b){return (postesData[a].nom||'').localeCompare(postesData[b].nom||'');});for(let k of keys){html+=`<option value="${k}">${postesData[k].nom||k} (stock:${postesData[k].quantite||0} - prix:${postesData[k].prix||0})</option>`;}return html;}
function addMedRow(){let el=document.getElementById('medRows');if(!el)return;let div=document.createElement('div');div.className='med-row';div.innerHTML=`<select class="medSelect">${getSelectHTML()}</select><input type="number" class="medQte" placeholder="Qté" value="1" style="width:70px"><button class="btn btn-red" style="width:40px;padding:6px" onclick="this.parentElement.remove()">X</button>`;el.appendChild(div);}
function updateAllSelects(){if(_isTyping) return; let selHTML=getSelectHTML();document.querySelectorAll('.medSelect').forEach(sel=>{let val=sel.value;if(document.activeElement===sel) return; sel.innerHTML=selHTML;sel.value=val;});}
function addMedicament(){if(!isPatron)return alert('Seul le Patron');let nom=document.getElementById('newMedName').value.trim();let prix=parseInt(document.getElementById('newMedPrix').value)||0;if(!nom)return;let key=nom.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now();db.ref('postes/'+key).set({nom:nom,quantite:0,prix:prix}).then(()=>{document.getElementById('newMedName').value='';document.getElementById('newMedPrix').value='';});}
function updateQ(k){if(!isPatron)return alert('Seul le Patron');let q=document.getElementById('q_'+k).value;db.ref('postes/'+k+'/quantite').set(parseInt(q)||0);}
function updatePrix(k){if(!isPatron)return alert('Seul le Patron');let p=document.getElementById('p_'+k).value;db.ref('postes/'+k+'/prix').set(parseInt(p)||0);}
function deleteMed(k){if(confirm('Supprimer?')) db.ref('postes/'+k).remove();}
function saveConsultation(){let patient=document.getElementById('patientName').value.trim();if(!patient)return alert('Mets nom du patient');let sexe=document.getElementById('patientSexe').value||'';let age=document.getElementById('patientAge').value||'';let plainte=document.getElementById('patientPlainte').value||'';let examen=document.getElementById('patientExamen').value||'';let diagnostic=document.getElementById('patientDiag').value||'';let rows=document.querySelectorAll('.med-row');let meds=[];for(let r of rows){let key=r.querySelector('.medSelect').value;let qte=parseInt(r.querySelector('.medQte').value)||0;if(key && qte>0){meds.push({key:key,nom:postesData[key]?.nom||key,qte:qte,prix:postesData[key]?.prix||0});}}if(meds.length===0)return alert('Ajoute au moins 1 médicament');meds.forEach(m=>{let cur=postesData[m.key]?.quantite||0;db.ref('postes/'+m.key+'/quantite').set(cur-m.qte);});db.ref('consultations').push({patient:patient,sexe:sexe,age:age,plainte:plainte,examen:examen,diagnostic:diagnostic,meds:meds,date:new Date().toLocaleString(),role:role});document.getElementById('patientName').value='';document.getElementById('patientSexe').value='';document.getElementById('patientAge').value='';document.getElementById('patientPlainte').value='';document.getElementById('patientExamen').value='';document.getElementById('patientDiag').value='';document.getElementById('medRows').innerHTML='';addMedRow();addMedRow();alert('✅ '+patient+' enregistré');}
let allCons={};
function loadConsultations(){db.ref('consultations').on('value',snap=>{allCons=snap.val()||{};if(!_isTyping) renderConsultations(allCons);});}
function renderConsultations(data){if(_isTyping && document.activeElement && document.activeElement.id==='searchPatient') return; let h='<table><tr><th>N°</th><th>Date</th><th>Patient</th><th>📝 Plainte</th><th>🔬 Examen</th><th>🩺 Diagnostic</th><th>💊 Traitement</th><th>Somme</th>'+(isPatron?'<th>X</th>':'')+'</tr>';let keys=Object.keys(data).reverse();let totalJour=0;let qteJour=0;let aujourdhui=new Date().toLocaleDateString();let num=1;for(let k of keys){let c=data[k];let medsTxt='';let sommeTotale=0;if(c.meds){c.meds.forEach(m=>{let prixReel=(m.prix&&m.prix>0)?m.prix:(postesData[m.key]?.prix||0);let pt=prixReel*m.qte;sommeTotale+=pt;medsTxt+=`<div>• ${m.nom} : <b>${m.qte}</b> x ${prixReel.toLocaleString()} = ${pt.toLocaleString()} GNF</div>`;});}else{medsTxt=c.med||'';}if(c.date && c.date.startsWith(aujourdhui)){totalJour+=sommeTotale;if(c.meds){c.meds.forEach(m=>{qteJour+=m.qte;});}}h+=`<tr><td class="num-col">${num++}</td><td>${c.date}</td><td><b>${c.patient}</b><br><small>${c.sexe||''} ${c.age?c.age+' ans':''}</small></td><td>${c.plainte||'-'}</td><td>${c.examen||'-'}</td><td><b>${c.diagnostic||'-'}</b></td><td>${medsTxt}</td><td><div class="somme-box">${sommeTotale.toLocaleString()} GNF</div></td>${isPatron?`<td><button onclick="db.ref('consultations/${k}').remove()">X</button></td>`:''}</tr>`;}h+='</table>';if(document.getElementById('consultTable')) document.getElementById('consultTable').innerHTML=keys.length?h:'Aucun patient encore';if(document.getElementById('totalJourBox')){document.getElementById('totalJourBox').innerHTML=`<div class="jour-box">💊 TOTAL VENDUS AUJOURD'HUI : ${qteJour}</div><div class="jour-box2">💰 SOMME JOURNALIÈRE : ${totalJour.toLocaleString()} GNF</div>`;}}
function filterPatients(){let q=document.getElementById('searchPatient').value.toLowerCase();let filtered={};for(let k in allCons){let txt=((allCons[k].patient||'')+' '+(allCons[k].diagnostic||'')+' '+(allCons[k].plainte||'')).toLowerCase();if(txt.includes(q)) filtered[k]=allCons[k];}renderConsultations(filtered);}
function loadDettes(){document.getElementById('content').innerHTML='<h3>📒 Dettes Payé</h3><input id="dNom" placeholder="Nom"><input id="dMont" type="number" placeholder="Montant"><button class="btn btn-blue" onclick="saveDette()">Enregistrer</button><div id="dTotalMois"></div><div id="dList"></div>';db.ref('dettes_paye').on('value',s=>{let d=s.val()||{},h='<table><tr><th>N°</th><th>Client</th><th>Montant</th><th>Date</th>'+(isPatron?'<th>X</th>':'')+'</tr>';let totMois=0;let i=1;for(let k in d){if(isThisMonth(d[k].date)) totMois+=parseInt(d[k].montant)||0;h+=`<tr><td class="num-col">${i++}</td><td>${d[k].nom}</td><td>${d[k].montant}</td><td>${d[k].date}</td>${isPatron?`<td><button onclick="deleteDette('${k}')" style="background:#e74c3c;color:white;border:none;padding:6px 10px;border-radius:6px;font-weight:bold">X</button></td>`:''}</tr>`;}document.getElementById('dTotalMois').innerHTML=`<div class="jour-box">📒 DETTES CE MOIS : ${totMois.toLocaleString()} GNF</div>`;document.getElementById('dList').innerHTML=h+'</table>';});}
function saveDette(){let n=document.getElementById('dNom').value,m=document.getElementById('dMont').value;if(!n||!m)return;db.ref('dettes_paye').push({nom:n,montant:m,date:new Date().toLocaleString()});}
function deleteDette(k){if(confirm('Supprimer ?')){db.ref('dettes_paye/'+k).remove();}}
loadMedicaments();
</script>
