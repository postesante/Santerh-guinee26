 <!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SanteRH V6.1 Fix</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f5f7fb;padding-bottom:80px}.header{background:white;padding:12px;display:flex;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}.logo{font-weight:800;color:#16a34a}.btn{padding:10px;border:none;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin-top:6px}.btn-green{background:#16a34a;color:white}.btn-yellow{background:#f59e0b;color:white}.btn-gray{background:#eee}.card{background:white;border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;margin:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}.icon{width:48px;height:48px;border-radius:12px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:white}.bg-cyan{background:#06b6d4}.bg-amber{background:#f59e0b}.bg-green{background:#22c55e}.bg-yellow{background:#eab308}.bg-blue{background:#3b82f6}.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;padding:10px;overflow:auto}.modal-box{background:white;border-radius:16px;padding:14px;max-width:420px;margin:20px auto}.list-item{background:#f9fafb;border-left:4px solid #16a34a;padding:8px;margin:6px 0;border-radius:8px;font-size:12px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 16px;border-radius:20px;display:none;z-index:100}input,select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin:5px 0}.prime-box{background:#16a34a;color:white;padding:12px;border-radius:12px;text-align:center;margin:8px 0}</style></head><body>
<div class="header"><div class="logo">🏥 SanteRH Filanidialakoro V6.1</div><button onclick="location.reload()" style="background:#fee2e2;color:#dc2626;border:none;padding:6px 12px;border-radius:20px">Sortir</button></div>
<div style="padding:10px"><b>V6.1 Debloquee - Tout fonctionne</b></div>
<div class="grid">
<div class="card" onclick="openObs()"><div class="icon bg-cyan">🩺</div><b>Observation</b></div>
<div class="card" onclick="openMed()"><div class="icon bg-amber">💊</div><b>Medicaments</b></div>
<div class="card" onclick="openMerit()"><div class="icon bg-yellow">🏅</div><b>Merite PRIMES</b></div>
<div class="card" onclick="openGen('Personnel')"><div class="icon bg-blue">👥</div><b>Personnel</b></div>
</div>
<div id="toast" class="toast"></div>

<div id="modalObs" class="modal"><div class="modal-box"><h3>🩺 Observation</h3><input id="obsNom" placeholder="Nom patient"><input id="obsTxt" placeholder="Symptomes"><button class="btn btn-green" onclick="saveObs()">Enregistrer</button><button class="btn btn-gray" onclick="closeM('modalObs')">Fermer</button><div id="obsList"></div></div></div>
<div id="modalMed" class="modal"><div class="modal-box"><h3>💊 Medicaments</h3><select id="medName"><option>Paracetamol</option><option>Amoxicilline</option><option>ORS</option></select><input id="medQte" type="number" placeholder="Qte"><select id="medType"><option>Entree stock</option><option>Sortie - Patient</option></select><button class="btn btn-green" onclick="saveMed()">Enregistrer</button><button class="btn btn-gray" onclick="closeM('modalMed')">Fermer</button><div id="medList"></div><div id="stockDisplay"></div></div></div>

<div id="modalMerit" class="modal"><div class="modal-box"><h3>🏅 Prime Stagiaires</h3>
<div style="background:#f9fafb;padding:8px;border-radius:8px;margin:6px 0"><label>Prime base GNF</label><input id="primeBase" type="number" value="300000"><label>Penalite retard</label><input id="penRetard" type="number" value="5000"><label>Penalite absence</label><input id="penAbs" type="number" value="20000"></div>
<label>Nom stagiaire</label><input id="stagiaireNom" placeholder="Ex: Fatoumata"><button class="btn btn-yellow" onclick="addStag()">Ajouter stagiaire</button><div id="stagiaireList"></div><hr style="margin:10px 0">
<label>Stagiaire</label><select id="pointStag"></select><label>Date</label><input id="pointDate" type="date"><label>Arrivee</label><input id="pointArr" type="time" value="08:00"><label>Depart</label><input id="pointDep" type="time" value="17:00"><button class="btn btn-green" onclick="savePoint()">Enregistrer pointage</button>
<div style="margin-top:10px"><label>Mois</label><input id="moisCalc" type="month"><button class="btn btn-yellow" onclick="calcPrimes()">CALCULER PRIMES</button><div id="primeResult"></div><div id="pointList"></div></div>
<button class="btn btn-gray" onclick="closeM('modalMerit')">Fermer</button></div></div>

<div id="modalGen" class="modal"><div class="modal-box"><h3 id="genTitle">Module</h3><input id="genInput1" placeholder="Titre"><input id="genInput2" placeholder="Details"><button class="btn btn-green" onclick="saveGen()">Enregistrer</button><button class="btn btn-gray" onclick="closeM('modalGen')">Fermer</button><div id="genList"></div></div></div>

<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},3000);}
function closeM(id){document.getElementById(id).style.display='none';}
function openObs(){renderObs();document.getElementById('modalObs').style.display='block';}
function openMed(){renderMed();document.getElementById('modalMed').style.display='block';}
function openMerit(){loadStag();renderPoints();document.getElementById('modalMerit').style.display='block';document.getElementById('pointDate').valueAsDate=new Date();document.getElementById('moisCalc').value=new Date().toISOString().slice(0,7);}
function openGen(t){currentGen=t;document.getElementById('genTitle').textContent=t;renderGen();document.getElementById('modalGen').style.display='block';}
var currentGen='';
function getObs(){try{return JSON.parse(localStorage.getItem('filani_obs')||'[]')}catch(e){return[]}}
function saveObs(){var n=document.getElementById('obsNom').value.trim();if(!n){toast('Nom requis');return;}var a=getObs();a.unshift({id:Date.now(),nom:n,txt:document.getElementById('obsTxt').value,date:new Date().toLocaleString()});localStorage.setItem('filani_obs',JSON.stringify(a));toast('Observation OK');renderObs();}
function renderObs(){var a=getObs();var h='';a.forEach(function(o){h+='<div class="list-item"><b>'+o.nom+'</b> '+o.date+'<br>'+(o.txt||'')+'</div>';});document.getElementById('obsList').innerHTML=h;}
function getMed(){try{return JSON.parse(localStorage.getItem('filani_med')||'[]')}catch(e){return[]}}
function saveMed(){var q=parseInt(document.getElementById('medQte').value);if(!q){toast('Qte');return;}var a=getMed();a.unshift({id:Date.now(),med:document.getElementById('medName').value,qte:q,type:document.getElementById('medType').value,date:new Date().toLocaleString()});localStorage.setItem('filani_med',JSON.stringify(a));toast('Medicament OK');renderMed();}
function renderMed(){var a=getMed();var h='';a.forEach(function(m){h+='<div class="list-item"><b>'+m.qte+' '+m.med+'</b> '+m.type+' '+m.date+'</div>';});document.getElementById('medList').innerHTML=h;var s={};a.forEach(function(m){if(!s[m.med])s[m.med]=0;if(m.type.includes('Entree'))s[m.med]+=m.qte;else s[m.med]-=m.qte;});var base={Paracetamol:120,Amoxicilline:45,ORS:200};for(var k in base){if(!s[k])s[k]=base[k];else s[k]+=base[k];}var html='';for(var k in s){html+=k+':'+s[k]+' ';}document.getElementById('stockDisplay').innerHTML='<b>Stock:</b> '+html;}

function getStag(){try{return JSON.parse(localStorage.getItem('filani_stagiaires')||'[]')}catch(e){return[]}}
function addStag(){var n=document.getElementById('stagiaireNom').value.trim();if(!n){toast('Nom stagiaire');return;}var a=getStag();a.push(n);localStorage.setItem('filani_stagiaires',JSON.stringify(a));document.getElementById('stagiaireNom').value='';loadStag();toast('Stagiaire ajoute');}
function loadStag(){var a=getStag();var sel=document.getElementById('pointStag');sel.innerHTML='';a.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});var html='';a.forEach(function(s,i){html+='<span style="display:inline-block;margin:2px;padding:4px 8px;background:#fef3c7;border-radius:8px;font-size:11px">'+s+' <b style="color:red;cursor:pointer" onclick="delStag('+i+')">x</b></span> ';});document.getElementById('stagiaireList').innerHTML=html;}
function delStag(i){var a=getStag();a.splice(i,1);localStorage.setItem('filani_stagiaires',JSON.stringify(a));loadStag();}
function getPoints(){try{return JSON.parse(localStorage.getItem('filani_pointages')||'[]')}catch(e){return[]}}
function savePoint(){var stag=document.getElementById('pointStag').value;var date=document.getElementById('pointDate').value;var arr=document.getElementById('pointArr').value;var dep=document.getElementById('pointDep').value;if(!stag||!date||!arr){toast('Remplir');return;}var retard=0;var hN=8*60;var hA=parseInt(arr.split(':')[0])*60+parseInt(arr.split(':')[1]);if(hA>hN+15)retard=hA-(hN+15);var a=getPoints();a.unshift({id:Date.now(),stag:stag,date:date,arr:arr,dep:dep,retard:retard});localStorage.setItem('filani_pointages',JSON.stringify(a));toast('Pointage OK retard:'+retard);renderPoints();}
function renderPoints(){var a=getPoints();var html='';a.forEach(function(p){html+='<div class="list-item"><b>'+p.stag+'</b> '+p.date+' Arr:'+p.arr+' Dep:'+p.dep+' Retard:'+p.retard+'min <b style="color:red;cursor:pointer" onclick="delPoint('+p.id+')">x</b></div>';});document.getElementById('pointList').innerHTML=html;}
function delPoint(id){var a=getPoints().filter(function(p){return p.id!=id});localStorage.setItem('filani_pointages',JSON.stringify(a));renderPoints();}
function calcPrimes(){var base=parseInt(document.getElementById('primeBase').value)||300000;var penR=parseInt(document.getElementById('penRetard').value)||5000;var penA=parseInt(document.getElementById('penAbs').value)||20000;var mois=document.getElementById('moisCalc').value;if(!mois){toast('Choisir mois');return;}var stagiaires=getStag();var points=getPoints().filter(function(p){return p.date.startsWith(mois);});var html='';stagiaires.forEach(function(s){var pts=points.filter(function(p){return p.stag==s;});var nbPres=pts.length;var nbRet=pts.filter(function(p){return p.retard>0;}).length;var nbAbs=26-nbPres;if(nbAbs<0)nbAbs=0;var prime=base-(nbRet*penR)-(nbAbs*penA);if(prime<0)prime=0;html+='<div class="prime-box"><div>'+s+' - '+mois+'</div><div style="font-size:11px">Presents:'+nbPres+'/26 Retards:'+nbRet+' Abs:'+nbAbs+'</div><div style="font-size:20px;font-weight:800">'+prime.toLocaleString()+' GNF</div></div>';});document.getElementById('primeResult').innerHTML=html;toast('Primes calculees');}
function getGen(){try{return JSON.parse(localStorage.getItem('filani_gen_'+currentGen)||'[]')}catch(e){return[]}}
function saveGen(){var v1=document.getElementById('genInput1').value.trim();if(!v1){toast('Requis');return;}var a=getGen();a.unshift({id:Date.now(),t1:v1,t2:document.getElementById('genInput2').value,date:new Date().toLocaleString()});localStorage.setItem('filani_gen_'+currentGen,JSON.stringify(a));toast('Enregistre');renderGen();}
function renderGen(){var a=getGen();var h='';a.forEach(function(g){h+='<div class="list-item"><b>'+g.t1+'</b> '+g.date+'<br>'+(g.t2||'')+'</div>';});document.getElementById('genList').innerHTML=h;}
</script></body></html>
