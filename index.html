<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poste Filanidialakoro</title>
<style>
body{font-family:Arial;background:#f2f2f2;margin:0;padding:10px}
h1{text-align:center;color:#0d6e3e;font-size:22px}
.menu{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.menu button{padding:10px 12px;border:none;border-radius:10px;background:#0d6e3e;color:white;font-weight:bold}
.card{background:white;padding:14px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 6px #ccc}
input,select{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
.btn{background:#0d6e3e;color:white;padding:12px;border:none;border-radius:10px;width:100%;font-size:17px;font-weight:bold}
.btn2{background:#ff9800}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left}
.big{font-size:24px;font-weight:bold;text-align:center}
.vert{color:green}.hidden{display:none}
</style></head>
<body>
<h1>🏥 Poste de Filanidialakoro</h1>
<div class="menu">
<button onclick="show('vente')">💊 Vente</button>
<button onclick="show('stock')">📦 Stock</button>
<button onclick="show('caisse')">💰 Caisse</button>
<button onclick="show('carnet')">👩‍👧 Carnet</button>
<button onclick="show('achat')">🛒 Achat</button>
</div>

<div id="vente" class="card">
<h2>💊 Traiter un Patient</h2>
<label>Nom du patient :</label><input id="nom" placeholder="Ex: Mamadou Diallo">
<label>Choisir médicament :</label><select id="medSelect"></select>
<label>Quantité :</label><input type="number" id="qte" value="1">
<button class="btn" onclick="vendre()">✅ Vendre / Traiter</button>
<div id="msgVente" style="margin-top:8px;font-weight:bold"></div>
</div>

<div id="stock" class="card hidden">
<h2>📦 Stock</h2>
<label>Nom médicament :</label><input id="nNom" placeholder="Ex: Paracétamol">
<label>Prix Achat :</label><input type="number" id="nAchat" placeholder="Ex: 500">
<label>Prix Vente :</label><input type="number" id="nVente" placeholder="Ex: 1000">
<label>Quantité :</label><input type="number" id="nQte" placeholder="Ex: 20">
<button class="btn btn2" onclick="ajoutMed()">➕ Ajouter au Stock</button>
<div id="listeStock" style="margin-top:10px"></div>
</div>

<div id="caisse" class="card hidden">
<h2>💰 Caisse du Jour</h2>
<div>Ventes aujourd'hui :</div><div class="big" id="totalVente">0 GNF</div>
<div>Dettes / Dépenses :</div><input type="number" id="dette" placeholder="Ex: 65000" oninput="calculCaisse()">
<div>Caisse ce soir :</div><div class="big vert" id="caisseSoir">0 GNF</div>
<div>Bénéfice aujourd'hui :</div><div class="big" id="benefice">0 GNF</div>
<button class="btn" onclick="resetJour()">🌅 Nouveau Jour</button>
</div>

<div id="carnet" class="card hidden">
<h2>👩‍👧 Carnet - Femmes & Enfants</h2>
<label>Nom :</label><input id="cNom" placeholder="Nom">
<label>Type :</label><select id="cType"><option>Femme enceinte</option><option>Enfant</option></select>
<label>Note :</label><input id="cNote" placeholder="Ex: Rendez-vous 20 Nov, vaccin">
<button class="btn" onclick="ajoutCarnet()">➕ Ajouter</button>
<div id="listeCarnet" style="margin-top:10px"></div>
</div>

<div id="achat" class="card hidden">
<h2>🛒 Liste d'Achat - Ce qu'il faut acheter</h2>
<div id="listeAchat"></div>
</div>

<script>
let stock = JSON.parse(localStorage.getItem('stock')||'[]');
let ventes = JSON.parse(localStorage.getItem('ventes')||'[]');
let carnet = JSON.parse(localStorage.getItem('carnet')||'[]');
if(stock.length==0){
 stock=[
  {nom:'Paracétamol',achat:500,vente:1000,qte:20},
  {nom:'Amoxicilline',achat:800,vente:1500,qte:15},
  {nom:'Artemether (Palu)',achat:1500,vente:3000,qte:10},
  {nom:'Fer + Acide Folique',achat:1000,vente:2000,qte:12},
  {nom:'ORS',achat:300,vente:700,qte:25},
  {nom:'Vitamine A',achat:400,vente:800,qte:18}
 ]; save();
}
function save(){localStorage.setItem('stock',JSON.stringify(stock));localStorage.setItem('ventes',JSON.stringify(ventes));localStorage.setItem('carnet',JSON.stringify(carnet));}
function show(id){['vente','stock','caisse','carnet','achat'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');afficher();}
function afficher(){
 let s=document.getElementById('medSelect');s.innerHTML='';stock.forEach((m,i)=>{s.innerHTML+=`<option value="${i}">${m.nom} - ${m.vente} GNF (Reste: ${m.qte})</option>`});
 let ls=document.getElementById('listeStock');ls.innerHTML='<table><tr><th>Médicament</th><th>Achat</th><th>Vente</th><th>Qté</th></tr>'+stock.map(m=>`<tr><td>${m.nom}</td><td>${m.achat}</td><td>${m.vente}</td><td>${m.qte}</td></tr>`).join('')+'</table>';
 let lc=document.getElementById('listeCarnet');lc.innerHTML=carnet.map(c=>`• <b>${c.nom}</b> (${c.type}) - ${c.note}<br>`).join('')||'Aucun pour le moment';
 let la=document.getElementById('listeAchat');let bas=stock.filter(m=>m.qte<=5);la.innerHTML=bas.length?bas.map(m=>`🔴 <b>${m.nom}</b> - Il reste ${m.qte}, il faut acheter !<br>`).join(''):'✅ Tout va bien, rien à acheter';
 calculCaisse();
}
function ajoutMed(){let n=document.getElementById('nNom').value,a=+document.getElementById('nAchat').value,v=+document.getElementById('nVente').value,q=+document.getElementById('nQte').value;if(!n)return alert('Mets le nom');stock.push({nom:n,achat:a,vente:v,qte:q});save();afficher();alert('Ajouté !');}
function vendre(){let i=+document.getElementById('medSelect').value,q=+document.getElementById('qte').value,nom=document.getElementById('nom').value||'Patient';if(stock[i].qte<q)return alert('Pas assez en stock !');stock[i].qte-=q;let total=q*stock[i].vente;let benef=q*(stock[i].vente-stock[i].achat);ventes.push({total,benef});save();afficher();document.getElementById('msgVente').innerHTML=`✅ ${nom} traité : ${stock[i].nom} x${q} = ${total} GNF`;}
function calculCaisse(){let tot=ventes.reduce((a,b)=>a+b.total,0);let ben=ventes.reduce((a,b)=>a+b.benef,0);let dette=+document.getElementById('dette').value||0;document.getElementById('totalVente').innerText=tot.toLocaleString()+' GNF';document.getElementById('benefice').innerText=ben.toLocaleString()+' GNF';document.getElementById('caisseSoir').innerText=(tot-dette).toLocaleString()+' GNF';}
function resetJour(){if(confirm('Nouveau jour ? La caisse va repartir à zéro.')){ventes=[];save();afficher();}}
function ajoutCarnet(){let n=document.getElementById('cNom').value,t=document.getElementById('cType').value,nt=document.getElementById('cNote').value;if(!n)return alert('Mets le nom');carnet.push({nom:n,type:t,note:nt});save();afficher();}
afficher();
</script></body></html>
