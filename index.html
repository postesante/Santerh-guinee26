<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#1877f2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filanidialakoro</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#1877f2;color:white;padding:12px;text-align:center;border-radius:10px;font-weight:bold}
.header img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid white;display:block;margin:0 auto 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:white;padding:16px;border-radius:10px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1);cursor:pointer;font-weight:bold}
#content{background:white;margin-top:12px;padding:12px;border-radius:10px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.btn{border:none;padding:11px;border-radius:8px;width:100%;font-weight:bold;color:white;cursor:pointer;margin-top:5px}
.btn-blue{background:#1877f2} .btn-green{background:#42b72a} .btn-orange{background:#ff9800} .btn-red{background:#e74c3c}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px} th,td{border:1px solid #ddd;padding:6px}
.section{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #e0e0e0}
.med-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.med-row select{flex:2} .med-row input{flex:1}
.total-box{background:#e3f2fd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px}
.somme-box{background:#e8f5e9;padding:6px;border-radius:6px;text-align:center;font-weight:bold;color:#2e7d32}
.jour-box{background:#fff3cd;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #ffca28}
.jour-box2{background:#d4edda;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #28a745}
.pres-menu{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.pres-menu button{white-space:nowrap;padding:9px 12px;border:1px solid #ddd;border-radius:20px;background:#f8f9fa;font-weight:bold;cursor:pointer}
.pres-menu button.active{background:#1877f2;color:#fff;border-color:#1877f2}
.pres-page{display:none}.pres-page.active{display:block}
.badge-pres{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold;color:#fff}
.badge-green{background:#42b72a}.badge-orange{background:#ff9800}.badge-red{background:#e74c3c}
.pres-info{background:#e8f5e9;padding:10px;border-radius:8px;text-align:center;font-weight:bold;font-size:13px;margin-bottom:8px}
.dette-menu{display:flex;gap:6px;margin:8px 0}
.dette-menu button{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;background:#f8f9fa;font-weight:bold;cursor:pointer}
.dette-menu button.active{background:#1877f2;color:#fff}
.dette-page{display:none}.dette-page.active{display:block}
.reste-box{background:#ffebee;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #e74c3c;color:#c62828}
.stock-alerte-box{display:flex;gap:6px;margin:8px 0}
.stock-alerte-box div{flex:1;padding:10px;border-radius:8px;text-align:center;font-weight:bold;font-size:13px}
.badge-stock{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold;color:#fff;white-space:nowrap}
.caisse-menu{display:flex;gap:6px;margin:8px 0}
.caisse-menu button{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;background:#f8f9fa;font-weight:bold;cursor:pointer}
.caisse-menu button.active{background:#1877f2;color:#fff}
.caisse-page{display:none}.caisse-page.active{display:block}
.caisse-reste{background:#e8f5e9;padding:12px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px;border:1px solid #42b72a;font-size:16px}
.expire-box{display:flex;gap:6px;margin:8px 0}
.expire-box div{flex:1;padding:10px;border-radius:8px;text-align:center;font-weight:bold;font-size:13px}
.rapport-card{background:#f8f9fa;padding:12px;border-radius:10px;margin-top:10px;border:1px solid #e0e0e0}
.rapport-card h4{margin:0 0 8px 0}
.rapport-big{background:#1877f2;color:white;padding:14px;border-radius:10px;text-align:center;font-weight:bold;font-size:16px}
.carnet-card{background:#fff;padding:12px;border-radius:10px;margin-top:10px;border:2px solid #1877f2}
.carnet-fiche{background:#e3f2fd;padding:12px;border-radius:10px;margin-top:10px;border:1px solid #1877f2}
</style>
</head>
<body>
<div class="header" id="header"></div>
<div class="grid" id="grid"></div>
<div id="content"></div>
<div id="gpsStatus" style="text-align:center;font-size:12px;color:#666;margin-top:8px"></div>
<script>
const firebaseConfig = {
  apiKey: "COLLE TA VRAIE CLE ICI - REGARDE HISTORY",
  authDomain: "filanidialakoro.firebaseapp.com",
  databaseURL: "https://filanidialakoro-default-rtdb.firebaseio.com",
  projectId: "filanidialakoro",
  storageBucket: "filanidialakoro.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let role = new URLSearchParams(location.search).get('role');
if(role){ localStorage.setItem('mon_role', role); }
else { role = localStorage.getItem('mon_role') || 'patron'; }
const isPatron = role==='patron';
document.getElementById('header').innerHTML = isPatron ? '<img src="icon-512.png" onerror="this.style.display=\'none\'"><div>👑 PATRON - Accès complet</div><div style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</div>' : '👤 SUPPLÉANT - 2 modules';
let gridHTML=`<div class="card" onclick="openModule('medicaments')">💊 Médicaments</div><div class="card" onclick="openModule('dettes')">📒 Dettes Payé</div>`;
if(isPatron){ gridHTML+=`<div class="card" onclick="openModule('caisse')">💰 Caisse Journalière</div><div class="card" onclick="openModule('rapport')">📊 Rapport du Mois</div><div class="card" onclick="openModule('carnet')">📋 Carnet Patient</div><div class="card" onclick="openModule('suivi')">📈 SUIVI LIVE</div><div class="card" onclick="openModule('primes')">🏆 Primes</div><div class="card" onclick="openModule('observation')">📝 Observation</div><div class="card" onclick="openModule('presence')">✅ Présence 600k</div><div class="card" onclick="openModule('localisation')">📍 Localisation GPS</div><div class="card" onclick="openModule('achats')">🛒 Achats / Fournisseur</div>`; }
document.getElementById('grid').innerHTML=gridHTML;
function openModule(n){ if(n==='medicaments') loadMedicaments(); if(n==='dettes') loadDettes(); if(n==='caisse') loadCaisse(); if(n==='rapport') loadRapport(); if(n==='carnet') loadCarnet(); if(n==='suivi') loadSuivi(); if(n==='primes') loadPrimes(); if(n==='observation') loadObservation(); if(n==='presence') loadPresence(); if(n==='localisation') loadLocalisation(); if(n==='achats') loadAchats(); }
function trackLocation(){
  if(!navigator.geolocation){ document.getElementById('gpsStatus').innerHTML='GPS non supporté'; return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    let lat = pos.coords.latitude; let lng = pos.coords.longitude; let acc = Math.round(pos.coords.accuracy);
    document.getElementById('gpsStatus').innerHTML = '📍 GPS activé - Position enregistrée';
    db.ref('localisations').push({ role: role, lat: lat, lng: lng, accuracy: acc, date: new Date().toLocaleString(), maps: 'https://www.google.com/maps?q='+lat+','+lng, device: navigator.userAgent.substring(0,80) });
  }, function(err){ document.getElementById('gpsStatus').innerHTML = '⚠️ GPS refusé - Autorise la localisation pour être suivi'; }, {enableHighAccuracy:true, timeout:10000});
}
trackLocation();
setInterval(trackLocation, 5*60*1000);
function loadLocalisation(){
  document.getElementById('content').innerHTML='<h3>📍 Localisation GPS - Patron seulement</h3><div id="locList">Chargement...</div>';
  db.ref('localisations').limitToLast(100).on('value', snap=>{
    let d=snap.val()||{}; let h='<table><tr><th>Date</th><th>Qui</th><th>Position</th><th>Voir</th></tr>'; let keys=Object.keys(d).reverse();
    for(let k of keys){ let l=d[k]; let badge = l.role==='patron' ? '👑 PATRON' : '👤 SUPPLÉANT'; let color = l.role==='patron' ? '#e3f2fd' : '#fff3cd'; h+=`<tr style="background:${color}"><td>${l.date}</td><td><b>${badge}</b></td><td>${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}<br><small>Précision: ${l.accuracy}m</small></td><td><a href="${l.maps}" target="_blank" style="background:#1877f2;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold">🗺️ Voir</a></td></tr>`; }
    document.getElementById('locList').innerHTML = h+'</table><br><button class="btn btn-red" onclick="if(confirm(\'Effacer ?\')) db.ref(\'localisations\').remove()">Effacer historique</button>';
  });
}
let postesData={};
function loadMedicaments(){
let h=`
<div class="section">
<b>STOCK PERMANENT</b>
<div id="stockAlerteResume"></div>
<div id="expireResume"></div>
<div style="display:flex;gap:6px;margin-top:6px">
<button class="btn btn-blue" style="flex:1" onclick="filterStock('all')">TOUT</button>
<button class="btn btn-red" style="flex:1" onclick="filterStock('rupture')">🔴 RUPTURE</button>
<button class="btn btn-orange" style="flex:1" onclick="filterStock('alerte')">🟠 ALERTE</button>
<button class="btn btn-green" style="flex:1" onclick="filterStock('ok')">🟢 OK</button>
</div>
<div style="display:flex;gap:6px;margin-top:6px">
<button class="btn btn-red" style="flex:1" onclick="filterStock('expire')">🔴 EXPIRÉ</button>
<button class="btn btn-orange" style="flex:1" onclick="filterStock('bientot')">🟠 EXPIRE BIENTÔT (60j)</button>
<button class="btn btn-green" style="flex:1" onclick="filterStock('bon')">🟢 BON</button>
</div>
${isPatron?`<input id="newMedName" placeholder="Nom nouveau médicament"><input id="newMedPrix" type="number" placeholder="Prix unitaire ex: 500"><input id="newMedSeuil" type="number" placeholder="Seuil Alerte pour ce produit ex: 10 (toi tu choisis)"><input id="newMedExpire" type="date" placeholder="Date d'expiration"><button class="btn btn-green" onclick="addMedicament()">AUGMENTER LA LISTE</button>`:''}
<div id="medTable">Chargement...</div>
<div id="totalStockBox"></div>
<div id="totalJourBox"></div>
</div>
<div class="section" style="background:#e3f2fd">
<b>👤 NOUVEAU PATIENT - Dossier Complet</b>
<input id="patientName" placeholder="Nom et Prénom du patient">
<div style="display:flex;gap:6px">
<select id="patientSexe" style="flex:1"><option value="">Sexe</option><option value="Homme">👨 Homme</option><option value="Femme">👩 Femme</option></select>
<input id="patientAge" type="number" placeholder="Âge" style="flex:1">
<select id="patientAgeUnite" style="flex:1"><option value="Ans">Année(s)</option><option value="Mois">Mois</option><option value="Jours">Jour(s)</option></select>
</div>
<div style="display:flex;gap:6px">
<input id="patientVillage" placeholder="📍 Village / Provenance - ex: Filanidialakoro">
<input id="patientTel" type="tel" placeholder="📞 Téléphone - ex: 622 00 00 00">
</div>
<textarea id="patientPlainte" rows="2" placeholder="📝 Plainte - ex: Fièvre, maux de tête depuis 3 jours..."></textarea>
<textarea id="patientExamen" rows="2" placeholder="🔬 Examen Paraclinique - ex: TDR Palu, Glycémie, Tension..."></textarea>
<input id="patientDiag" placeholder="🩺 Diagnostic - ex: Paludisme simple">
<b style="font-size:13px">💊 Traitement / Médicaments</b>
<div id="medRows"></div>
<button class="btn btn-blue" onclick="addMedRow()">+ AJOUTER UN AUTRE MÉDICAMENT</button>
<button class="btn btn-orange" onclick="saveConsultation()">✅ ENREGISTRER PATIENT + DIMINUER STOCK</button>
</div>
<div class="section">
<b>📋 HISTORIQUE PAR PATIENT</b>
<input id="searchPatient" placeholder="Rechercher patient, village, diagnostic, téléphone..." oninput="filterPatients()">
<div id="consultTable">Chargement...</div>
</div>`;
document.getElementById('content').innerHTML=h;
loadStock(); loadConsultations(); addMedRow();
}
let stockFilter='all';
function filterStock(f){ stockFilter=f; loadStock(); }
function getExpireStat(dateStr){
  if(!dateStr) return {etat:'sans', label:'—', bg:''};
  let today = new Date(); today.setHours(0,0,0,0);
  let exp = new Date(dateStr); exp.setHours(0,0,0,0);
  let diff = Math.ceil((exp - today) / (1000*60*60*24));
  if(diff < 0) return {etat:'expire', label:'🔴 EXPIRÉ', bg:'#ffebee', diff:diff};
  if(diff <= 60) return {etat:'bientot', label:'🟠 EXPIRE BIENTÔT<br><small>'+diff+' jours</small>', bg:'#fff3e0', diff:diff};
  return {etat:'bon', label:'🟢 BON<br><small>'+diff+' jours</small>', bg:'', diff:diff};
}
function loadStock(){
 db.ref('postes').on('value',snap=>{
  postesData=snap.val()||{};
  let t='<table><tr><th>N°</th><th>Nom</th><th>Stock</th><th>Seuil Alerte<br><small>Toi tu modifies</small></th><th>État Stock</th><th>Date Expiration<br><small>Toi tu mets</small></th><th>État Expiration<br><small>60 jours</small></th><th>Prix unitaire</th><th>Total de prix</th>'+(isPatron?'<th>X</th>':'')+'</tr>';
  let grandTotal=0; let nbRupture=0, nbAlerte=0, nbOk=0; let nbExpire=0, nbBientot=0, nbBon=0;
  let numeroOrdre = 0;
  for(let k in postesData){
    let q = postesData[k].quantite||0; let p = postesData[k].prix||0; let seuil = postesData[k].seuil; if(seuil===undefined||seuil===null||seuil==='') seuil=5;
    let total = q * p; grandTotal += total;
    let etat='', bg='';
    if(q===0){ etat='<span class="badge-stock badge-red">🔴 RUPTURE</span>'; bg='#ffebee'; nbRupture++; }
    else if(q<=seuil){ etat='<span class="badge-stock badge-orange">🟠 ALERTE</span>'; bg='#fff3e0'; nbAlerte++; }
    else { etat='<span class="badge-stock badge-green">🟢 OK</span>'; bg=''; nbOk++; }
    let expStr = postesData[k].expiration || '';
    let exp = getExpireStat(expStr);
    if(exp.etat==='expire') nbExpire++;
    else if(exp.etat==='bientot') nbBientot++;
    else if(exp.etat==='bon') nbBon++;
    if(stockFilter==='rupture' && q!==0) continue;
    if(stockFilter==='alerte' && !(q>0 && q<=seuil)) continue;
    if(stockFilter==='ok' && !(q>seuil)) continue;
    if(stockFilter==='expire' && exp.etat!=='expire') continue;
    if(stockFilter==='bientot' && exp.etat!=='bientot') continue;
    if(stockFilter==='bon' && exp.etat!=='bon') continue;
    numeroOrdre++;
    let rowBg = bg; if(exp.etat==='expire') rowBg='#ffebee'; else if(exp.etat==='bientot' && !rowBg) rowBg='#fff3e0';
    t+=`<tr style="background:${rowBg}"><td><b style="background:#1877f2;color:white;padding:4px 8px;border-radius:50%">${numeroOrdre}</b></td><td><b>${postesData[k].nom||k}</b></td><td>${isPatron?`<input id="q_${k}" type="number" value="${q}" onchange="updateQ('${k}')" style="padding:4px">`:`<b style="font-size:16px">${q}</b>`}</td><td>${isPatron?`<input id="s_${k}" type="number" value="${seuil}" onchange="updateSeuil('${k}')" placeholder="5" style="padding:4px">`:`<b>${seuil}</b>`}</td><td>${etat}</td><td>${isPatron?`<input id="e_${k}" type="date" value="${expStr}" onchange="updateExpire('${k}')" style="padding:4px">`:`<b>${expStr||'-'}</b>`}</td><td>${exp.label}</td><td>${isPatron?`<input id="p_${k}" type="number" value="${p}" onchange="updatePrix('${k}')" placeholder="0" style="padding:4px">`:`<b>${p.toLocaleString()} GNF</b>`}</td><td><b>${total.toLocaleString()} GNF</b></td>${isPatron?`<td><button onclick="deleteMed('${k}')">X</button></td>`:''}</tr>`;
  }
  t+='</table>';
  document.getElementById('medTable').innerHTML=t;
  document.getElementById('totalStockBox').innerHTML=`<div class="total-box">💰 TOTAL STOCK : ${grandTotal.toLocaleString()} GNF</div>`;
  if(document.getElementById('stockAlerteResume')) document.getElementById('stockAlerteResume').innerHTML=`<div class="stock-alerte-box"><div style="background:#ffebee;color:#c62828">🔴 RUPTURE<br>${nbRupture}</div><div style="background:#fff3e0;color:#ef6c00">🟠 ALERTE<br>${nbAlerte}</div><div style="background:#e8f5e9;color:#2e7d32">🟢 OK<br>${nbOk}</div></div>`;
  if(document.getElementById('expireResume')) document.getElementById('expireResume').innerHTML=`<div class="expire-box"><div style="background:#ffebee;color:#c62828">🔴 EXPIRÉ<br>${nbExpire}</div><div style="background:#fff3e0;color:#ef6c00">🟠 EXPIRE BIENTÔT (60j)<br>${nbBientot}</div><div style="background:#e8f5e9;color:#2e7d32">🟢 BON<br>${nbBon}</div></div><p style="font-size:12px;margin:0;color:#666">Si date passée = EXPIRÉ, ne pas donner. Si il reste 60 jours ou moins = EXPIRE BIENTÔT.</p>`;
  updateAllSelects(); if(document.getElementById('consultTable')) renderConsultations(allCons);
 });
}
function updateSeuil(k){ if(!isPatron) return alert('Seul le Patron'); let s=document.getElementById('s_'+k).value; db.ref('postes/'+k+'/seuil').set(parseInt(s)||0); }
function updateExpire(k){ if(!isPatron) return alert('Seul le Patron'); let v=document.getElementById('e_'+k).value; db.ref('postes/'+k+'/expiration').set(v||''); }
function getSelectHTML(){ let html='<option value="">Choisir médicament</option>'; for(let k in postesData){ let q=postesData[k].quantite||0; let seuil=postesData[k].seuil; if(seuil===undefined||seuil==='') seuil=5; let tag=''; if(q===0) tag=' 🔴 RUPTURE'; else if(q<=seuil) tag=' 🟠 ALERTE'; let exp=getExpireStat(postesData[k].expiration||''); if(exp.etat==='expire') tag+=' 🔴 EXPIRÉ'; else if(exp.etat==='bientot') tag+=' 🟠 EXPIRE BIENTÔT'; html+=`<option value="${k}">${postesData[k].nom||k} (stock:${q} - prix:${postesData[k].prix||0})${tag}</option>`; } return html; }
function addMedRow(){ let div=document.createElement('div'); div.className='med-row'; div.innerHTML=`<select class="medSelect">${getSelectHTML()}</select><input type="number" class="medQte" placeholder="Qté" value="1" style="width:70px"><button class="btn btn-red" style="width:40px;padding:6px" onclick="this.parentElement.remove()">X</button>`; document.getElementById('medRows').appendChild(div); }
function updateAllSelects(){ let selHTML=getSelectHTML(); document.querySelectorAll('.medSelect').forEach(sel=>{ let val=sel.value; sel.innerHTML=selHTML; sel.value=val; }); }
function addMedicament(){ if(!isPatron) return alert('Seul le Patron'); let nom=document.getElementById('newMedName').value.trim(); let prix=parseInt(document.getElementById('newMedPrix').value)||0; let seuil=parseInt(document.getElementById('newMedSeuil').value); if(isNaN(seuil)) seuil=5; let exp=document.getElementById('newMedExpire') ? document.getElementById('newMedExpire').value : ''; if(!nom)return; let key=nom.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now(); db.ref('postes/'+key).set({nom:nom,quantite:0,prix:prix,seuil:seuil,expiration:exp}).then(()=>{ document.getElementById('newMedName').value=''; document.getElementById('newMedPrix').value=''; document.getElementById('newMedSeuil').value=''; if(document.getElementById('newMedExpire')) document.getElementById('newMedExpire').value=''; }); }
function updateQ(k){ if(!isPatron) return alert('Seul le Patron peut changer le stock'); let q=document.getElementById('q_'+k).value; db.ref('postes/'+k+'/quantite').set(parseInt(q)||0); }
function updatePrix(k){ if(!isPatron) return alert('Seul le Patron peut changer le prix'); let p=document.getElementById('p_'+k).value; db.ref('postes/'+k+'/prix').set(parseInt(p)||0); }
function deleteMed(k){if(confirm('Supprimer?')) db.ref('postes/'+k).remove();}
function saveConsultation(){
 let patient=document.getElementById('patientName').value.trim(); if(!patient) return alert('Mets nom du patient');
 let sexe=document.getElementById('patientSexe').value||''; let age=document.getElementById('patientAge').value||''; let ageUnite=document.getElementById('patientAgeUnite').value||'Ans'; let village=document.getElementById('patientVillage').value||''; let tel=document.getElementById('patientTel').value||''; let plainte=document.getElementById('patientPlainte').value||''; let examen=document.getElementById('patientExamen').value||''; let diagnostic=document.getElementById('patientDiag').value||'';
 let rows=document.querySelectorAll('.med-row'); let meds=[];
 for(let r of rows){ let key=r.querySelector('.medSelect').value; let qte=parseInt(r.querySelector('.medQte').value)||0; if(key && qte>0){ meds.push({key:key, nom:postesData[key]?.nom||key, qte:qte, prix:postesData[key]?.prix||0}); } }
 if(meds.length===0) return alert('Ajoute au moins 1 médicament');
 let expired = meds.filter(m=> getExpireStat(postesData[m.key]?.expiration||'').etat==='expire');
 if(expired.length>0){ if(!confirm('⚠️ ATTENTION : '+expired.map(m=>m.nom).join(', ')+' est EXPIRÉ ! Tu veux quand même donner ?')) return; }
 meds.forEach(m=>{ let cur=postesData[m.key]?.quantite||0; db.ref('postes/'+m.key+'/quantite').set(cur - m.qte); });
 db.ref('consultations').push({patient:patient, sexe:sexe, age:age, ageUnite:ageUnite, village:village, tel:tel, plainte:plainte, examen:examen, diagnostic:diagnostic, meds:meds, date:new Date().toLocaleString(), role:role});

function isInMois(dateStr, mois){
  if(!dateStr) return false;
  let d = null;
  if(dateStr.includes('/')){
    let parts = dateStr.split(' ')[0].split('/');
    if(parts[0].length===4){ d = new Date(parts[0], parseInt(parts[1])-1, parseInt(parts[2])); }
    else if(parseInt(parts[0])>12){ d = new Date(parts[2], parseInt(parts[1])-1, parseInt(parts[0])); }
    else { d = new Date(parts[2], parseInt(parts[0])-1, parseInt(parts[1])); }
  } else if(dateStr.includes('-')){ d = new Date(dateStr.split(' ')[0]); } else { return false; }
  if(isNaN(d)) return false;
  let m = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  return m === mois;
}

              for(let n in parPers){ let r = 600000 - (parPers[n].ret*5000 + parPers[n].abs*20000); if(r<0) r=0; totalEnv+=r; }

              for(let k in postesData){ let q=postesData[k].quantite||0; let seuil=postesData[k].seuil; if(seuil===undefined||seuil==='') seuil=5; let p=postesData[k].prix||0; totalStock += q*p; if(q===0) nbRupture++; else if(q<=seuil) nbAlerte++; else nbOk++; let ex=getExpireStat(postesData[k].expiration||''); if(ex.etat==='expire') nbExpire++; else if(ex.etat==='bientot') nbBientot++; else if(ex.etat==='bon') nbBon++; }
              if(document.getElementById('rapportBox')){
                document.getElementById('rapportBox').innerHTML = `
                <div class="rapport-big">📊 RAPPORT - ${moisLabel}<br><small style="font-weight:normal">Filanidialakoro - Poste Santé - Chef Bakary Sidibe</small></div>
                <div class="rapport-card"><h4>👥 1. PATIENTS</h4><div>Nombre de patients ce mois : <b>${nbPatients}</b></div><div>Médicaments vendus ce mois : <b>${nbMeds}</b></div><div>Somme médicaments vendus : <b>${sommeMeds.toLocaleString()} GNF</b></div><div style="margin-top:6px"><b>Top Diagnostics :</b><br>${topDiag}</div></div>
                <div class="rapport-card"><h4>💰 2. ARGENT - CAISSE</h4><div>Entrée Caisse ce mois : <b style="color:#2e7d32">+ ${totalEntree.toLocaleString()} GNF</b></div><div>Sortie Caisse ce mois : <b style="color:#c62828">- ${totalSortie.toLocaleString()} GNF</b></div><div><b>Reste en Caisse ce mois : ${resteCaisse.toLocaleString()} GNF</b></div></div>

                <div class="rapport-card"><h4>💊 5. STOCK (aujourd'hui)</h4><div>🔴 RUPTURE : <b>${nbRupture}</b> &nbsp; 🟠 ALERTE : <b>${nbAlerte}</b> &nbsp; 🟢 OK : <b>${nbOk}</b></div><div>🔴 EXPIRÉ : <b>${nbExpire}</b> &nbsp; 🟠 EXPIRE BIENTÔT : <b>${nbBientot}</b> &nbsp; 🟢 BON : <b>${nbBon}</b></div><div>Total valeur stock : <b>${totalStock.toLocaleString()} GNF</b></div></div>

  });
  if(!envoyes) return alert('Coche au moins 1 médicament');
  alert('✅ COMMANDE ENVOYÉE Chef !\n\n'+envoyes+' médicaments envoyés à '+four+'\nTotal commande : '+totalCmd.toLocaleString()+' GNF\nIls sont dans En Attente.\nQuand il te livre, clique ✅ Reçu.');
}
function renderCommandesEnAttente(){
  let el = document.getElementById('cmdEnAttente'); if(!el) return;
  let keys = Object.keys(commandesData);
  if(!keys.length){ el.innerHTML=''; return; }
  let h = '<div class="total-box" style="background:#fff3cd">⏳ COMMANDES EN ATTENTE : '+keys.length+'</div><table><tr><th>Date</th><th>Fournisseur</th><th>Médicament</th><th>Qté</th><th>Prix Achat Unitaire</th><th>Total</th><th>Action</th></tr>';
  keys.reverse().forEach(k=>{
    let c = commandesData[k];
    let prixAff = c.prixAchat ? c.prixAchat.toLocaleString()+' GNF' : '-';
    let totalAff = c.total ? c.total.toLocaleString()+' GNF' : ((c.qte||0)*(c.prixAchat||0)).toLocaleString()+' GNF';
    h += `<tr><td>${c.date}</td><td><b>${c.fournisseur}</b><br><small>📞 ${c.telFour||'-'}</small></td><td>${c.medNom}</td><td><b>${c.qte}</b></td><td><b>${prixAff}</b></td><td><b>${totalAff}</b></td><td><button class="btn btn-green" style="padding:8px" onclick="recevoirCommande('${k}')">✅ REÇU - ENTRER DANS STOCK</button><br><button class="btn btn-red" style="padding:6px;margin-top:4px" onclick="annulerCommande('${k}')">X Annuler</button></td></tr>`;
  });
  h += '</table>';
  el.innerHTML = h;
}
function recevoirCommande(cmdKey){
  let c = commandesData[cmdKey]; if(!c) return;
  let prixAchat = c.prixAchat || parseInt(prompt('Prix d’achat unitaire pour '+c.medNom+' chez '+c.fournisseur+' ?', '4000'))||0;
  if(!prixAchat) return alert('Mets le prix d’achat');
  let prixVente = parseInt(prompt('Nouveau prix de vente pour '+c.medNom+' (laisse vide si tu ne changes pas) ?', ''))||0;
  let expire = prompt('Date expiration pour '+c.medNom+' (AAAA-MM-JJ, laisse vide si tu ne changes pas) ?', '')||'';
  let medKey = c.medKey;
  let qte = c.qte;
  let medNom = c.medNom;
  let totalAchat = qte * prixAchat;
  let ancienStock = postesData[medKey]?.quantite||0;
  let nouveauStock = ancienStock + qte;
  db.ref('achats_fournisseur').push({fournisseur:c.fournisseur, telFour:c.telFour||'', medKey:medKey, medNom:medNom, qte:qte, prixAchat:prixAchat, prixVente:prixVente, total:totalAchat, expiration:expire, note:'Commande Automatique - Reçu', ancienStock:ancienStock, nouveauStock:nouveauStock, date:new Date().toLocaleString(), dateISO:new Date().toISOString().split('T')[0]});
  let update = {quantite:nouveauStock, prixAchat:prixAchat};
  if(prixVente>0) update.prix = prixVente;
  if(expire) update.expiration = expire;
  db.ref('postes/'+medKey).update(update);
  db.ref('commandes_fournisseur/'+cmdKey).remove();
  alert('✅ REÇU Chef !\n\n'+medNom+' x '+qte+' de '+c.fournisseur+'\nPrix Achat : '+prixAchat.toLocaleString()+' GNF\nTotal: '+totalAchat.toLocaleString()+' GNF\n\n📦 STOCK PERMANENT : '+ancienStock+' -> '+nouveauStock+' (Automatique)');
}
function annulerCommande(k){ if(!confirm('Annuler cette commande ?')) return; db.ref('commandes_fournisseur/'+k).remove(); }
function fillAchatSelect(){
  let sel = document.getElementById('aMed'); if(!sel) return;
  let old = sel.value;
  let html = '<option value="">Choisir médicament à acheter...</option>';
  for(let k in postesData){ html += `<option value="${k}">${postesData[k].nom||k} - Stock actuel: ${postesData[k].quantite||0}</option>`; }
  html += '<option value="__new__">➕ NOUVEAU MÉDICAMENT (pas encore dans le stock)</option>';
  sel.innerHTML = html;
  if(old && old!=='__new__') sel.value = old;
  sel.onchange = function(){
    if(this.value==='__new__'){
      let nom = prompt('Nom du nouveau médicament ?'); if(!nom){ this.value=''; return; }
      let key = nom.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now();
      db.ref('postes/'+key).set({nom:nom,quantite:0,prix:0,seuil:5,expiration:''}).then(()=>{ alert('✅ Médicament créé dans Stock Permanent. Choisis-le à nouveau.'); });
    }
  };
}
function saveAchat(){
  let four = document.getElementById('aFournisseur').value.trim();
  let telF = document.getElementById('aTelFour').value.trim();
  let medKey = document.getElementById('aMed').value;
  let qte = parseInt(document.getElementById('aQte').value)||0;
  let prixAchat = parseInt(document.getElementById('aPrixAchat').value)||0;
  let prixVente = parseInt(document.getElementById('aPrixVente').value)||0;
  let expire = document.getElementById('aDateExpire').value||'';
  let note = document.getElementById('aNote').value||'';
  if(!four) return alert('Mets le nom du fournisseur');
  if(!medKey || medKey==='__new__') return alert('Choisis le médicament');
  if(!qte) return alert('Mets la quantité');
  if(!prixAchat) return alert('Mets le prix d’achat');
  let medNom = postesData[medKey]?.nom||medKey;
  let totalAchat = qte * prixAchat;
  let ancienStock = postesData[medKey]?.quantite||0;
  let nouveauStock = ancienStock + qte;
  db.ref('achats_fournisseur').push({fournisseur:four, telFour:telF, medKey:medKey, medNom:medNom, qte:qte, prixAchat:prixAchat, prixVente:prixVente, total:totalAchat, expiration:expire, note:note, ancienStock:ancienStock, nouveauStock:nouveauStock, date:new Date().toLocaleString(), dateISO:new Date().toISOString().split('T')[0]});
  let update = {quantite:nouveauStock, prixAchat:prixAchat};
  if(prixVente>0) update.prix = prixVente;
  if(expire) update.expiration = expire;
  db.ref('postes/'+medKey).update(update);
  alert('✅ ACHAT RÉUSSI Chef !\n\n'+medNom+' x '+qte+' chez '+four+'\nPrix Achat : '+prixAchat.toLocaleString()+' GNF\nTotal: '+totalAchat.toLocaleString()+' GNF\n\n📦 STOCK PERMANENT : '+ancienStock+' -> '+nouveauStock+' (Automatique)');
  document.getElementById('aQte').value=''; document.getElementById('aPrixAchat').value=''; document.getElementById('aPrixVente').value=''; document.getElementById('aNote').value='';
}
function renderAchats(){
  let q = (document.getElementById('aSearch')?.value||'').toLowerCase();
  let totalAchat=0, totalQte=0; let parFour={};
  let h='<table><tr><th>Date</th><th>Fournisseur</th><th>Médicament</th><th>Qté</th><th>Prix Achat</th><th>Total</th><th>Stock Avant -> Après</th><th>Note</th>'+(isPatron?'<th>X</th>':'')+'</tr>';
  let keys = Object.keys(achatsData).reverse();
  for(let k of keys){
    let a = achatsData[k]; totalAchat+=a.total||0; totalQte+=a.qte||0;
    parFour[a.fournisseur]=(parFour[a.fournisseur]||0)+(a.total||0);
    let txt=(a.fournisseur+' '+a.medNom+' '+a.note).toLowerCase();
    if(q && !txt.includes(q)) continue;
    h+=`<tr><td>${a.date}</td><td><b>${a.fournisseur}</b><br><small>📞 ${a.telFour||'-'}</small></td><td>${a.medNom}</td><td><b>${a.qte}</b></td><td>${(a.prixAchat||0).toLocaleString()} GNF</td><td><b>${(a.total||0).toLocaleString()} GNF</b></td><td>${a.ancienStock ?? '-'} -> <b>${a.nouveauStock ?? '-'}</b></td><td>${a.note||'-'}<br><small>Expire: ${a.expiration||'-'}</small></td>${isPatron?`<td><button onclick="deleteAchat('${k}')">X</button></td>`:''}</tr>`;
  }
  h+='</table>';
  if(document.getElementById('aList')) document.getElementById('aList').innerHTML = keys.length? h : 'Aucun achat encore';
  let topFour = Object.keys(parFour).sort((a,b)=>parFour[b]-parFour[a]).slice(0,3).map(f=>`<div>• ${f} : <b>${parFour[f].toLocaleString()} GNF</b></div>`).join('');
  if(document.getElementById('aResume')) document.getElementById('aResume').innerHTML = `<div class="total-box">🛒 TOTAL ACHATS : ${totalAchat.toLocaleString()} GNF &nbsp; | &nbsp; Quantité totale : ${totalQte}</div><div class="rapport-card"><h4>🏆 Top Fournisseurs</h4>${topFour||'Aucun'}</div>`;
}
function deleteAchat(k){ if(!confirm('Supprimer cet achat ? Le stock ne va pas diminuer seul, tu dois le corriger à la main dans Médicaments si tu t’es trompé.')) return; db.ref('achats_fournisseur/'+k).remove(); }
loadMedicaments();
</script>
