<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacie - PATRON</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;margin:0;padding:10px}
h1{text-align:center;font-size:22px}
button{border:none;padding:10px 14px;border-radius:10px;margin:4px;font-weight:bold;cursor:pointer;color:white}
.bleu{background:#2196F3}.vert{background:#4CAF50}.orange{background:#FF9800}.gris{background:#777}.rouge{background:#e53935}
.carte{background:white;padding:12px;border-radius:12px;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px;text-align:center;font-size:14px}
input,select{width:100%;padding:8px;margin:4px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.cache{display:none}
</style>
</head>
<body>

<div id="login" style="text-align:center;margin-top:80px">
<h1>💊 PHARMACIE</h1>
<p>Entrez votre code</p>
<input id="codeInput" type="password" placeholder="Code" style="max-width:250px">
<br>
<button class="bleu" onclick="login()">ENTRER</button>
<p id="msg" style="color:red"></p>
</div>

<div id="app" class="cache">
<h1 id="titre">👤 PATRON - Accès complet</h1>
<div style="text-align:center">
<button class="bleu" onclick="show('stockDiv')">💊 STOCK</button>
<button class="bleu" onclick="show('patientDiv')">👤 PATIENT</button><br>
<button class="orange" onclick="show('caisseDiv')">💰 CAISSE DU JOUR</button>
<button class="orange" onclick="show('archivesDiv')">📁 ARCHIVES</button><br>
<button class="gris" onclick="logout()">🔒 Sortir</button>
</div>

<!-- STOCK -->
<div id="stockDiv" class="carte">
<h3>💊 Stock - Reste des médicaments</h3>
<div id="formStock">
<input id="nomMed" placeholder="Nom du médicament">
<input id="qteMed" type="number" placeholder="Stock / Quantité">
<input id="prixMed" type="number" placeholder="Prix en GNF">
<button class="vert" onclick="ajouterMed()">+ Ajouter</button>
</div>
<table>
<thead><tr><th>Médicament</th><th>Stock</th><th class="colPrix">Prix</th><th class="colPrix">Total</th><th>X</th></tr></thead>
<tbody id="tbodyStock"></tbody>
</table>
<p><b id="totalStock">Total Stock : 0 GNF</b></p>
</div>

<!-- PATIENT -->
<div id="patientDiv" class="carte cache">
<h3>👤 Patient - Vente</h3>
<input id="nomPatient" placeholder="Nom du patient">
<select id="selectMed"></select>
<input id="qteVente" type="number" placeholder="Quantité vendue" value="1">
<button class="vert" onclick="vendre()">Vendre</button>
<p id="msgVente"></p>
</div>

<!-- CAISSE -->
<div id="caisseDiv" class="carte cache">
<h3>💰 Caisse du jour</h3>
<p id="caisseJour">0 GNF</p>
<div id="listeVentes"></div>
<button class="rouge" onclick="cloturer()">Clôturer la journée -> Archives</button>
</div>

<!-- ARCHIVES -->
<div id="archivesDiv" class="carte cache">
<h3>📁 Archives</h3>
<div id="listeArchives"></div>
</div>

</div>

<script>
let role = "";
let stock = JSON.parse(localStorage.getItem("stock")) || [];
stock = stock.map(m => ({
  medicament: m.medicament || m.nom || m.name || "",
  stock: Number(m.stock || m.quantite || m.qte || 0),
  prix: Number(m.prix || m.price || 0)
})).filter(m => m.medicament !== "");
let ventes = JSON.parse(localStorage.getItem("ventes")) || [];
let archives = JSON.parse(localStorage.getItem("archives")) || [];

function save(){ localStorage.setItem("stock", JSON.stringify(stock)); localStorage.setItem("ventes", JSON.stringify(ventes)); localStorage.setItem("archives", JSON.stringify(archives)); }

function login(){
  let c = document.getElementById("codeInput").value;
  if(c==="1989"){ role="patron"; document.getElementById("titre").innerText="👤 PATRON - Accès complet"; }
  else if(c==="1111"){ role="suppleant"; document.getElementById("titre").innerText="👤 SUPPLÉANT - Stock + Patient"; }
  else { document.getElementById("msg").innerText="Code incorrect"; return; }
  document.getElementById("login").classList.add("cache");
  document.getElementById("app").classList.remove("cache");
  appliquerRole(); afficher();
}
function logout(){ location.reload(); }
function appliquerRole(){
  let isSup = role==="suppleant";
  document.querySelectorAll(".colPrix").forEach(e=> e.style.display = isSup ? "none" : "");
  document.getElementById("formStock").style.display = isSup ? "none" : "block";
  document.getElementById("totalStock").style.display = isSup ? "none" : "block";
  if(isSup){ show('stockDiv'); }
}
function show(id){
  // CORRIGÉ : Suppléant peut aller sur STOCK + PATIENT
  if(role==="suppleant" && id!=="stockDiv" && id!=="patientDiv"){ alert("Accès refusé - Patron seulement"); return; }
  ["stockDiv","patientDiv","caisseDiv","archivesDiv"].forEach(x=> document.getElementById(x).classList.add("cache"));
  document.getElementById(id).classList.remove("cache");
  afficher();
}
function afficher(){
  let tbody=document.getElementById("tbodyStock"); tbody.innerHTML="";
  let total=0;
  stock.forEach((m,i)=>{
    let tot = m.stock * m.prix; total+=tot;
    tbody.innerHTML+=`<tr><td>${m.medicament}</td><td><input type="number" value="${m.stock}" onchange="modif(${i},'stock',this.value)"></td><td class="colPrix" style="display:${role==='suppleant'?'none':''}"><input type="number" value="${m.prix}" onchange="modif(${i},'prix',this.value)"></td><td class="colPrix" style="display:${role==='suppleant'?'none':''}">${tot.toLocaleString()} GNF</td><td><span style="color:red;cursor:pointer" onclick="supprimer(${i})">X</span></td></tr>`;
  });
  document.getElementById("totalStock").innerText="Total Stock : "+total.toLocaleString()+" GNF";
  let sel=document.getElementById("selectMed"); sel.innerHTML="";
  stock.forEach((m,i)=>{ sel.innerHTML+=`<option value="${i}">${m.medicament} - Stock: ${m.stock}</option>`; });
  let caisse=ventes.reduce((a,v)=>a+v.total,0);
  document.getElementById("caisseJour").innerText=caisse.toLocaleString()+" GNF";
  document.getElementById("listeVentes").innerHTML=ventes.map(v=>`<p>${v.patient} - ${v.medicament} x${v.qte} = ${v.total.toLocaleString()} GNF</p>`).join("") || "<p>Aucune vente</p>";
  document.getElementById("listeArchives").innerHTML=archives.map(a=>`<p><b>${a.date}</b> : ${a.total.toLocaleString()} GNF - ${a.nb} ventes</p>`).join("") || "<p>Aucune archive</p>";
  appliquerRole();
}
function modif(i,champ,val){ stock[i][champ]=Number(val)||0; save(); afficher(); }
function ajouterMed(){
  let nom=document.getElementById("nomMed").value.trim();
  let qte=Number(document.getElementById("qteMed").value)||0;
  let prix=Number(document.getElementById("prixMed").value)||0;
  if(!nom){ alert("Mets le nom"); return; }
  stock.push({medicament:nom, stock:qte, prix:prix});
  document.getElementById("nomMed").value=""; document.getElementById("qteMed").value=""; document.getElementById("prixMed").value="";
  save(); afficher();
}
function supprimer(i){ if(confirm("Supprimer ?")){ stock.splice(i,1); save(); afficher(); } }
function vendre(){
  let nom=document.getElementById("nomPatient").value.trim() || "Anonyme";
  let idx=document.getElementById("selectMed").value;
  let qte=Number(document.getElementById("qteVente").value)||1;
  if(stock[idx]==undefined){ alert("Pas de médicament"); return; }
  if(stock[idx].stock < qte){ alert("Stock insuffisant"); return; }
  stock[idx].stock-=qte;
  let total=qte*stock[idx].prix;
  ventes.push({patient:nom, medicament:stock[idx].medicament, qte:qte, total:total});
  save(); afficher();
  document.getElementById("msgVente").innerText="Vendu : "+total.toLocaleString()+" GNF";
}
function cloturer(){
  if(ventes.length===0){ alert("Caisse vide"); return; }
  let total=ventes.reduce((a,v)=>a+v.total,0);
  archives.push({date:new Date().toLocaleString(), total:total, nb:ventes.length});
  ventes=[];
  save(); afficher(); alert("Journée clôturée");
}
</script>
</body>
</html>
