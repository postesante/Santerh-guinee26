 <script>
// CODE DE VERROUILLAGE - à mettre tout en haut de ton <script>
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role');
if(role === 'suppleant'){
  window.addEventListener('DOMContentLoaded', ()=>{
    document.querySelectorAll('#btnPrimes, #btnDettes, .primes-box, .dettes-box').forEach(el=>{
      if(el){
        el.style.opacity='0.2';
        el.style.pointerEvents='none';
        el.innerHTML += '<br><span style=\"color:red\">🔒 Verrouillé</span>';
      }
    });
    const top = document.getElementById('top') || document.querySelector('.header');
    if(top){ top.style.background='#ea580c'; }
    const title = document.getElementById('roleTitle');
    if(title){ title.innerText='🟠 SUPPLÉANT - Filanidialakoro (primes verrouillées)'; }
  });
}
</script>
