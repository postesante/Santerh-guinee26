<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filanidialakoro</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f0f2f5;margin:0;padding:10px}
.header{background:#1877f2;color:white;padding:16px;text-align:center;border-radius:10px;font-weight:bold;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:white;padding:18px;border-radius:10px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer;font-weight:bold;font-size:16px}
#content{background:white;margin-top:12px;padding:12px;border-radius:10px;min-height:200px}
input,select,textarea{width:100%;padding:13px;margin:6px 0;border:2px solid #1877f2;border-radius:8px;background:#fffde7;font-size:16px}
.btn{border:none;padding:13px;border-radius:8px;width:100%;font-weight:bold;color:white;cursor:pointer;margin-top:6px;font-size:16px}
.btn-blue{background:#1877f2}.btn-green{background:#42b72a}.btn-orange{background:#ff9800}.btn-red{background:#e74c3c}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}th,td{border:1px solid #ddd;padding:6px}
.section{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #e0e0e0}
.thermo-box{background:#fff3cd;border:3px solid #1877f2;padding:12px;border-radius:10px;margin:8px 0}
.thermo-box input{background:white;font-size:18px;font-weight:bold}
.thermo-result{padding:14px;border-radius:10px;text-align:center;font-weight:bold;margin-top:10px;border:2px solid #000;font-size:17px;background:#fff}
</style>
</head>
<body>

<div class="header">👑 PATRON<br><span style="font-size:13px;font-weight:normal">Filanidialakoro - Poste Santé</span></div>

<div class="grid">
<div class="card" onclick="show('med')">💊<br>Médicaments</div>
<div class="card" onclick="show('dettes')">📒<br>Dettes Payé</div>
<div class="card" onclick="show('thermo')" style="background:#fff3cd;border:3px solid #1877f2">🌡️<br>Thermomètre</div>
<div class="card" onclick="show('suivi')">📈<br>SUIVI LIVE</div>
<div class="card" onclick="show('primes')">🏆<br>Primes</div>
<div class="card" onclick="show('obs')">📝<br>Observation</div>
<div class="card" onclick="show('presence')">✅<br>Présence 600k</div>
<div class="card" onclick="show('gps')">📍<br>Localisation GPS</div>
</div>

<div id="content"></div>

<script>
// --- SAUVEGARDE LOCALE SIMPLE ---
function get(k){ try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []} }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)) }

// --- THERMOMETRE ---
function thermoMsg(t){
  if(t<36.5) return ['🔵 BASSE - Couvre-toi bien','#38bdf8','#000'];
  if(t<=37.5) return ['🟢 NORMAL - Pas de fièvre','#4ade80','#000'];
  if(t<=38.5) return ['🟡 FIÈVRE LÉGÈRE - Repos, bois beaucoup d’eau','#facc15','#000'];
  return ['🔴 ALERTE ROUGE - FIÈVRE FORTE ! Hôpital vite !','#ef4444','#fff'];
}
function checkThermo(){
  let nom=document.getElementById('tNom').value||'Patient';
  let t=parseFloat(document.getElementById('tTemp').value);
  if(!t) return alert('Mets température Ex: 38.2');
  let r=thermoMsg(t);
  let el=document.getElementById('tRes');
  el.innerHTML=nom+' : '+t+'°C<br>'+r[0];
  el.style.background=r[1]; el.style.color=r[2];
}
function checkThermo2(){
  let t=parseFloat(document.getElementById('pTemp').value);
  if(!t) return alert('Mets température Ex: 38.2');
  let r=thermoMsg(t);
  let el=document.getElementById('tRes2');
  el.innerHTML=t+'°C - '+r[0]; el.style.background=r[1]; el.style.color=r[2];
}

function show(m){
  let c=document.getElementById('content');
  if(m=='thermo'){
    c.innerHTML=`
    <div class="thermo-box">
    <h3 style="margin:0">🌡️ Thermomètre - Patient</h3>
    <p>1. Mesure avec le thermomètre<br>2. Tape le chiffre<br>3. Clique VÉRIFIER</p>
    <input id="tNom" placeholder="Nom du patient Ex: Mamadou">
    <input id="tTemp" type="number" step="0.1" placeholder="Température Ex: 38.2">
    <button class="btn btn-blue" onclick="checkThermo()">VÉRIFIER LA TEMPÉRATURE</button>
    <div id="tRes" class="thermo-result">👆 Le résultat va s'afficher ici en couleur</div>
    </div>
    <div class="section"><b>Rappel :</b><br>36.5 à 37.5 = Normal 🟢<br>37.5 à 38.5 = Fièvre légère 🟡<br>38.5 et + = Hôpital vite 🔴</div>`;
  }
  if(m=='med'){
    let meds=get('meds');
    let rows=meds.map((x,i)=>`<tr><td>${x.nom}</td><td>${x.qte}</td><td>${x.prix} GNF</td><td><button onclick="delMed(${i})">X</button></td></tr>`).join('');
    let cons=get('cons');
    let hCons=cons.slice().reverse().map(x=>`<tr><td>${x.date}</td><td><b>${x.patient}</b></td><td>${x.temp?x.temp+'°C - '+thermoMsg(parseFloat(x.temp))[0]:'-'}</td><td>${x.diag||''}</td><td>${x.medsTxt||''}</td></tr>`).join('');
    c.innerHTML=`
    <div class="section"><b>STOCK PERMANENT</b>
    <input id="mNom" placeholder="Nom médicament">
    <input id="mPrix" type="number" placeholder="Prix ex: 500">
    <input id="mQte" type="number" placeholder="Quantité ex: 10">
    <button class="btn btn-green" onclick="addMed()">AUGMENTER LA LISTE</button>
    <table><tr><th>Nom</th><th>Stock</th><th>Prix</th><th>X</th></tr>${rows||'<tr><td colspan=4>Aucun médicament</td></tr>'}</table></div>
    <div class="section" style="background:#e3f2fd"><b>👤 NOUVEAU PATIENT</b>
    <input id="pNom" placeholder="Nom et Prénom du patient">
    <input id="pAge" type="number" placeholder="Âge">
    <div class="thermo-box"><b>🌡️ TEMPÉRATURE</b>
    <input id="pTemp" type="number" step="0.1" placeholder="Température Ex: 38.2">
    <button class="btn btn-blue" onclick="checkThermo2()">VÉRIFIER TEMPÉRATURE</button>
    <div id="tRes2" class="thermo-result">Résultat ici</div></div>
    <input id="pPlainte" placeholder="Plainte">
    <input id="pDiag" placeholder="Diagnostic">
    <input id="pMed" placeholder="Médicament donné ex: Paracétamol x2">
    <button class="btn btn-orange" onclick="savePatient()">✅ ENREGISTRER PATIENT</button></div>
    <div class="section"><b>📋 HISTORIQUE</b><table><tr><th>Date</th><th>Patient</th><th>Temp</th><th>Diag</th><th>Traitement</th></tr>${hCons||''}</table></div>`;
  }
  if(m=='dettes'){
    let d=get('dettes'); let h=d.map((x,i)=>`<tr><td>${x.nom}</td><td>${x.montant}</td><td>${x.date}</td><td><button onclick="delDette(${i})">X</button></td></tr>`).join('');
    c.innerHTML=`<h3>📒 Dettes Payé</h3><input id="dNom" placeholder="Nom"><input id="dMont" type="number" placeholder="Montant"><button class="btn btn-blue" onclick="saveDette()">Enregistrer</button><table><tr><th>Nom</th><th>Montant</th><th>Date</th><th>X</th></tr>${h}</table>`;
  }
  if(m=='suivi'){
    let cons=get('cons'); let h=cons.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.patient}</td><td>${x.temp||''}°C</td><td>${x.diag||''}</td><td>${x.medsTxt||''}</td></tr>`).join('');
    c.innerHTML=`<h3>📈 SUIVI LIVE</h3><table><tr><th>Date</th><th>Patient</th><th>Temp</th><th>Diag</th><th>Traitement</th></tr>${h}</table>`;
  }
  if(m=='primes'){
    let p=get('primes'); let h=p.map(x=>`<tr><td>${x.nom}</td><td>${x.montant}</td></tr>`).join('');
    c.innerHTML=`<h3>🏆 Primes</h3><input id="prNom" placeholder="Nom"><input id="prMont" type="number" placeholder="Montant"><button class="btn btn-blue" onclick="savePrime()">Enregistrer</button><table><tr><th>Nom</th><th>Montant</th></tr>${h}</table>`;
  }
  if(m=='obs'){
    let o=get('obs'); let h=o.map(x=>`<div style="padding:6px;border-bottom:1px solid #eee"><b>${x.date}</b> ${x.txt}</div>`).join('');
    c.innerHTML=`<h3>📝 Observation</h3><textarea id="oTxt" rows="3"></textarea><button class="btn btn-blue" onclick="saveObs()">Enregistrer</button><div>${h}</div>`;
  }
  if(m=='presence'){
    let p=get('pres'); let h=p.map(x=>`<tr><td>${x.nom}</td><td>${x.statut}</td><td>${x.date}</td></tr>`).join('');
    c.innerHTML=`<h3>✅ Présence 600k</h3><input id="preNom" placeholder="Nom"><select id="preSt"><option>Présent</option><option>Absent</option></select><button class="btn btn-blue" onclick="savePres()">Valider</button><table><tr><th>Nom</th><th>Statut</th><th>Date</th></tr>${h}</table>`;
  }
  if(m=='gps'){
    c.innerHTML=`<h3>📍 Localisation GPS</h3><p>Clique pour enregistrer ta position</p><button class="btn btn-blue" onclick="getGPS()">📍 MA POSITION</button><div id="gpsRes"></div>`;
  }
}
function addMed(){ let n=document.getElementById('mNom').value; let p=document.getElementById('mPrix').value; let q=document.getElementById('mQte').value; if(!n) return alert('Mets nom'); let a=get('meds'); a.push({nom:n,prix:p,qte:q}); save('meds',a); show('med'); }
function delMed(i){ let a=get('meds'); a.splice(i,1); save('meds',a); show('med'); }
function savePatient(){ let nom=document.getElementById('pNom').value; if(!nom) return alert('Mets nom patient'); let a=get('cons'); a.push({patient:nom,age:document.getElementById('pAge').value,temp:document.getElementById('pTemp').value,plainte:document.getElementById('pPlainte').value,diag:document.getElementById('pDiag').value,medsTxt:document.getElementById('pMed').value,date:new Date().toLocaleString()}); save('cons',a); alert('✅ '+nom+' enregistré'); show('med'); }
function saveDette(){ let n=document.getElementById('dNom').value; let m=document.getElementById('dMont').value; if(!n||!m) return; let a=get('dettes'); a.push({nom:n,montant:m,date:new Date().toLocaleString()}); save('dettes',a); show('dettes'); }
function delDette(i){ let a=get('dettes'); a.splice(i,1); save('dettes',a); show('dettes'); }
function savePrime(){ let n=document.getElementById('prNom').value; let m=document.getElementById('prMont').value; let a=get('primes'); a.push({nom:n,montant:m}); save('primes',a); show('primes'); }
function saveObs(){ let t=document.getElementById('oTxt').value; if(!t) return; let a=get('obs'); a.push({txt:t,date:new Date().toLocaleString()}); save('obs',a); show('obs'); }
function savePres(){ let n=document.getElementById('preNom').value; let s=document.getElementById('preSt').value; let a=get('pres'); a.push({nom:n,statut:s,date:new Date().toLocaleString()}); save('pres',a); show('presence'); }
function getGPS(){ if(!navigator.geolocation) return alert('GPS non supporté'); navigator.geolocation.getCurrentPosition(p=>{ document.getElementById('gpsRes').innerHTML=`<p>📍 ${p.coords.latitude}, ${p.coords.longitude}</p><a href="https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}" target="_blank">🗺️ Voir sur Maps</a>`; }, ()=>alert('Autorise GPS')); }
show('med');
</script>
</body>
</html>
